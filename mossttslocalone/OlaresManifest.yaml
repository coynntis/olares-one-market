spec:
  versionName: 1.0.0
  featuredImage: https://cdn.olares.com/images/2026/08/178fb24dc8b7b1e4745cc51b6ca33043.png
  upgradeDescription: |
    v1.0.0: OpenMOSS MOSS-TTS-Local-Transformer-v1.5 via SGLang-Omni OpenAI /v1/audio/speech —
    31 languages (Cantonese yue), zero-shot clone, pauses, 48 kHz stereo.
  fullDescription: |
    MOSS-TTS-Local-Transformer-v1.5 (OpenMOSS / MOSI.AI) — ~5B local-transformer TTS with
    native 48 kHz stereo, zero-shot cloning, long-form, duration control, Pinyin/IPA, and
    31 languages including Cantonese (language=Cantonese / yue).

    Served by SGLang-Omni (lmsysorg/sglang-omni) with OpenAI-compatible /v1/audio/speech.

    ===== HOW TO USE =====

    In-cluster: http://mossttslocalone:8000
    Shared entrance: http://<route-id>.shared.olares.com

    --- Basic speech ---

    curl -X POST http://mossttslocalone:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"input":"你好，欢迎使用 MOSS-TTS。","language":"Chinese"}' \
      -o out.wav

    --- Cantonese ---

    curl -X POST http://mossttslocalone:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"input":"你好啊，食咗饭未啊？","language":"Cantonese"}' \
      -o yue.wav

    --- Voice cloning ---

    curl -X POST http://mossttslocalone:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"input":"Cloned line.","ref_audio":"https://example.com/ref.wav","language":"English"}' \
      -o clone.wav

    Inline pause: "句子前[pause 1.5s]句子后"

    First boot downloads ~10GB+ weights to shared HF cache.
    Needs substantial VRAM (~12GB+); exclusive GPU recommended on Olares One.
    Docs: https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
  developer: OpenMOSS / MOSI.AI
  website: https://github.com/OpenMOSS/MOSS-TTS
  sourceCode: https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
  submitter: coynntis
