    Image: `aamsellem/buun-llama-cpp:87c351d2` with `--spec-type draft-mtp --spec-draft-n-max 3 --reasoning off`.
    froggeric Qwen fixed chat template. Pair with `llamacppqwopus27coder1` for SWE-bench coding (no MTP).

    Olares One OpenAI-compatible API on port 8000 (llama-server); client entrance proxies on 8080.
