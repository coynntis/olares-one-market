---
olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  lingbotdepthone: 1
  lingbotdepthonecli: 1
metadata:
  name: lingbotdepthone
  icon: https://cdn.olares.com/images/2026/07/1cf1defd3fa914cef3ff2151c9d44e24.png
  description: Depth completion Gradio + REST (ViT-L v0.5)
  title: LingBot Depth One
  version: 1.0.9
  categories:
    - AI
sharedEntrances:
  - name: lingbotdepthone
    host: sharedentrances-lingbotdepthone
    port: 0
    title: LingBot Depth One API
    icon: https://cdn.olares.com/images/2026/07/1cf1defd3fa914cef3ff2151c9d44e24.png
    invisible: true
    authLevel: internal
entrances:
  - name: lingbotdepthonecli
    port: 8080
    host: lingbotdepthonecli
    title: LingBot Depth One
    icon: https://cdn.olares.com/images/2026/07/1cf1defd3fa914cef3ff2151c9d44e24.png
    openMethod: window
    authLevel: internal
spec:
  versionName: 1.0.9
  featuredImage: https://cdn.olares.com/images/2026/07/ae8956833b2a8fc5fb32313981eb11ac.png
  fullDescription: |
    LingBot-Depth metric depth refinement / completion for Olares One.

    Hardware: Olares One — RTX 5090M 24GB + 96GB DDR5.

    Runtime image: pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (required for sm_120).

    Weights: robbyant/lingbot-depth-pretrain-vitl-14-v0.5
    Source: https://github.com/Robbyant/lingbot-depth
    Project: https://technology.robbyant.com/lingbot-depth

    Boot lessons (Krea soft-ready):
    - soft-ready HTTP on :7860 before uv/pip/HF download (pass ~30m install gate)
    - uv pip --target /workspace/lingbotdepthone/site-packages (persist uv + cache)
    - purge torch shadow from site-packages (image owns torch)
    - bootstrap attempts + download progress → /workspace/lingbotdepthone/bootstrap.log
    - GET /health shows phase / attempts_tail while installing

    UI: / and /ui · REST under /api/v1 · health: GET /health
  developer: Robbyant
  website: https://technology.robbyant.com/lingbot-depth
  sourceCode: https://github.com/Robbyant/lingbot-depth
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/Robbyant/lingbot-depth
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '11'
      requiredMemory: 4Gi
      limitedMemory: 33Gi
      requiredDisk: 20Gi
      limitedDisk: 60Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
  upgradeDescription: |
    - **1.0.9**: Depth load uses model.pt (or HF id) — never weights dir (fixes Is a directory).
    - **1.0.8**: Fix Gradio file URLs — import mount_gradio; redirect /gradio_api/* to /ui/gradio_api/* (query preserved).
    v1.0.7: base image pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (sm_120 / RTX 5090M); was 2.6+cu12.4 with no Blackwell kernels.
    v1.0.4: vision loader API fix (repo_id_or_path dir).
    v1.0.3: audit upstream inference deps; deps marker v3.
    v1.0.2: omegaconf + reinstall after --no-deps.
    v1.0.1: Helm-safe soft_ready / ConfigMap brace escape.
    v1.0.0: initial chart — soft-ready + uv site-packages + Gradio/REST.

permission:
  appData: true
envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_REPO_ID
    required: false
    editable: true
    applyOnChange: true
    value: 'robbyant/lingbot-depth-pretrain-vitl-14-v0.5'
  - envName: UV_INDEX_URL
    required: false
    editable: true
    applyOnChange: true
    value: ''
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
