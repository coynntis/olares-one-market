spec:
  versionName: 1.0.3
  featuredImage: https://cdn.olares.com/images/2026/08/30e42ac35b22698211201b013a339c6c.png
  upgradeDescription: |
    v1.0.3: reuse GGUFs already in Common/comfyui/model/llms (and subdirs) via symlink — official ComfyUI migrates External/ai/model/llms there; skip redownload.
    v1.0.1: fix Blackwell CUDA build — CMAKE_CUDA_ARCHITECTURES=120a (mxfp4 block-scale MMA; sm_120 alone fails ptxas on 5090M).
  fullDescription: |
    Bonsai-27B — dense 27B hybrid-attention VLM at ~3.8 GB language weights (+ ~0.63 GB mmproj).
    Based on Qwen3.6-27B (binary Q1_0_g128). Fits Olares One with large headroom vs Q4_K dense 27B.

    Model: prism-ml/Bonsai-27B-gguf
      - Bonsai-27B-Q1_0.gguf (~3.8 GB)
      - Bonsai-27B-mmproj-Q8_0.gguf (~0.63 GB vision)
    Optional DSpark speculative decode (off by default — ENABLE_DSPARK=1 downloads + enables
    Bonsai-27B-dspark-Q4_1.gguf, ~1.95 GB; trades prompt-cache reuse for ~1.3-2x decode).

    Runtime: nvidia/cuda:13.1.0-devel builds PrismML-Eng/llama.cpp (custom Q1_0_g128 binary kernels).
    Stock ggml-org / buun images cannot load Q1_0 binary packs.
    Default ctx 32768, KV q4_0/q4_0, -ngl 99, --jinja, --flash-attn on, --op-offload.
    Sampling (PrismML): temp 0.7 top_p 0.95.

    Apache-2.0. HF token recommended for reliable downloads.
