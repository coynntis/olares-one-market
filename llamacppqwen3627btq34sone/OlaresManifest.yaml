  fullDescription: |
    Qwen3.6-27B-TQ3_4S served with turbo-tan/llama.cpp-tq3 on Olares One.
    Multimodal vision via mmproj.gguf (OpenAI-compatible image_url requests).
    131K context window (131072 tokens). TQ3 KV cache (--cache-type-k q4_0, --cache-type-v tq3_0).
    On first launch, downloads from Hugging Face (YTan2000/Qwen3.6-27B-TQ3_4S):
    - Qwen3.6-27B-TQ3_4S.gguf
    - mmproj.gguf
    - chat_template.jinja
    Server builds turbo-tan/llama.cpp-tq3 with CUDA and starts llama-server on port 8080.
    Build workspace persisted under appData to avoid full re-clone each restart.
