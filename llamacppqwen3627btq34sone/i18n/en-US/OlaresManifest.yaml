metadata:
  title: Qwen36 27B TQ34S One
  description: "Qwen3.6-27B TQ3_4S via llama.cpp-tq3 on Olares One"

spec:
  fullDescription: |
    Qwen3.6-27B-TQ3_4S served with turbo-tan/llama.cpp-tq3 on Olares One.
    Multimodal vision via mmproj.gguf. 131K context. TQ3 KV cache (q4_0 / tq3_0).
    Downloads from YTan2000/Qwen3.6-27B-TQ3_4S: GGUF, mmproj, and chat template on first launch.
    Builds turbo-tan llama.cpp-tq3 with CUDA and starts llama-server on port 8080.
