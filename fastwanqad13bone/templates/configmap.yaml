    def _verify_attn_qat_backend() -> None:
        """Flagship QAD model needs modified SageAttention3 FP4 (ATTN_QAT_INFER)."""
        from fastvideo.attention.backends.attn_qat_infer import is_attn_qat_infer_available
    
        if not is_attn_qat_infer_available():
            raise gr.Error(
                "attn_qat_infer kernel not available. Build fastvideo-kernel on Blackwell — "
                "see /workspace/fastwan-kernel-build.log"
            )
    
        if SKIP_BACKEND_VERIFY:
            _LOG.info("attention backend: ATTN_QAT_INFER (install-time verify skipped)")
            return
    
        from fastvideo.platforms import AttentionBackendEnum, current_platform
    
        backend_cls = current_platform.get_attn_backend_cls(
            AttentionBackendEnum.ATTN_QAT_INFER,
            128,
            torch.bfloat16,
        )
        if "AttnQatInferBackend" not in backend_cls:
            raise gr.Error(f"ATTN_QAT_INFER backend unavailable (got {backend_cls}).")
        _LOG.info("attention backend OK: ATTN_QAT_INFER (SA3 FP4) -> %s", backend_cls)
    
    
    class TaehvDecoder:
        def __init__(self, checkpoint_path: str, device: str | None = None):
            from taehv import TAEHV
    
            self.device = device or TAEHV_DEVICE
            self.dtype = torch.float16 if self.device == "cuda" else torch.float32
            self.model = TAEHV(checkpoint_path=checkpoint_path).to(self.device, self.dtype).eval()
    
        @torch.no_grad()
        def decode(self, latents: torch.Tensor):
            latents = latents.permute(0, 2, 1, 3, 4).to(self.device, self.dtype)
            decoded = self.model.decode_video(latents, parallel=False, show_progress_bar=False)
            frames = (decoded[0].clamp(0, 1) * 255).to(torch.uint8)
            return frames.permute(0, 2, 3, 1).cpu().numpy()
    
    
    def _log_gpu_memory(tag: str) -> None:
        if not torch.cuda.is_available():
            return
        free, total = torch.cuda.mem_get_info()
        _LOG.info(
            "%s VRAM: %.2f GiB free / %.2f GiB total",
            tag,
            free / (1024**3),
            total / (1024**3),
        )
    
    
    def _release_parent_cuda_cache() -> None:
        """Free parent-process VRAM before spawning the FastVideo worker (shared 24GB GPU)."""
        gc.collect()
        if torch.cuda.is_available():
            torch.cuda.empty_cache()
            torch.cuda.synchronize()
        _log_gpu_memory("parent before worker spawn")
    
    
    def _ensure_worker_patch() -> None:
