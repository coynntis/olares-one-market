            - name: LLM_TOP_K
              value: {{ .Values.olaresEnv.LLM_TOP_K | default "" | quote }}
            - name: LLM_MIN_P
              value: {{ .Values.olaresEnv.LLM_MIN_P | default "" | quote }}
            - name: LLM_PRESENCE_PENALTY
