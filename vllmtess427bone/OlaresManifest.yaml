  icon: https://cdn.olares.com/images/2026/08/af0046dd195ee62c3be5e8c36054912d.png
  description: Tess-4-27B vision + agentic reasoning via vLLM — Qwen3.6 multimodal on Olares One
  title: Tess-4-27B Vision One
  version: 1.0.6
  categories:
    - Vision
    - AI Agents
    - LLM Chat
  bento:
    family: tess
    size_label: 27B
