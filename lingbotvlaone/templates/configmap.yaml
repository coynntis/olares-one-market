  app.py: |
    #!/usr/bin/env python3
    """LingBot-VLA 2.0 Gradio + REST (policy smoke / action dump)."""
    
    from __future__ import annotations
    
    import os
    import sys
    import threading
    import time
    from pathlib import Path
    
    os.environ.setdefault("PYTORCH_CUDA_ALLOC_CONF", "expandable_segments:True")
    sys.path.insert(0, os.path.dirname(__file__))
    
    from _common import append_bootstrap, ensure_gradio_temp, mount_gradio, set_ready_phase, setup_logging, vram_info
    
    ensure_gradio_temp()
    LOG = setup_logging("lingbotvlaone")
    
    import gradio as gr
    import numpy as np
    import torch
    import uvicorn
    from fastapi import FastAPI
    from fastapi.responses import RedirectResponse
    from pydantic import BaseModel
    
    SERVER_PORT = int(os.getenv("SERVER_PORT", "7860"))
    MODEL_DIR = Path(os.getenv("LINGBOT_MODEL_DIR", "/models/lingbotvlaone/weights"))
    SRC = os.getenv("LINGBOT_SRC", "")
    HF_ID = os.getenv("HF_REPO_ID", "robbyant/lingbot-vla-v2-6b")
    
    _lock = threading.Lock()
    _ready = False
    _load_error = None
    _policy = None
    
    
    def _load():
        global _policy, _ready, _load_error
        with _lock:
            if _ready:
                return
            t0 = time.time()
            try:
                if SRC and SRC not in sys.path:
                    sys.path.insert(0, SRC)
                # Weights present check + optional safetensors index
                safes = list(MODEL_DIR.glob("*.safetensors")) + list(MODEL_DIR.glob("model-*.safetensors"))
                if not safes and not (MODEL_DIR / "config.json").is_file():
                    raise FileNotFoundError(f"No VLA weights in {MODEL_DIR}")
                # Try official policy module
                try:
                    # deploy path varies by repo layout
                    import importlib
    
                    for mod_name in (
                        "deploy.lingbot_vla_v2_policy",
                        "lingbotvla.policy",
                    ):
                        try:
                            importlib.import_module(mod_name)
                            append_bootstrap(f"imported {mod_name}")
                            break
                        except Exception as e:
                            append_bootstrap(f"import soft-fail {mod_name}: {e}")
                    # Load safetensors meta only for smoke if full policy needs robot config
                    _policy = {"model_dir": str(MODEL_DIR), "shards": [p.name for p in safes[:8]]}
                except Exception as e:
                    append_bootstrap(f"policy module soft-fail: {e}")
                    _policy = {"model_dir": str(MODEL_DIR), "shards": [p.name for p in safes[:8]]}
                if torch.cuda.is_available():
                    # Touch GPU
                    torch.zeros(1, device="cuda")
                _ready = True
                append_bootstrap(f"vla weights ready {time.time()-t0:.1f}s shards={len(safes)} vram={vram_info()}")
                set_ready_phase("vla_weights_ready")
            except Exception as exc:
                _load_error = str(exc)
                append_bootstrap(f"vla load FAIL: {exc}")
                raise
    
    
    def predict_action(image: np.ndarray, instruction: str) -> str:
        _load()
        # Placeholder action dump — full closed-loop needs robot proprio + post-train ckpt
        h, w = image.shape[:2] if image is not None else (0, 0)
        return (
            f"policy={_policy}\ninstruction={instruction!r}\nimage={w}x{h}\n"
            f"vram={vram_info()}\n"
            "Note: wire deploy.lingbot_vla_v2_policy for real robot actions after post-train."
        )
    
    
    class ActReq(BaseModel):
        instruction: str = "pick up the cup"
        note: str = "Upload image via Gradio; JSON image base64 optional later"
    
    
    app = FastAPI(title="LingBot VLA 2.0 One")
    
    
    @app.on_event("startup")
    def _startup():
        threading.Thread(target=lambda: _load(), daemon=True).start()
    
    
    @app.get("/")
    def root():
        return RedirectResponse("/ui/")
    
    
    @app.get("/health")
    def health():
        return {
            "status": "ready" if _ready else ("error" if _load_error else "loading"),
            "ready": _ready,
            "error": _load_error,
            "model": HF_ID,
            "policy": _policy,
            "vram": vram_info(),
        }
    
    
    @app.get("/api/v1/info")
    def info():
        return health()
    
    
    @app.post("/api/v1/action")
    def action(req: ActReq):
        _load()
        return {"ok": True, "instruction": req.instruction, "policy": _policy, "vram": vram_info()}
    
    
    def build_ui():
        with gr.Blocks(title="LingBot VLA 2.0") as demo:
            gr.Markdown("# LingBot VLA 2.0 One\nWeight load + action API smoke (post-train for real robots)")
            img = gr.Image(type="numpy", label="Camera")
            instr = gr.Textbox(label="Instruction", value="pick up the red block")
            btn = gr.Button("Predict", variant="primary")
            out = gr.Textbox(label="Output")
            btn.click(predict_action, [img, instr], [out])
        return demo
    
    
    demo = build_ui()
    app = mount_gradio(app, demo, path="/ui")
    
    if __name__ == "__main__":
        append_bootstrap(f"uvicorn :{SERVER_PORT}")
        uvicorn.run(app, host="0.0.0.0", port=SERVER_PORT, log_level="info")
    
  soft_ready.py: |
    #!/usr/bin/env python3
    """Stdlib-only soft-ready HTTP for LingBot charts.
    
    Binds :SERVER_PORT immediately so Olares/K8s pass the install gate while
    uv → site-packages + HF model download run in the background.
    
    IMPORTANT: Do not put raw double-brace sequences in this file — Helm parses
    ConfigMap data as templates (see krea soft_ready: plain CSS braces, not f-string doubles).
    """
    
    from __future__ import annotations
    
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    PORT = int(os.environ.get("SERVER_PORT", "7860"))
    APP_NAME = os.environ.get("LINGBOT_APP", "lingbot")
    PHASE_FILE = os.environ.get(
        "LINGBOT_BOOT_PHASE_FILE",
        "/workspace/{}/.boot-phase".format(APP_NAME),
    )
    ATTEMPTS_FILE = os.environ.get(
        "LINGBOT_BOOT_ATTEMPTS_FILE",
        "/workspace/{}/bootstrap.log".format(APP_NAME),
    )
    START = time.time()
    
    
    def _tail_attempts(n: int = 12) -> list:
        if not os.path.isfile(ATTEMPTS_FILE):
            return []
        try:
            with open(ATTEMPTS_FILE, encoding="utf-8", errors="replace") as fh:
                lines = [ln.rstrip() for ln in fh if ln.strip()]
            return lines[-n:]
        except Exception as exc:
            return ["attempts_read_error:{}".format(exc)]
    
    
    def _phase() -> dict:
        status = "installing"
        detail = "starting"
        if os.path.isfile(PHASE_FILE):
            try:
                with open(PHASE_FILE, encoding="utf-8") as fh:
                    raw = fh.read().strip()
                if raw:
                    if raw.startswith("{"):
                        data = json.loads(raw)
                        data.setdefault("elapsed_s", round(time.time() - START, 1))
                        data.setdefault("ready", False)
                        data.setdefault("attempts_tail", _tail_attempts())
                        return data
                    status, _, detail = raw.partition(":")
                    status = status.strip() or "installing"
                    detail = detail.strip() or status
            except Exception as exc:
                detail = "phase_read_error:{}".format(exc)
        return {
            "status": status,
            "ready": False,
            "phase": status,
            "detail": detail,
            "elapsed_s": round(time.time() - START, 1),
            "app": APP_NAME,
            "attempts_tail": _tail_attempts(),
            "hint": (
                "Deps via uv → /workspace/{}/site-packages (persists). "
                "Set UV_INDEX_URL for a PyPI mirror if downloads are slow. "
                "See {} for bootstrap attempts."
            ).format(APP_NAME, ATTEMPTS_FILE),
        }
    
    
    # Plain string — single braces for CSS/JS (Helm-safe). No Python f-string brace doubling.
    HTML = """<!doctype html>
    <html><head><meta charset=utf-8><meta http-equiv=refresh content=8>
    <title>__APP__ — installing</title>
    <style>
    body{font-family:system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.45}
    code{background:#f2f2f2;padding:.1rem .3rem;border-radius:4px}
    .muted{color:#666}
    pre{background:#111;color:#e8e8e8;padding:1rem;border-radius:8px;overflow:auto;font-size:12px}
    </style></head><body>
    <h1>__APP__</h1>
    <p>Bootstrap in progress (uv site-packages + model download). First boot can take a long time.</p>
    <p>Site-packages: <code>/workspace/__APP__/site-packages</code></p>
    <p>Bootstrap log: <code>__ATTEMPTS__</code></p>
    <p class=muted>Page refreshes every 8s. API: <code>GET /health</code></p>
    <pre id=p>loading…</pre>
    <script>
    fetch('/health').then(r=>r.json()).then(j=>{
      document.getElementById('p').textContent=JSON.stringify(j,null,2);
    }).catch(e=>{document.getElementById('p').textContent=String(e);});
    </script>
    </body></html>
    """.replace("__APP__", APP_NAME).replace("__ATTEMPTS__", ATTEMPTS_FILE)
    
    
    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):  # noqa: A003
            return
    
        def _send(self, code, body, content_type):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(body)
    
        def do_GET(self):  # noqa: N802
            path = self.path.split("?", 1)[0]
            if path in ("/health", "/health/"):
                body = json.dumps(_phase()).encode()
                self._send(200, body, "application/json")
                return
            if path.startswith("/ui") or path in ("/", "/docs", "/openapi.json"):
                self._send(200, HTML.encode(), "text/html; charset=utf-8")
                return
            self._send(200, json.dumps(_phase()).encode(), "application/json")
    
    
    def main():
        os.makedirs(os.path.dirname(PHASE_FILE) or ".", exist_ok=True)
        with open(PHASE_FILE, "w", encoding="utf-8") as fh:
            fh.write("installing:soft_ready_listening")
        httpd = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        print("[{}-soft-ready] listening 0.0.0.0:{}".format(APP_NAME, PORT), flush=True)
        httpd.serve_forever()
    
    
    if __name__ == "__main__":
        main()
    
  download_models.py: |
    #!/usr/bin/env python3
    """HF snapshot download with progress → bootstrap.log + phase file."""
    
    from __future__ import annotations
    
    import json
    import os
    import sys
    import time
    from pathlib import Path
    
    
    def _append_log(path: Path, line: str) -> None:
        path.parent.mkdir(parents=True, exist_ok=True)
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        with path.open("a", encoding="utf-8") as fh:
            fh.write(f"{ts} {line}\n")
        print(f"[lingbot-dl] {line}", flush=True)
    
    
    def _set_phase(phase_file: Path, status: str, detail: str, **extra) -> None:
        phase_file.parent.mkdir(parents=True, exist_ok=True)
        payload = {"status": status, "ready": False, "phase": status, "detail": detail, **extra}
        phase_file.write_text(json.dumps(payload), encoding="utf-8")
    
    
    def main() -> int:
        repo_id = os.environ.get("HF_REPO_ID", "").strip()
        local_dir = os.environ.get("HF_LOCAL_DIR", "").strip()
        app = os.environ.get("LINGBOT_APP", "lingbot")
        phase_file = Path(
            os.environ.get("LINGBOT_BOOT_PHASE_FILE", f"/workspace/{app}/.boot-phase")
        )
        log_file = Path(
            os.environ.get("LINGBOT_BOOT_ATTEMPTS_FILE", f"/workspace/{app}/bootstrap.log")
        )
        marker = Path(local_dir) / ".download-ok" if local_dir else None
        allow_patterns = os.environ.get("HF_ALLOW_PATTERNS", "").strip()
        revision = os.environ.get("HF_REVISION", "").strip() or None
    
        if not repo_id or not local_dir:
            _append_log(log_file, "FATAL missing HF_REPO_ID or HF_LOCAL_DIR")
            return 2
    
        local = Path(local_dir)
        local.mkdir(parents=True, exist_ok=True)
    
        required = [
            p.strip()
            for p in os.environ.get("HF_REQUIRED_FILES", "").split(",")
            if p.strip()
        ]
    
        def _has_required() -> bool:
            if not required:
                return any(local.iterdir())
            for name in required:
                if not any(local.rglob(name)):
                    return False
            return True
    
        if marker and marker.is_file() and _has_required():
            _append_log(log_file, f"skip download — marker OK {marker} required={required or '*'}")
            _set_phase(phase_file, "installing", f"model_cached:{repo_id}")
            return 0
        if marker and marker.is_file() and not _has_required():
            _append_log(
                log_file,
                f"marker present but missing required files {required} — re-download",
            )
            try:
                marker.unlink()
            except OSError:
                pass
    
        attempt = 1
        max_attempts = int(os.environ.get("HF_DOWNLOAD_ATTEMPTS", "3"))
        last_err = ""
    
        while attempt <= max_attempts:
            t0 = time.time()
            _append_log(
                log_file,
                f"attempt={attempt}/{max_attempts} repo={repo_id} dir={local_dir}",
            )
            _set_phase(
                phase_file,
                "installing",
                f"hf_download:{repo_id}:attempt_{attempt}",
                repo_id=repo_id,
                attempt=attempt,
            )
            try:
                from huggingface_hub import snapshot_download
    
                kwargs = {
                    "repo_id": repo_id,
                    "local_dir": str(local),
                    "local_dir_use_symlinks": False,
                    "resume_download": True,
                    "max_workers": int(os.environ.get("HF_DOWNLOAD_WORKERS", "8")),
                }
                if revision:
                    kwargs["revision"] = revision
                if allow_patterns:
                    kwargs["allow_patterns"] = [p.strip() for p in allow_patterns.split(",") if p.strip()]
    
                token = (os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN") or "").strip()
                if token:
                    kwargs["token"] = token
    
                path = snapshot_download(**kwargs)
                elapsed = round(time.time() - t0, 1)
                # rough size
                total = 0
                for root, _, files in os.walk(path):
                    for name in files:
                        try:
                            total += (Path(root) / name).stat().st_size
                        except OSError:
                            pass
                _append_log(
                    log_file,
                    f"OK repo={repo_id} bytes={total} elapsed_s={elapsed} path={path}",
                )
                if marker:
                    marker.write_text(
                        json.dumps({"repo_id": repo_id, "bytes": total, "elapsed_s": elapsed}),
                        encoding="utf-8",
                    )
                _set_phase(
                    phase_file,
                    "installing",
                    f"hf_download_ok:{repo_id}:{total}B",
                    repo_id=repo_id,
                    bytes=total,
                    elapsed_s=elapsed,
                )
                return 0
            except Exception as exc:
                last_err = str(exc)
                elapsed = round(time.time() - t0, 1)
                _append_log(
                    log_file,
                    f"FAIL attempt={attempt} repo={repo_id} elapsed_s={elapsed} err={last_err}",
                )
                _set_phase(
                    phase_file,
                    "installing",
                    f"hf_download_fail:{repo_id}:attempt_{attempt}:{last_err[:180]}",
                    attempt=attempt,
                    error=last_err[:500],
                )
                attempt += 1
                time.sleep(min(30, 5 * attempt))
    
        _append_log(log_file, f"FATAL giving up repo={repo_id} last_err={last_err}")
        return 1
    
    
    if __name__ == "__main__":
        sys.exit(main())
    
  _common.py: |
    """Shared helpers for LingBot Gradio + FastAPI servers."""
    
    from __future__ import annotations
    
    import json
    import logging
    import os
    import time
    from pathlib import Path
    from typing import Any
    
    LOG = logging.getLogger("lingbot")
    
    
    def setup_logging(name: str) -> logging.Logger:
        logging.basicConfig(
            level=os.getenv("LOG_LEVEL", "INFO"),
            format=f"%(asctime)s [{name}] %(levelname)s %(message)s",
        )
        return logging.getLogger(name)
    
    
    def env_path(key: str, default: str) -> Path:
        return Path(os.getenv(key, default).strip() or default)
    
    
    def ensure_gradio_temp() -> str:
        d = (os.getenv("GRADIO_TEMP_DIR") or "/output/gradio").strip()
        os.makedirs(d, mode=0o755, exist_ok=True)
        os.environ["GRADIO_TEMP_DIR"] = d
        return os.path.realpath(d)
    
    
    def append_bootstrap(msg: str) -> None:
        app = os.getenv("LINGBOT_APP", "lingbot")
        path = Path(os.getenv("LINGBOT_BOOT_ATTEMPTS_FILE", f"/workspace/{app}/bootstrap.log"))
        path.parent.mkdir(parents=True, exist_ok=True)
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        with path.open("a", encoding="utf-8") as fh:
            fh.write(f"{ts} {msg}\n")
        print(f"[{app}] {msg}", flush=True)
    
    
    def set_ready_phase(detail: str = "ready") -> None:
        app = os.getenv("LINGBOT_APP", "lingbot")
        phase = Path(os.getenv("LINGBOT_BOOT_PHASE_FILE", f"/workspace/{app}/.boot-phase"))
        phase.write_text(
            json.dumps({"status": "ready", "ready": True, "phase": "ready", "detail": detail}),
            encoding="utf-8",
        )
    
    
    def vram_info() -> dict[str, Any]:
        try:
            import torch
    
            if not torch.cuda.is_available():
                return {"cuda": False}
            free, total = torch.cuda.mem_get_info()
            return {
                "cuda": True,
                "device": torch.cuda.get_device_name(0),
                "free_gb": round(free / 1e9, 2),
                "total_gb": round(total / 1e9, 2),
                "allocated_gb": round(torch.cuda.memory_allocated() / 1e9, 2),
            }
        except Exception as exc:
            return {"cuda": False, "error": str(exc)}
    
    
    def find_weight_file(model_dir: Path, names: list[str]) -> Path | None:
        for n in names:
            p = model_dir / n
            if p.is_file():
                return p
        # search one level
        for n in names:
            matches = list(model_dir.rglob(n))
            if matches:
                return matches[0]
        return None
    
    
    def mount_gradio(app, demo, path: str = "/ui"):
        """Mount Gradio under ``path`` with root_path so file URLs include the prefix.
    
        Olares ingress hits the app at the entrance root. Without root_path, Gradio
        emits ``/gradio_api/file=...`` which 404s; correct is ``/ui/gradio_api/...``.
        Also register redirects from bare ``/gradio_api/*`` → ``/ui/gradio_api/*``.
        """
        import gradio as gr
        from fastapi import Request
        from fastapi.responses import RedirectResponse
        from urllib.parse import quote
    
        mount = (path or "/ui").rstrip("/") or "/ui"
        root = (os.getenv("GRADIO_ROOT_PATH") or "").strip() or mount
    
        @app.api_route("/gradio_api/{rest:path}", methods=["GET", "HEAD"])
        def _gradio_api_redir(rest: str, request: Request):
            q = f"?{request.url.query}" if request.url.query else ""
            return RedirectResponse(
                url=f"{mount}/gradio_api/{quote(rest, safe='/=')}{q}",
                status_code=307,
            )
    
        return gr.mount_gradio_app(app, demo, path=mount, root_path=root)
    
