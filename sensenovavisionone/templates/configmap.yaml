---
# Generated by scripts/inject-sensenovavision-configmap.js — edit sensenovavisionone/app/ then npm run build
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensenovavisionone-source
  namespace: "{{ .Release.Namespace }}"
data:
  app.py: |
    #!/usr/bin/env python3
    """SenseNova-Vision Gradio + REST with timing (Olares One soft-boot)."""
    
    from __future__ import annotations
    
    import base64
    import io
    import os
    import sys
    import tempfile
    import threading
    import time
    from typing import Any, Optional
    
    os.environ.setdefault("PYTORCH_CUDA_ALLOC_CONF", "expandable_segments:True")
    sys.path.insert(0, os.path.dirname(__file__))
    
    from _common import (  # noqa: E402
        append_bootstrap,
        ensure_gradio_temp,
        mount_gradio,
        set_ready_phase,
        setup_logging,
        vram_info,
    )
    
    ensure_gradio_temp()
    LOG = setup_logging("sensenovavisionone")
    
    import gradio as gr  # noqa: E402
    import uvicorn  # noqa: E402
    from fastapi import FastAPI, File, Form, UploadFile  # noqa: E402
    from fastapi.responses import JSONResponse, RedirectResponse  # noqa: E402
    from PIL import Image  # noqa: E402
    
    SERVER_PORT = int(os.getenv("SERVER_PORT", "7860"))
    MODEL_DIR = os.getenv("SENSENOVA_MODEL_DIR", "/models/sensenovavisionone/weights")
    SRC = os.getenv("SENSENOVA_SRC", "")
    HF_ID = os.getenv("HF_REPO_ID", "sensenova/SenseNova-Vision-7B-MoT")
    DTYPE = os.getenv("SENSENOVA_DTYPE", "nf4").strip() or "nf4"
    DEVICE = os.getenv("SENSENOVA_DEVICE", "cuda").strip() or "cuda"
    MAX_MEM = os.getenv("SENSENOVA_MAX_MEM_PER_GPU", "20GiB").strip() or "20GiB"
    OFFLOAD = os.getenv(
        "SENSENOVA_OFFLOAD_FOLDER",
        f"/workspace/{os.getenv('APP_NAME', 'sensenovavisionone')}/offload",
    )
    OUTPUT_DIR = os.getenv("SENSENOVA_OUTPUT_DIR", "/output/sensenova")
    LOAD_LAZY = os.getenv("LOAD_LAZY", "0").strip() in {"1", "true", "yes", "on"}
    
    TASK_ORDER = [
        "raw_query",
        "depth",
        "normal",
        "binary_seg",
        "pan_seg",
        "gcg_seg",
        "bbox_detection",
        "point_detection",
        "keypoint",
        "ocr",
        "recon3d",
        "camera_pose",
    ]
    
    _lock = threading.Lock()
    _model = None
    _ready = False
    _load_error: Optional[str] = None
    _load_elapsed_s: Optional[float] = None
    _timings: list[dict[str, Any]] = []
    _TIMINGS_MAX = 50
    
    
    def _ensure_src() -> None:
        if SRC and SRC not in sys.path:
            sys.path.insert(0, SRC)
    
    
    def _load() -> None:
        global _model, _ready, _load_error, _load_elapsed_s
        with _lock:
            if _model is not None:
                return
            t0 = time.time()
            try:
                _ensure_src()
                os.makedirs(OFFLOAD, exist_ok=True)
                os.makedirs(OUTPUT_DIR, exist_ok=True)
    
                import torch
                from inference.sensenova_vision import SenseNovaVisionModel
    
                want_cuda = torch.cuda.is_available() and DEVICE != "cpu"
                if want_cuda:
                    try:
                        major, minor = torch.cuda.get_device_capability(0)
                        append_bootstrap(
                            f"cuda device={torch.cuda.get_device_name(0)} "
                            f"capability=sm_{major}{minor} torch={torch.__version__} "
                            f"cuda_build={torch.version.cuda}"
                        )
                    except Exception as exc:
                        append_bootstrap(f"cuda capability probe soft-fail: {exc}")
    
                ema = os.path.join(MODEL_DIR, "ema.safetensors")
                if not os.path.isfile(ema):
                    raise FileNotFoundError(
                        f"Missing {ema}. Wait for HF download or set HF_REPO_ID / model path."
                    )
    
                device = "cuda" if want_cuda else "cpu"
                append_bootstrap(
                    f"loading SenseNovaVisionModel path={MODEL_DIR} dtype={DTYPE} "
                    f"device={device} max_mem={MAX_MEM} offload={OFFLOAD}"
                )
                _model = SenseNovaVisionModel(
                    model_path=MODEL_DIR,
                    checkpoint_name="ema.safetensors",
                    dtype=DTYPE,
                    device=device,
                    max_mem_per_gpu=MAX_MEM,
                    offload_folder=OFFLOAD,
                    download_local_files_only=True,
                )
                _ready = True
                _load_elapsed_s = round(time.time() - t0, 1)
                append_bootstrap(
                    f"model ready {_load_elapsed_s}s vram={vram_info()} dtype={DTYPE}"
                )
                set_ready_phase(f"model_ready_{device}_{DTYPE}")
            except Exception as exc:
                _load_error = str(exc)
                append_bootstrap(f"model load FAIL: {exc}")
                raise
    
    
    def _record_timing(task: str, elapsed_s: float, ok: bool, detail: str = "") -> None:
        entry = {
            "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "task": task,
            "elapsed_s": round(elapsed_s, 3),
            "ok": ok,
            "detail": detail[:200],
            "vram": vram_info(),
        }
        _timings.append(entry)
        if len(_timings) > _TIMINGS_MAX:
            del _timings[: len(_timings) - _TIMINGS_MAX]
        append_bootstrap(
            f"infer task={task} ok={ok} elapsed_s={entry['elapsed_s']} {detail[:80]}"
        )
    
    
    def _save_pil(image: Image.Image, suffix: str = ".png") -> str:
        os.makedirs(OUTPUT_DIR, exist_ok=True)
        fd, path = tempfile.mkstemp(suffix=suffix, prefix="snv_", dir=OUTPUT_DIR)
        os.close(fd)
        image.save(path)
        return path
    
    
    def _pil_to_b64(image: Image.Image) -> str:
        buf = io.BytesIO()
        image.save(buf, format="PNG")
        return base64.b64encode(buf.getvalue()).decode("ascii")
    
    
    def run_task(
        image: Image.Image,
        task: str,
        query: str = "",
        mode: str = "",
        seed: int = 42,
        extra_images: Optional[list[Image.Image]] = None,
    ) -> dict[str, Any]:
        """Run one SenseNova-Vision task; returns dict with timing + outputs."""
        _load()
        assert _model is not None
        _ensure_src()
    
        from inference.inference_demo import (  # noqa: WPS433
            build_prompt,
            model_question,
            resolve_request_mode,
        )
    
        task = (task or "depth").strip()
        if task not in TASK_ORDER:
            raise ValueError(f"Unsupported task={task}; choose from {TASK_ORDER}")
    
        t0 = time.time()
        try:
            prompt = build_prompt(task, query or "")
            resolved_mode = resolve_request_mode(task, mode or "")
            paths: list[str] = []
            paths.append(_save_pil(image.convert("RGB")))
            for extra in extra_images or []:
                if extra is not None:
                    paths.append(_save_pil(extra.convert("RGB")))
    
            if task == "recon3d":
                result = _model.reconstruct_3d(
                    images=paths,
                    prompt=prompt,
                    noise_seed=int(seed),
                    glb_output=os.path.join(
                        OUTPUT_DIR, f"recon3d_{int(time.time())}.glb"
                    ),
                )
                out_image = None
                out_text = str(result.get("text") or "")
                glb = None
                scene = result.get("scene")
                if scene is not None:
                    glb_path = os.path.join(OUTPUT_DIR, f"recon3d_{int(time.time())}.glb")
                    try:
                        scene.export(file_obj=glb_path)
                        glb = glb_path
                    except Exception as exc:
                        append_bootstrap(f"glb export soft-fail: {exc}")
                elapsed = time.time() - t0
                _record_timing(task, elapsed, True, f"mode={resolved_mode}")
                return {
                    "ok": True,
                    "task": task,
                    "mode": resolved_mode,
                    "prompt": prompt,
                    "elapsed_s": round(elapsed, 3),
                    "text": out_text,
                    "image": out_image,
                    "glb_path": glb,
                    "vram": vram_info(),
                }
    
            result = _model.generate(
                question=model_question(prompt, len(paths)),
                images=paths,
                mode=resolved_mode,
                noise_seed=int(seed),
                return_intermediate_outputs=True,
            )
            out_image = None
            out_text = None
            if isinstance(result, dict):
                out_image = result.get("image")
                out_text = result.get("text")
            elif isinstance(result, Image.Image):
                out_image = result
            else:
                out_text = str(result) if result is not None else None
    
            elapsed = time.time() - t0
            _record_timing(task, elapsed, True, f"mode={resolved_mode}")
            return {
                "ok": True,
                "task": task,
                "mode": resolved_mode,
                "prompt": prompt,
                "elapsed_s": round(elapsed, 3),
                "text": out_text,
                "image": out_image,
                "vram": vram_info(),
            }
        except Exception as exc:
            elapsed = time.time() - t0
            _record_timing(task, elapsed, False, str(exc))
            raise
    
    
    def _gradio_run(image, task, query, seed):
        if image is None:
            raise gr.Error("Upload an image first")
        if isinstance(image, Image.Image):
            pil = image
        else:
            pil = Image.fromarray(image.astype("uint8")).convert("RGB")
        out = run_task(pil, task=task, query=query or "", seed=int(seed or 42))
        img = out.get("image")
        text = out.get("text") or ""
        meta = (
            f"task={out['task']} mode={out['mode']} elapsed_s={out['elapsed_s']}\n"
            f"vram={out.get('vram')}\n"
            f"prompt={out.get('prompt')}"
        )
        return img, text, meta
    
    
    app = FastAPI(title="SenseNova Vision One")
    
    
    @app.on_event("startup")
    def _startup():
        if not LOAD_LAZY:
            threading.Thread(target=lambda: _load(), daemon=True).start()
    
    
    @app.get("/")
    def root():
        return RedirectResponse("/ui/")
    
    
    @app.get("/health")
    def health():
        return {
            "status": "ready" if _ready else ("error" if _load_error else "loading"),
            "ready": _ready,
            "error": _load_error,
            "model": HF_ID,
            "model_dir": MODEL_DIR,
            "dtype": DTYPE,
            "device": DEVICE,
            "max_mem_per_gpu": MAX_MEM,
            "load_elapsed_s": _load_elapsed_s,
            "vram": vram_info(),
            "license": "CC-BY-NC-4.0",
            "note": (
                "Official demo recommends ~80GB GPU; this chart uses accelerate "
                "offload (SENSENOVA_MAX_MEM_PER_GPU) for RTX 5090M 24GB + 96GB RAM."
            ),
        }
    
    
    @app.get("/api/v1/info")
    def info():
        return {
            **health(),
            "tasks": TASK_ORDER,
            "timings_tail": _timings[-10:],
        }
    
    
    @app.get("/api/v1/timings")
    def timings(limit: int = 20):
        n = max(1, min(int(limit or 20), _TIMINGS_MAX))
        return {"timings": _timings[-n:], "count": len(_timings)}
    
    
    @app.post("/api/v1/predict")
    async def predict(
        file: UploadFile = File(...),
        task: str = Form("depth"),
        query: str = Form(""),
        mode: str = Form(""),
        seed: int = Form(42),
    ):
        raw = await file.read()
        pil = Image.open(io.BytesIO(raw)).convert("RGB")
        try:
            out = run_task(pil, task=task, query=query, mode=mode, seed=int(seed))
        except Exception as exc:
            return JSONResponse(
                status_code=500,
                content={"ok": False, "error": str(exc), "task": task},
            )
        payload: dict[str, Any] = {
            "ok": True,
            "task": out["task"],
            "mode": out["mode"],
            "prompt": out["prompt"],
            "elapsed_s": out["elapsed_s"],
            "text": out.get("text"),
            "vram": out.get("vram"),
            "glb_path": out.get("glb_path"),
        }
        if isinstance(out.get("image"), Image.Image):
            payload["image_png_base64"] = _pil_to_b64(out["image"])
        return payload
    
    
    def build_ui():
        with gr.Blocks(title="SenseNova Vision One") as demo:
            gr.Markdown(
                "# SenseNova Vision One\n"
                "Unified multimodal CV (depth, normals, seg, detect, OCR, …) "
                "via SenseNova-Vision-7B-MoT.\n\n"
                f"**dtype** `{DTYPE}` · **max GPU mem** `{MAX_MEM}` · "
                "CC BY-NC 4.0 · REST: `POST /api/v1/predict` · timings: `GET /api/v1/timings`"
            )
            with gr.Row():
                with gr.Column():
                    inp = gr.Image(type="pil", label="Image")
                    task = gr.Dropdown(TASK_ORDER, value="depth", label="Task")
                    query = gr.Textbox(
                        label="Query (needed for raw_query / seg / detect)",
                        placeholder="person, car  OR  free-form question",
                    )
                    seed = gr.Number(value=42, precision=0, label="Seed")
                    btn = gr.Button("Run", variant="primary")
                with gr.Column():
                    out_img = gr.Image(type="pil", label="Output image")
                    out_txt = gr.Textbox(label="Output text", lines=8)
                    out_meta = gr.Textbox(label="Timing / metadata", lines=4)
            btn.click(_gradio_run, [inp, task, query, seed], [out_img, out_txt, out_meta])
        return demo
    
    
    demo = build_ui()
    app = mount_gradio(app, demo, path="/ui")
    
    if __name__ == "__main__":
        append_bootstrap(f"uvicorn :{SERVER_PORT}")
        uvicorn.run(app, host="0.0.0.0", port=SERVER_PORT, log_level="info")
    
  soft_ready.py: |
    #!/usr/bin/env python3
    """Stdlib-only soft-ready HTTP for SenseNova Vision One.
    
    Binds :SERVER_PORT immediately so Olares/K8s pass the install gate while
    uv → site-packages + HF model download run in the background.
    
    IMPORTANT: Do not put raw double-brace sequences in this file — Helm parses
    ConfigMap data as templates (see krea soft_ready: plain CSS braces, not f-string doubles).
    """
    
    from __future__ import annotations
    
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    PORT = int(os.environ.get("SERVER_PORT", "7860"))
    APP_NAME = os.environ.get("APP_NAME", "sensenovavisionone")
    PHASE_FILE = os.environ.get(
        "BOOT_PHASE_FILE",
        "/workspace/{}/.boot-phase".format(APP_NAME),
    )
    ATTEMPTS_FILE = os.environ.get(
        "BOOT_ATTEMPTS_FILE",
        "/workspace/{}/bootstrap.log".format(APP_NAME),
    )
    START = time.time()
    
    
    def _tail_attempts(n: int = 12) -> list:
        if not os.path.isfile(ATTEMPTS_FILE):
            return []
        try:
            with open(ATTEMPTS_FILE, encoding="utf-8", errors="replace") as fh:
                lines = [ln.rstrip() for ln in fh if ln.strip()]
            return lines[-n:]
        except Exception as exc:
            return ["attempts_read_error:{}".format(exc)]
    
    
    def _phase() -> dict:
        status = "installing"
        detail = "starting"
        if os.path.isfile(PHASE_FILE):
            try:
                with open(PHASE_FILE, encoding="utf-8") as fh:
                    raw = fh.read().strip()
                if raw:
                    if raw.startswith("{"):
                        data = json.loads(raw)
                        data.setdefault("elapsed_s", round(time.time() - START, 1))
                        data.setdefault("ready", False)
                        data.setdefault("attempts_tail", _tail_attempts())
                        return data
                    status, _, detail = raw.partition(":")
                    status = status.strip() or "installing"
                    detail = detail.strip() or status
            except Exception as exc:
                detail = "phase_read_error:{}".format(exc)
        return {
            "status": status,
            "ready": False,
            "phase": status,
            "detail": detail,
            "elapsed_s": round(time.time() - START, 1),
            "app": APP_NAME,
            "attempts_tail": _tail_attempts(),
            "hint": (
                "Deps via uv → /workspace/{}/site-packages (persists). "
                "Set UV_INDEX_URL for a PyPI mirror if downloads are slow. "
                "See {} for bootstrap attempts."
            ).format(APP_NAME, ATTEMPTS_FILE),
        }
    
    
    # Plain string — single braces for CSS/JS (Helm-safe). No Python f-string brace doubling.
    HTML = """<!doctype html>
    <html><head><meta charset=utf-8><meta http-equiv=refresh content=8>
    <title>__APP__ — installing</title>
    <style>
    body{font-family:system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.45}
    code{background:#f2f2f2;padding:.1rem .3rem;border-radius:4px}
    .muted{color:#666}
    pre{background:#111;color:#e8e8e8;padding:1rem;border-radius:8px;overflow:auto;font-size:12px}
    </style></head><body>
    <h1>__APP__</h1>
    <p>Bootstrap in progress (uv site-packages + ~30GB model download). First boot can take a long time.</p>
    <p>Site-packages: <code>/workspace/__APP__/site-packages</code></p>
    <p>Bootstrap log: <code>__ATTEMPTS__</code></p>
    <p class=muted>Page refreshes every 8s. API: <code>GET /health</code></p>
    <pre id=p>loading…</pre>
    <script>
    fetch('/health').then(r=>r.json()).then(j=>{
      document.getElementById('p').textContent=JSON.stringify(j,null,2);
    }).catch(e=>{document.getElementById('p').textContent=String(e);});
    </script>
    </body></html>
    """.replace("__APP__", APP_NAME).replace("__ATTEMPTS__", ATTEMPTS_FILE)
    
    
    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):  # noqa: A003
            return
    
        def _send(self, code, body, content_type):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(body)
    
        def do_GET(self):  # noqa: N802
            path = self.path.split("?", 1)[0]
            if path in ("/health", "/health/"):
                body = json.dumps(_phase()).encode()
                self._send(200, body, "application/json")
                return
            if path.startswith("/ui") or path in ("/", "/docs", "/openapi.json"):
                self._send(200, HTML.encode(), "text/html; charset=utf-8")
                return
            self._send(200, json.dumps(_phase()).encode(), "application/json")
    
    
    def main():
        os.makedirs(os.path.dirname(PHASE_FILE) or ".", exist_ok=True)
        with open(PHASE_FILE, "w", encoding="utf-8") as fh:
            fh.write("installing:soft_ready_listening")
        httpd = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        print("[{}-soft-ready] listening 0.0.0.0:{}".format(APP_NAME, PORT), flush=True)
        httpd.serve_forever()
    
    
    if __name__ == "__main__":
        main()
    
  download_models.py: |
    #!/usr/bin/env python3
    """HF snapshot download with progress → bootstrap.log + phase file."""
    
    from __future__ import annotations
    
    import json
    import os
    import sys
    import time
    from pathlib import Path
    
    
    def _append_log(path: Path, line: str) -> None:
        path.parent.mkdir(parents=True, exist_ok=True)
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        with path.open("a", encoding="utf-8") as fh:
            fh.write(f"{ts} {line}\n")
        print(f"[sensenova-dl] {line}", flush=True)
    
    
    def _set_phase(phase_file: Path, status: str, detail: str, **extra) -> None:
        phase_file.parent.mkdir(parents=True, exist_ok=True)
        payload = {"status": status, "ready": False, "phase": status, "detail": detail, **extra}
        phase_file.write_text(json.dumps(payload), encoding="utf-8")
    
    
    def main() -> int:
        repo_id = os.environ.get("HF_REPO_ID", "").strip()
        local_dir = os.environ.get("HF_LOCAL_DIR", "").strip()
        app = os.environ.get("APP_NAME", "sensenovavisionone")
        phase_file = Path(os.environ.get("BOOT_PHASE_FILE", f"/workspace/{app}/.boot-phase"))
        log_file = Path(os.environ.get("BOOT_ATTEMPTS_FILE", f"/workspace/{app}/bootstrap.log"))
        marker = Path(local_dir) / ".download-ok" if local_dir else None
        allow_patterns = os.environ.get("HF_ALLOW_PATTERNS", "").strip()
        revision = os.environ.get("HF_REVISION", "").strip() or None
    
        if not repo_id or not local_dir:
            _append_log(log_file, "FATAL missing HF_REPO_ID or HF_LOCAL_DIR")
            return 2
    
        local = Path(local_dir)
        local.mkdir(parents=True, exist_ok=True)
    
        required = [
            p.strip()
            for p in os.environ.get(
                "HF_REQUIRED_FILES", "ema.safetensors,ae.safetensors,config.json"
            ).split(",")
            if p.strip()
        ]
    
        def _has_required() -> bool:
            if not required:
                return any(local.iterdir())
            for name in required:
                if not any(local.rglob(name)):
                    return False
            return True
    
        if marker and marker.is_file() and _has_required():
            _append_log(log_file, f"skip download — marker OK {marker} required={required or '*'}")
            _set_phase(phase_file, "installing", f"model_cached:{repo_id}")
            return 0
        if marker and marker.is_file() and not _has_required():
            _append_log(
                log_file,
                f"marker present but missing required files {required} — re-download",
            )
            try:
                marker.unlink()
            except OSError:
                pass
    
        attempt = 1
        max_attempts = int(os.environ.get("HF_DOWNLOAD_ATTEMPTS", "3"))
        last_err = ""
    
        while attempt <= max_attempts:
            t0 = time.time()
            _append_log(
                log_file,
                f"attempt={attempt}/{max_attempts} repo={repo_id} dir={local_dir}",
            )
            _set_phase(
                phase_file,
                "installing",
                f"hf_download:{repo_id}:attempt_{attempt}",
                repo_id=repo_id,
                attempt=attempt,
            )
            try:
                from huggingface_hub import snapshot_download
    
                kwargs = {
                    "repo_id": repo_id,
                    "local_dir": str(local),
                    "local_dir_use_symlinks": False,
                    "resume_download": True,
                    "max_workers": int(os.environ.get("HF_DOWNLOAD_WORKERS", "8")),
                }
                if revision:
                    kwargs["revision"] = revision
                if allow_patterns:
                    kwargs["allow_patterns"] = [
                        p.strip() for p in allow_patterns.split(",") if p.strip()
                    ]
    
                token = (
                    os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN") or ""
                ).strip()
                if token:
                    kwargs["token"] = token
    
                path = snapshot_download(**kwargs)
                elapsed = round(time.time() - t0, 1)
                total = 0
                for root, _, files in os.walk(path):
                    for name in files:
                        try:
                            total += (Path(root) / name).stat().st_size
                        except OSError:
                            pass
                _append_log(
                    log_file,
                    f"OK repo={repo_id} bytes={total} elapsed_s={elapsed} path={path}",
                )
                if marker:
                    marker.write_text(
                        json.dumps({"repo_id": repo_id, "bytes": total, "elapsed_s": elapsed}),
                        encoding="utf-8",
                    )
                _set_phase(
                    phase_file,
                    "installing",
                    f"hf_download_ok:{repo_id}:{total}B",
                    repo_id=repo_id,
                    bytes=total,
                    elapsed_s=elapsed,
                )
                return 0
            except Exception as exc:
                last_err = str(exc)
                elapsed = round(time.time() - t0, 1)
                _append_log(
                    log_file,
                    f"FAIL attempt={attempt} repo={repo_id} elapsed_s={elapsed} err={last_err}",
                )
                _set_phase(
                    phase_file,
                    "installing",
                    f"hf_download_fail:{repo_id}:attempt_{attempt}:{last_err[:180]}",
                    attempt=attempt,
                    error=last_err[:500],
                )
                attempt += 1
                time.sleep(min(30, 5 * attempt))
    
        _append_log(log_file, f"FATAL giving up repo={repo_id} last_err={last_err}")
        return 1
    
    
    if __name__ == "__main__":
        sys.exit(main())
    
