---
olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  qwen3ttstone: 1
  qwen3ttstonecli: 1
metadata:
  name: qwen3ttstone
  icon: https://cdn.olares.com/images/2026/08/298f1a022e0a8fb829e4fcb08fcdcab3.png
  description: Qwen3-TTS 1.7B — text-to-speech with voice cloning, optimized for Olares One
  title: Qwen3-TTS 1.7B (Olares One)
  version: 1.0.30
  categories:
    - AI
sharedEntrances:
  - name: qwen3ttstone
    host: sharedentrances-qwen3ttstone
    port: 0
    title: Qwen3-TTS API
    icon: https://cdn.olares.com/images/2026/08/298f1a022e0a8fb829e4fcb08fcdcab3.png
    invisible: true
    authLevel: internal
entrances:
  - name: qwen3ttstonecli
    port: 8080
    host: qwen3ttstonecli
    title: Qwen3-TTS One
    icon: https://cdn.olares.com/images/2026/08/298f1a022e0a8fb829e4fcb08fcdcab3.png
    openMethod: window
    authLevel: internal
spec:
  versionName: 1.0.30
  featuredImage: https://cdn.olares.com/images/2026/08/3434ca510c3264897b15abae86c7fa6a.png
  fullDescription: |
    Qwen3-TTS 1.7B Base model served via Gradio (--base flag) — optimized for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Zero-shot voice cloning from 3 seconds of reference audio (Base variant; not CustomVoice preset pack).
    10 languages: French, English, Chinese, Japanese, Korean, German, Russian, Portuguese, Spanish, Italian.
    Downloads the model on first launch (~4.5GB) and caches it.
    Gradio web UI on port 8000 (Olares app entrance proxies port 8080).
  developer: coynntis
  website: https://github.com/QwenLM/Qwen3-TTS
  sourceCode: https://github.com/QwenLM/Qwen3-TTS
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/QwenLM/Qwen3-TTS/blob/main/LICENSE
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '2'
      limitedCpu: '11'
      requiredMemory: 5Gi
      limitedMemory: 17Gi
      requiredDisk: 15Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 8Gi
  upgradeDescription: |2
        v1.0.27: bump spec.accelerator to cover server + client container resource sums (v3 lint).
    v1.0.26: migrate to apiVersion v3 shared chart (Olares 1.12.6+). Flatten server+client; workloadReplicas; no OLARES_USER_* in templates.
permission:
  appData: true
envs:
  - envName: GITHUB_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_GITHUB_TOKEN
  - envName: GHCR_USER
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_GITHUB_USERNAME
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
