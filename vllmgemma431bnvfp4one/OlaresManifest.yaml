spec:
  versionName: 1.0.16
  featuredImage: https://cdn.olares.com/images/2026/08/df9f2b629adda5353c3beb229bcf86b4.png
  upgradeDescription: |
    v1.0.16: keep PIECEWISE cudagraphs; drop max_model_len 8192→7168 and util 0.95→0.97 so KV fits after torch.compile (was 0.43 GiB vs 0.43 needed).
    v1.0.15: match Unsloth HF recipe — image v0.25.1-x86_64 (CUDA 13, not cu129) + pip flashinfer-python>=0.6.13 nvidia-cutlass-dsl>=4.5.2 compressed-tensors>=0.17.
    v1.0.6: probe QuantizationArgs / null actorder fallback for old CT.
    v1.0.5: pin v0.25.1 (wrong cu129 variant).
    v1.0.4: --kv-cache-dtype fp8.
    v1.0.3: helm render fix.
    v1.0.2: sanitize webui→vLLM; wrap errors.
    v1.0.1: soft-ready /v1/models; stub /cors-proxy.
    v1.0.0: initial release.

  fullDescription: |
    Unsloth gemma-4-31B-it-NVFP4 (~24.8 GB on disk) — multimodal Gemma 4 dense IT. Extremely tight on 24GB; default 16K ctx + fp8 + PIECEWISE graphs.
    
    Stack:
    - Image: vllm/vllm-openai:v0.25.1-x86_64 (CUDA 13)
    - --kv-cache-dtype fp8 for long-context KV budget
    - Native vision (limit-mm image=1) — vision encoder in checkpoint (not GGUF mmproj)
    - gemma4 tool-call parser
    - Default max_model_len 16384
    
    Sibling chart vllmgemma31bitnvfp4one uses LilaRest turbo text-only checkpoint; this chart is the Unsloth multimodal NVFP4.
    
    Entrance: llama.cpp web UI in front of vLLM.
  developer: coynntis
