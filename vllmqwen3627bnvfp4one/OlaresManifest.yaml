spec:
  versionName: 1.0.16
  featuredImage: https://cdn.olares.com/images/2026/08/62991d610f811e33f69b10040c77c8b5.png
  upgradeDescription: |
    v1.0.16: keep PIECEWISE cudagraphs; drop max_model_len 8192→7168 and util 0.95→0.97 so KV fits after torch.compile (was 0.43 GiB vs 0.43 needed).
    v1.0.15: match Unsloth HF recipe — image v0.25.1-x86_64 (CUDA 13, not cu129) + pip flashinfer-python>=0.6.13 nvidia-cutlass-dsl>=4.5.2 compressed-tensors>=0.17.
    v1.0.6: probe QuantizationArgs / null actorder fallback for old CT.
    v1.0.5: pin v0.25.1 (wrong cu129 variant).
    v1.0.4: --kv-cache-dtype fp8 (nightly had no fp8).
    v1.0.3: helm render fix — remove curly braces from Python docstring.
    v1.0.2: sanitize llama.cpp webui→vLLM requests; wrap upstream errors.
    v1.0.1: soft-ready /v1/models while loading; stub /cors-proxy.
    v1.0.0: initial release.

  fullDescription: |
    Unsloth Qwen3.6-27B-NVFP4 (multimodal VLM, ~23.5 GB) on Olares One RTX 5090M.
    
    Stack:
    - Image: vllm/vllm-openai:v0.25.1-x86_64 (CUDA 13) + Unsloth pip deps
    - --kv-cache-dtype fp8 (~2.6x KV) + flash_attn_version 2
    - --limit-mm-per-prompt image=1 (native vision — no GGUF mmproj; projector baked into checkpoint)
    - MTP off on 24GB VRAM (weights fill GPU; re-enable on 32GB+)
    - hermes tool parser + qwen3 reasoning parser
    - Default max_model_len 7168 (override via LLM_CONTEXT_WINDOW; 24GB tight with cudagraphs)
    
    Entrance serves the real llama.cpp web UI (tools/server/public @ b8740) with /props stub + /v1 proxy to vLLM — same chat UI you know from llama-server.
  developer: coynntis
  website: https://huggingface.co/unsloth/Qwen3.6-27B-NVFP4
