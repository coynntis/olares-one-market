workloadReplicas:
  sensenovau1infov2one: 1
  sensenovau1infov2onecli: 1
metadata:
  name: sensenovau1infov2one
  icon: https://cdn.olares.com/images/2026/08/a37bc5cbfe8f0fd0855c64dbcb0aac5d.png
  description: SenseNova-U1 Infographic-V2 specialist — charts, posters, structured layouts
  title: SenseNova Infographic V2
  version: 1.0.3
  categories:
    - AI
sharedEntrances:
  - name: sensenovau1infov2one
    host: sharedentrances-sensenovau1infov2one
    port: 0
    title: SenseNova Infog V2 API
    icon: https://cdn.olares.com/images/2026/08/a37bc5cbfe8f0fd0855c64dbcb0aac5d.png
    invisible: true
    authLevel: internal
entrances:
  - name: sensenovau1infov2onecli
    port: 8080
    host: sensenovau1infov2onecli
    title: SenseNova Infographic V2
    icon: https://cdn.olares.com/images/2026/08/a37bc5cbfe8f0fd0855c64dbcb0aac5d.png
