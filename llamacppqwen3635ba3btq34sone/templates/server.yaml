---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-qwen36-35b-a3b-tq34s-env
  namespace: "{{ .Release.Namespace }}"
data:
  MODEL_URL: "https://huggingface.co/YTan2000/Qwen3.6-35B-A3B-TQ3_4S/resolve/main/Qwen3.6-35B-A3B-TQ3_4S.gguf"
  MODEL_FILE: "Qwen3.6-35B-A3B-TQ3_4S.gguf"
  MMPROJ_URL: "https://huggingface.co/YTan2000/Qwen3.6-35B-A3B-TQ3_4S/resolve/main/mmproj-BF16.gguf"
  MMPROJ_FILE: "mmproj-BF16.gguf"
  MODEL_ALIAS: "qwen3.6-35b-a3b-tq3-4s"
  CONTEXT_SIZE: "131072"
  N_GPU_LAYERS: "99"
  THREADS: "16"
  BUILD_JOBS: "8"
  CHAT_TEMPLATE_URL: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/main/chat_template.jinja"
  CHAT_TEMPLATE_FILE: "chat_template.jinja"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen3635ba3btq34sone
  name: llamacppqwen3635ba3btq34sone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
    applications.app.bytetrade.io/required_gpu: "1"

spec:
  replicas: {{ .Values.workloads.llamacppqwen3635ba3btq34sone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen3635ba3btq34sone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen3635ba3btq34sone
    spec:
      initContainers:
        - name: fix-shared-llms-perms
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo shared-llms-dir-ready
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
        - name: model-downloader
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-c"
            - |
              set -eu
              SHARED_DIR="${SHARED_DIR:-/models}"
              mkdir -p "$SHARED_DIR"
              find_comfy_llms() {
                local name="$1" src
                [ -n "$name" ] || return 1
                [ -d /comfyui-llms ] || return 1
                src="$(find /comfyui-llms -maxdepth 4 -type f -name "$name" 2>/dev/null | head -n 1)"
                [ -n "$src" ] && [ -f "$src" ] || return 1
                printf '%s\n' "$src"
              }
              link_from_comfy_llms() {
                local dest="$1" name src
                name="$(basename "$dest")"
                [ -n "$name" ] || return 1
                src="$(find_comfy_llms "$name")" || return 1
                if [ -f "$dest" ] && [ ! -L "$dest" ]; then
                  return 1
                fi
                echo "[comfy-reuse] $src → $dest (symlink, skip redownload)" >&2
                rm -f "$dest"
                ln -sfn "$src" "$dest"
                return 0
              }
              MODEL_PATH="$SHARED_DIR/${MODEL_FILE}"
              if type link_from_comfy_llms >/dev/null 2>&1; then
                link_from_comfy_llms "$MODEL_PATH" || true
              fi
              MMPROJ_PATH="$SHARED_DIR/${MMPROJ_FILE}"
              if type link_from_comfy_llms >/dev/null 2>&1; then
                link_from_comfy_llms "$MMPROJ_PATH" || true
              fi

              if [ -f "$MODEL_PATH" ]; then
                echo "Model already present: $MODEL_PATH"
                ls -lh "$MODEL_PATH"
              else
                echo "Downloading model from $MODEL_URL ..."
                wget -O "$MODEL_PATH.tmp" "$MODEL_URL"
                mv "$MODEL_PATH.tmp" "$MODEL_PATH"
              fi

              if [ -f "$MMPROJ_PATH" ]; then
                echo "mmproj already present: $MMPROJ_PATH"
                ls -lh "$MMPROJ_PATH"
              else
                echo "Downloading mmproj from $MMPROJ_URL ..."
                wget -O "$MMPROJ_PATH.tmp" "$MMPROJ_URL"
                mv "$MMPROJ_PATH.tmp" "$MMPROJ_PATH"
              fi

              echo "Download stage complete."
              ls -lh "$MODEL_PATH" "$MMPROJ_PATH"
          envFrom:
            - configMapRef:
                name: llamacpp-qwen36-35b-a3b-tq34s-env
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
      containers:
        - name: llamacpp-server
          image: "nvidia/cuda:13.1.0-devel-ubuntu24.04"
          command:
            - "sh"
            - "-c"
            - |
              set -eux
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git cmake build-essential ca-certificates
              rm -rf /var/lib/apt/lists/*

              mkdir -p /workspace
              REPO_DIR="/workspace/llama.cpp-tq3"
              REPO_URL="https://github.com/turbo-tan/llama.cpp-tq3"

              if [ -d "$REPO_DIR/.git" ]; then
                echo "Repo already exists at $REPO_DIR, updating"
                git -C "$REPO_DIR" remote set-url origin "$REPO_URL" || true
                git -C "$REPO_DIR" fetch --tags --prune origin || true
                git -C "$REPO_DIR" pull --ff-only || true
              elif [ -e "$REPO_DIR" ]; then
                echo "Path exists but is not a git repo: $REPO_DIR"
                ts="$(date +%Y%m%d%H%M%S)"
                mv "$REPO_DIR" "${REPO_DIR}.bak.${ts}"
                git clone "$REPO_URL" "$REPO_DIR"
              else
                echo "Cloning llama.cpp-tq3 into $REPO_DIR"
                git clone "$REPO_URL" "$REPO_DIR"
              fi

              cd "$REPO_DIR"
              cmake -B build -DGGML_CUDA=ON
              cmake --build build -j"${BUILD_JOBS}" --verbose

              EXTRA_LLM_ARGS=()
              if [ -n "${LLM_MAX_OUTPUT_TOKENS:-}" ]; then EXTRA_LLM_ARGS+=(--n-predict "$LLM_MAX_OUTPUT_TOKENS"); fi
              if [ -n "${LLM_API_KEY:-}" ]; then EXTRA_LLM_ARGS+=(--api-key "$LLM_API_KEY"); fi
              CHAT_TEMPLATE="${MODELS_DIR:-/models}/${CHAT_TEMPLATE_FILE:-chat_template.jinja}"
              echo "==> Fetching chat template"
              eval curl -fL --retry 10 --retry-delay 5 $HF_AUTH \
                "${CHAT_TEMPLATE_URL:-https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/main/chat_template.jinja}" -o "$CHAT_TEMPLATE"

              exec ./build/bin/llama-server \
                --host 0.0.0.0 \
                --port 8080 \
                --model "/models/${MODEL_FILE}" \
                --mmproj "/models/${MMPROJ_FILE}" \
                --jinja --chat-template-file "$CHAT_TEMPLATE" \
                --alias "${MODEL_ALIAS}" \
                --ctx-size "${LLM_CONTEXT_WINDOW:-${CONTEXT_SIZE}}" \
                --n-gpu-layers "${N_GPU_LAYERS}" \
                --threads "${THREADS}" \
                --cache-type-k q4_0 \
                --cache-type-v tq3_0 \
                --flash-attn auto \
                --op-offload \
                --parallel 1 \
                "${EXTRA_LLM_ARGS[@]}"
          env:
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            - name: LLM_CONTEXT_WINDOW
              value: {{ .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.olaresEnv.LLM_API_KEY | default "" | quote }}
          envFrom:
            - configMapRef:
                name: llamacpp-qwen36-35b-a3b-tq34s-env
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3600
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
            - mountPath: "/workspace"
              name: workspace
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: comfyui-llms
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/comfyui/model/llms"
            type: DirectoryOrCreate
        - name: workspace
          hostPath:
            path: "{{ .Values.userspace.appData }}/llamacppqwen3635ba3btq34sone-workspace"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen3635ba3btq34sone
  name: llamacppqwen3635ba3btq34sone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: llamacppqwen3635ba3btq34sone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen3635ba3btq34sone
  name: sharedentrances-llamacppqwen3635ba3btq34sone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacppqwen3635ba3btq34sone"
      port: 80
      targetPort: 8080
  selector:
    io.kompose.service: llamacppqwen3635ba3btq34sone
