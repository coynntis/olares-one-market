    def _extra_loras_from_env() -> dict[str, dict[str, str]]:
        """Optional comma-separated HF ids via KREA_EXTRA_LORAS."""
        raw = os.getenv("KREA_EXTRA_LORAS", "").strip()
        out: dict[str, dict[str, str]] = {}
        if not raw:
            return out
        for part in raw.split(","):
            repo = part.strip()
            if not repo:
                continue
            short = repo.rsplit("/", 1)[-1]
            out[short] = {"repo": repo, "weight_name": "", "trigger": ""}
        return out
    
    
    LORA_CATALOG: dict[str, dict[str, str]] = {**OFFICIAL_LORAS, **_extra_loras_from_env()}
    
    _PIPE: Krea2Pipeline | None = None
    _PIPE_LOCK = threading.Lock()
    _LOADED_LORA: str | None = None
    _PIPE_CPU_OFFLOAD = False
    # none | model | sequential — model offload still parks whole transformer (~22GB BF16) on GPU.
    _PIPE_OFFLOAD_MODE = "none"
    _LOADED_VIA = "—"
    _SAGE3_PATCHED = False
    _SAGE3_STATUS = "off"
    
    
    def _setup_logging() -> None:
        level = getattr(logging, os.getenv("LOG_LEVEL", "INFO").upper(), logging.INFO)
        logging.basicConfig(level=level, format="%(asctime)s %(levelname)s %(name)s: %(message)s")
        logging.getLogger("urllib3").setLevel(logging.WARNING)
    
    
    def _hf_token() -> str | None:
        token = os.getenv("HF_TOKEN", "").strip()
        return token or None
    
    
    def _vram_gb() -> float:
        if not torch.cuda.is_available():
            return 0.0
        return torch.cuda.get_device_properties(0).total_memory / (1024**3)
    
    
    def _free_cuda(prefix: str = "", *, hard: bool = False) -> None:
        gc.collect()
        if torch.cuda.is_available():
            try:
                torch.cuda.synchronize()
            except Exception:
                pass
            torch.cuda.empty_cache()
            torch.cuda.ipc_collect()
            if hard:
                try:
                    torch.cuda.reset_peak_memory_stats()
                except Exception:
                    pass
        if prefix:
            LOG.info("%s cuda cache cleared%s", prefix, " (hard)" if hard else "")
    
    
    def _strip_offload_hooks(module: torch.nn.Module | None) -> None:
        if module is None:
            return
        try:
            from accelerate.hooks import remove_hook_from_module
    
            remove_hook_from_module(module, recurse=True)
        except Exception as exc:
            LOG.debug("remove_hook skip: %s", exc)
    
    
    def _vram_report() -> str:
        lines: list[str] = []
        if _PIPE is None:
            lines.append("pipeline: —")
        else:
            mode = _PIPE_OFFLOAD_MODE if _PIPE_CPU_OFFLOAD else "full-gpu"
            lora = _LOADED_LORA or "None"
            lines.append(f"pipeline: loaded via={_LOADED_VIA} ({mode})  lora={lora}")
        if not torch.cuda.is_available():
            lines.append("CUDA: unavailable")
            return "\n".join(lines)
        free_b, total_b = torch.cuda.mem_get_info()
        alloc = torch.cuda.memory_allocated()
        reserved = torch.cuda.memory_reserved()
        peak = torch.cuda.max_memory_allocated()
        lines.append(
            f"VRAM free {free_b / 1024**3:.2f} / {total_b / 1024**3:.2f} GB  "
            f"({100.0 * free_b / total_b:.0f}% free)"
        )
        lines.append(
            f"PyTorch alloc {alloc / 1024**3:.2f} GB  reserved {reserved / 1024**3:.2f} GB  "
            f"peak {peak / 1024**3:.2f} GB"
        )
        return "\n".join(lines)
    
    
    def _park_pipeline_cpu() -> None:
        """Move weights to CPU between runs (VRAM free, RAM warm)."""
        global _PIPE, _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE
        if _PIPE is None:
            return
        pipe = _PIPE
        for name in ("text_encoder", "transformer", "vae", "unet"):
            mod = getattr(pipe, name, None)
            if mod is None:
                continue
            _strip_offload_hooks(mod)
            try:
                mod.to("cpu")
            except Exception as exc:
                LOG.debug("park %s→cpu: %s", name, exc)
        try:
            _strip_offload_hooks(pipe)
            pipe.to("cpu")
        except Exception as exc:
            LOG.debug("park pipe→cpu: %s", exc)
        # Remember offload style so next infer re-hooks (do not claim full-GPU).
        if _PIPE_OFFLOAD_MODE == "none":
            _PIPE_OFFLOAD_MODE = "sequential" if _LOADED_VIA == "bf16" else "model"
        _PIPE_CPU_OFFLOAD = True
        _free_cuda("after park→cpu")
        LOG.info("pipeline parked on CPU (next call re-enables %s offload)", _PIPE_OFFLOAD_MODE)
    
    
    def _unload_all_models() -> str:
        global _PIPE, _LOADED_LORA, _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE, _LOADED_VIA
        dropped = "nothing"
        if _PIPE is not None:
            try:
                _PIPE.to("cpu")
            except Exception:
                pass
            del _PIPE
            _PIPE = None
            _LOADED_LORA = None
            _PIPE_CPU_OFFLOAD = False
            _PIPE_OFFLOAD_MODE = "none"
            _LOADED_VIA = "—"
            dropped = "Krea2"
        _free_cuda("after unload", hard=True)
        LOG.info("unloaded models: %s", dropped)
        return f"Unloaded: {dropped}\n\n{_vram_report()}"
    
    
    def _force_clear_vram() -> str:
        if _PIPE is not None:
            _park_pipeline_cpu()
        _free_cuda("force clear VRAM", hard=True)
        return f"Forced VRAM clear (model parked on CPU).\n\n{_vram_report()}"
    
    
    def _enable_offload(pipe: Krea2Pipeline, mode: str) -> None:
        """Install accelerate offload hooks. mode=model|sequential."""
        global _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE
        mode = "sequential" if mode == "sequential" else "model"
        # Strip stale hooks before re-enabling (park / failed OOM retry leave debris).
        for name in ("text_encoder", "transformer", "vae", "unet"):
            _strip_offload_hooks(getattr(pipe, name, None))
        _strip_offload_hooks(pipe)
        _free_cuda(f"before {mode} offload", hard=True)
        if mode == "sequential":
            LOG.info("enable_sequential_cpu_offload (layerwise — needed for BF16 on 24GB)")
            pipe.enable_sequential_cpu_offload()
        else:
            LOG.info("enable_model_cpu_offload")
            pipe.enable_model_cpu_offload()
        _PIPE_CPU_OFFLOAD = True
        _PIPE_OFFLOAD_MODE = mode
    
    
    def _ensure_on_device_for_infer(pipe: Krea2Pipeline) -> None:
        """After park→cpu, put pipe back where inference expects it."""
        global _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE
        want = _PIPE_OFFLOAD_MODE
        if want in ("model", "sequential") or _PIPE_CPU_OFFLOAD:
            if want == "none":
                want = "sequential" if _LOADED_VIA == "bf16" else "model"
            try:
                _enable_offload(pipe, want)
                return
            except Exception:
                LOG.exception("re-enable %s offload failed; trying full GPU", want)
        try:
            pipe.to("cuda")
            _PIPE_CPU_OFFLOAD = False
            _PIPE_OFFLOAD_MODE = "none"
        except torch.cuda.OutOfMemoryError:
            LOG.warning("pipe.to(cuda) OOM — sequential offload")
            _enable_offload(pipe, "sequential")
    
    
    def _place_pipeline(pipe: Krea2Pipeline, *, prefer_full: bool, bf16: bool = False) -> None:
        """Put pipe on GPU with offload fallback.
    
        BF16 Krea Turbo is ~25GiB — ``enable_model_cpu_offload`` still moves the whole
        transformer onto the GPU (~22GiB) and OOMs denoise on 24GB. Use sequential.
        """
        global _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE
        vram = _vram_gb()
        if prefer_full and not bf16:
            try:
                LOG.info("placing pipeline full-GPU (vram=%.1fGB prefer_full=%s)", vram, prefer_full)
                pipe.to("cuda")
                _PIPE_CPU_OFFLOAD = False
                _PIPE_OFFLOAD_MODE = "none"
                if torch.cuda.is_available():
                    free_gb = torch.cuda.mem_get_info()[0] / (1024**3)
                    LOG.info("full GPU ok — free %.2fGB", free_gb)
                return
            except torch.cuda.OutOfMemoryError:
                LOG.warning("full GPU OOM — falling back to offload")
                _free_cuda("full GPU OOM", hard=True)
    
        # Quantized models: model offload is enough. BF16: sequential only.
        _enable_offload(pipe, "sequential" if bf16 else "model")
    
    
    def _torch_mm() -> tuple[int, int]:
        try:
            parts = torch.__version__.split("+")[0].split(".")
            return int(parts[0]), int(parts[1])
        except Exception:
            return (0, 0)
    
    
    def _try_patch_sage_attn_mask_fallback() -> bool:
        """Krea2 passes attn_mask (text pad + joint DiT). Diffusers sage raises.
    
        Fall back with GQA→MHA expand + Flash/Efficient SDPA (O(N) mem). Avoid MATH first —
        MATH materializes full attn (~3.8GiB at 1024²) and OOMs on 24GB with nunchaku resident.
        Unmasked DiT still uses sage / SA3.
        """
        try:
            import diffusers.models.attention_dispatch as ad
            from diffusers.models.attention_dispatch import AttentionBackendName
        except Exception as exc:
            LOG.warning("sage mask-fallback patch skipped: %s", exc)
            return False
    
        registry = ad._AttentionBackendRegistry
        sage_key = getattr(AttentionBackendName, "SAGE", None)
        if sage_key is None:
            return False
        orig = registry._backends.get(sage_key)
        if orig is None:
            LOG.warning("sage mask-fallback: missing sage registry entry")
            return False
        if getattr(orig, "_krea_mask_fallback", False):
            return True
    
        stats = {"mask_fallback": 0, "sage": 0, "backend": ""}
        SDPBackend = torch.nn.attention.SDPBackend
        # Flash/Efficient first (memory-friendly). MATH last (materializes S×S).
        _MASK_BACKENDS = (
            getattr(SDPBackend, "FLASH_ATTENTION", None),
            getattr(SDPBackend, "EFFICIENT_ATTENTION", None),
            SDPBackend.MATH,
        )
    
        def _expand_gqa_to_mha(q, k, v):
            """q/k/v are BHS D. Repeat KV heads so Flash/Efficient accept them."""
            q_heads = int(q.shape[1])
            kv_heads = int(k.shape[1])
            if q_heads == kv_heads:
                return q, k, v
            if q_heads % kv_heads != 0:
                return q, k, v
            rep = q_heads // kv_heads
            k = k.repeat_interleave(rep, dim=1)
            v = v.repeat_interleave(rep, dim=1)
            return q, k, v
    
        def _sdpa_masked_gqa(
            query,
            key,
            value,
            attn_mask,
            *,
            is_causal: bool,
            scale,
            dropout_p: float,
            enable_gqa: bool = True,
        ):
            # Diffusers sage layout = NHD (B, S, H, D) → BHSD for SDPA
            q = query.permute(0, 2, 1, 3)
            k = key.permute(0, 2, 1, 3)
            v = value.permute(0, 2, 1, 3)
            q, k, v = _expand_gqa_to_mha(q, k, v)
            last_err: Exception | None = None
            for backend in _MASK_BACKENDS:
                if backend is None:
                    continue
                try:
                    with torch.nn.attention.sdpa_kernel(backend):
                        out = torch.nn.functional.scaled_dot_product_attention(
                            query=q,
                            key=k,
                            value=v,
                            attn_mask=attn_mask,
                            dropout_p=dropout_p,
                            is_causal=is_causal,
                            scale=scale,
                        )
                    if not stats["backend"]:
                        stats["backend"] = str(backend).split(".")[-1]
                        LOG.info("masked attn using SDPA %s (GQA expanded to MHA)", stats["backend"])
                    return out.permute(0, 2, 1, 3)
                except torch.cuda.OutOfMemoryError:
                    torch.cuda.empty_cache()
                    last_err = None
                    LOG.warning("masked SDPA %s OOM — try next backend", backend)
                    continue
                except Exception as exc:
                    last_err = exc
                    continue
            if last_err is not None:
                raise last_err
            raise RuntimeError("no SDPA backend succeeded for masked attention")
    
        def sage_with_mask_fallback(
            query,
            key,
            value,
            attn_mask=None,
            is_causal: bool = False,
            scale=None,
            return_lse: bool = False,
            _parallel_config=None,
            dropout_p: float = 0.0,
            enable_gqa: bool = False,
            **kwargs,
        ):
            if attn_mask is not None:
                stats["mask_fallback"] += 1
                if stats["mask_fallback"] == 1:
                    LOG.info(
                        "sage → Flash/Efficient SDPA for masked attn (GQA→MHA); "
                        "unmasked DiT layers stay on sage/SA3"
                    )
                if return_lse:
                    raise ValueError("masked sage fallback does not support return_lse=True")
                return _sdpa_masked_gqa(
                    query,
                    key,
                    value,
                    attn_mask,
                    is_causal=is_causal,
                    scale=scale,
                    dropout_p=dropout_p,
                    enable_gqa=True,
                )
            stats["sage"] += 1
            return orig(
                query=query,
                key=key,
                value=value,
                attn_mask=None,
                is_causal=is_causal,
                scale=scale,
                return_lse=return_lse,
                _parallel_config=_parallel_config,
            )
    
        sage_with_mask_fallback._krea_mask_fallback = True  # type: ignore[attr-defined]
        sage_with_mask_fallback._stats = stats  # type: ignore[attr-defined]
        registry._backends[sage_key] = sage_with_mask_fallback
        ad._sage_attention = sage_with_mask_fallback  # type: ignore[assignment]
        ad._krea_sage_mask_stats = stats  # type: ignore[attr-defined]
        LOG.info("patched Diffusers sage backend: attn_mask → Flash/Efficient SDPA (GQA→MHA)")
        return True
    
    
    def _try_patch_diffusers_sageattn3() -> bool:
        """Monkeypatch Diffusers ``sageattn`` to call SageAttention3 (Blackwell FP4).
    
        Soft experiment: on any SA3 failure (import/shape/scale/LSE/CUDA), fall back to
        original sageattention 2.x. Diffusers still uses backend name ``sage``.
        """
        global _SAGE3_PATCHED, _SAGE3_STATUS
        if _SAGE3_PATCHED:
            return True
        if not SAGE3_ENABLE and ATTENTION not in ("sage3", "sa3", "sageattn3"):
            _SAGE3_STATUS = "disabled"
            return False
    
        try:
            from sageattn3 import sageattn3_blackwell
        except Exception as exc:
            _SAGE3_STATUS = f"import_fail:{type(exc).__name__}"
            LOG.warning("SageAttention3 import failed (%s) — keep SA2", exc)
            return False
    
        try:
            import diffusers.models.attention_dispatch as ad
        except Exception as exc:
            _SAGE3_STATUS = f"diffusers_import_fail:{type(exc).__name__}"
            LOG.warning("cannot import attention_dispatch for SA3 patch: %s", exc)
            return False
    
        orig = getattr(ad, "sageattn", None)
        if orig is None:
            # Diffusers may still set sageattn later after sageattention install; try again.
            try:
                from sageattention import sageattn as orig  # type: ignore
            except Exception as exc:
                _SAGE3_STATUS = f"no_sa2_fallback:{type(exc).__name__}"
                LOG.warning("SA3 patch needs SA2 sageattn fallback (%s)", exc)
                return False
    
        sa3_calls = {"ok": 0, "fallback": 0}
    
        def sageattn_sa3_soft(
            *args,
            q=None,
            k=None,
            v=None,
            tensor_layout: str = "HND",
            is_causal: bool = False,
            sm_scale=None,
            return_lse: bool = False,
            **kwargs,
        ):
            if len(args) >= 3:
                query, key, value = args[0], args[1], args[2]
            else:
                query, key, value = q, k, v
    
            def _sa2():
                sa3_calls["fallback"] += 1
                return orig(
                    q=query,
                    k=key,
                    v=value,
                    tensor_layout=tensor_layout,
                    is_causal=is_causal,
                    sm_scale=sm_scale,
                    return_lse=return_lse,
                    **kwargs,
                )
    
            # SA3 API: no LSE, no custom scale — fall back for those.
            if return_lse or sm_scale is not None:
                return _sa2()
            if query is None or key is None or value is None:
                return _sa2()
    
            try:
                # SA3 wants (B, H, S, D). Diffusers sage uses tensor_layout NHD = (B, S, H, D).
                layout = (tensor_layout or "HND").upper()
                if layout == "NHD":
                    q3 = query.transpose(1, 2).contiguous()
                    k3 = key.transpose(1, 2).contiguous()
                    v3 = value.transpose(1, 2).contiguous()
                    out = sageattn3_blackwell(q3, k3, v3, is_causal=bool(is_causal))
                    out = out.transpose(1, 2).contiguous()
                else:
                    out = sageattn3_blackwell(query, key, value, is_causal=bool(is_causal))
                sa3_calls["ok"] += 1
                if sa3_calls["ok"] == 1:
                    LOG.info("SageAttention3 active (first successful call)")
                return out
            except Exception as exc:
                if sa3_calls["fallback"] == 0:
                    LOG.warning("SageAttention3 call failed (%s) — soft-fallback SA2", exc)
                return _sa2()
    
        ad.sageattn = sageattn_sa3_soft  # type: ignore[assignment]
        _SAGE3_PATCHED = True
        _SAGE3_STATUS = "patched"
        LOG.info(
            "Diffusers sageattn patched → SageAttention3 (soft fallback SA2). "
            "set_attention_backend still uses name 'sage'."
        )
        # Expose counters for /health
        sageattn_sa3_soft._stats = sa3_calls  # type: ignore[attr-defined]
        ad._krea_sage3_stats = sa3_calls  # type: ignore[attr-defined]
        return True
    
    
    def _set_attention_backend(pipe: Krea2Pipeline, preferred: str) -> str:
        """Try SageAttention (optional SA3 patch) then native. Returns backend name used.
    
        Diffusers does not accept ``sdpa`` — map to ``_native_efficient``.
        ``sage3`` / ``sa3`` → patch Diffusers sageattn to SA3, then set backend ``sage``.
        ``sage_hub`` pulls kernels-community/sage-attention; published builds stop
        around torch 2.10, so skip hub on newer images (avoids noisy 404).
        """
        alias = {
            "sdpa": "_native_efficient",
            "efficient": "_native_efficient",
            "default": "_native_efficient",
            "math": "_native_math",
            "sage3": "sage",
            "sa3": "sage",
            "sageattn3": "sage",
        }
        raw_pref = (preferred or "").strip().lower()
        want_sa3 = raw_pref in ("sage3", "sa3", "sageattn3") or SAGE3_ENABLE
        if want_sa3:
            _try_patch_diffusers_sageattn3()
    
        pref = alias.get(raw_pref, raw_pref)
        if not pref:
            pref = "sage"
    
        # Always install mask fallback when using any sage* backend (Krea text_fusion).
        if pref in ("sage", "sage_hub") or want_sa3 or "sage" in pref:
            _try_patch_sage_attn_mask_fallback()
    
        skip_hub = _torch_mm() > (2, 10)
        if skip_hub and pref == "sage_hub":
            LOG.warning(
                "KREA_ATTENTION=sage_hub but torch %s has no kernels-community/sage-attention build "
                "(hub ≤ torch2.10) — trying sage package / native",
                torch.__version__,
            )
            pref = "sage"
    
        candidates: list[str] = []
        if pref not in candidates:
            candidates.append(pref)
        alts = [
            "sage",
            "_sage_qk_int8_pv_fp8_cuda",
            "_sage_qk_int8_pv_fp16_cuda",
            "_native_efficient",
            "_native_flash",
            "native",
        ]
        if not skip_hub:
            alts.insert(0, "sage_hub")
        for alt in alts:
            if alt not in candidates:
                candidates.append(alt)
    
        mods = [getattr(pipe, n, None) for n in ("transformer", "unet")]
        mods = [m for m in mods if m is not None and hasattr(m, "set_attention_backend")]
        if not mods and hasattr(pipe, "set_attention_backend"):
            mods = [pipe]
        if not mods:
            LOG.info("no set_attention_backend — Diffusers default")
            return "default"
    
        last_err: Exception | None = None
        for backend in candidates:
            try:
                for mod in mods:
                    mod.set_attention_backend(backend)
                label = backend
                if backend == "sage" and _SAGE3_PATCHED:
                    label = "sage+SA3_patch"
                LOG.info("attention backend=%s (sage3_status=%s)", label, _SAGE3_STATUS)
                return label
            except Exception as exc:
                last_err = exc
                LOG.warning("attention backend %s failed: %s", backend, exc)
        LOG.warning("all attention backends failed (last=%r) — leaving default", last_err)
        return "default"
    
    
    def _preflight_nunchaku_kernels() -> bool:
        """OzzyGT NVFP4 needs rootonchair/nunchaku-lite-kernels matching this torch/CUDA."""
        try:
            from kernels import get_kernel
    
            LOG.info(
                "preflight nunchaku-lite-kernels torch=%s cuda=%s",
                torch.__version__,
                getattr(torch.version, "cuda", None),
            )
            k = get_kernel("rootonchair/nunchaku-lite-kernels", version=2, trust_remote_code=True)
            LOG.info("nunchaku-lite-kernels OK (%s ops=%s)", type(k).__name__, hasattr(k, "ops"))
            return True
        except Exception as exc:
            LOG.error(
                "nunchaku-lite-kernels unavailable (%s: %s). "
                "Pin chart image to pytorch/pytorch:2.11.0-cuda13.0-cudnn9-devel "
                "(torch 2.12 has no matching kernel build → IndexError).",
                type(exc).__name__,
                exc,
            )
            return False
    
    
    def _torchao_quantize_transformer(pipe: Krea2Pipeline, kind: str) -> None:
        """In-place TorchAO quant on transformer, skipping Linear dims not divisible by 16."""
        from torchao.quantization import quantize_
    
        kind = kind.lower()
        if kind == "nvfp4":
            from torchao.prototype.mx_formats.inference_workflow import (
                NVFP4DynamicActivationNVFP4WeightConfig,
            )
    
            ao = NVFP4DynamicActivationNVFP4WeightConfig(
                use_dynamic_per_tensor_scale=True,
                use_triton_kernel=True,
            )
        elif kind in ("mxfp8", "fp8"):
            from torchao.prototype.mx_formats.inference_workflow import (
                MXDynamicActivationMXWeightConfig,
            )
    
            try:
                from torchao.quantization.quantize_.common import KernelPreference
            except Exception:
                from torchao.quantization import KernelPreference  # type: ignore
    
            ao = MXDynamicActivationMXWeightConfig(
                activation_dtype=torch.float8_e4m3fn,
                weight_dtype=torch.float8_e4m3fn,
                kernel_preference=KernelPreference.AUTO,
            )
        else:
            raise ValueError(f"unsupported TorchAO quant kind: {kind}")
    
        def filter_fn(module: torch.nn.Module, _fqn: str) -> bool:
            if not isinstance(module, torch.nn.Linear):
                return False
            w = module.weight
            if w.ndim < 2:
                return False
            # NVFP4 kernels require trailing dims divisible by 16 (Krea has [1,12] params).
            return bool(w.shape[-1] % 16 == 0 and w.shape[-2] % 16 == 0)
    
        quantize_(pipe.transformer, ao, filter_fn=filter_fn)
        LOG.info("TorchAO %s applied to transformer (filtered Linear %%16==0)", kind)
    
    
    def _enable_vae_memory_savers(pipe: Krea2Pipeline) -> None:
        for fn_name in ("enable_vae_slicing", "enable_vae_tiling"):
            fn = getattr(pipe, fn_name, None)
            if callable(fn):
                try:
                    fn()
                    LOG.info("%s()", fn_name)
                except Exception as exc:
                    LOG.debug("%s failed: %s", fn_name, exc)
    
    
    def _load_pipeline() -> Krea2Pipeline:
        global _PIPE, _PIPE_CPU_OFFLOAD, _PIPE_OFFLOAD_MODE, _LOADED_VIA
        if _PIPE is not None:
            return _PIPE
    
        if not torch.cuda.is_available():
            raise RuntimeError("CUDA GPU is required for Krea-2-Turbo.")
    
        torch_mm = _torch_mm()
        if torch_mm > (2, 11):
            LOG.warning(
                "torch %s > 2.11 — nunchaku-lite-kernels often missing; "
                "use image tag 2.11.0-cuda13.0-cudnn9-devel for OzzyGT NVFP4",
                torch.__version__,
            )
    
        token = _hf_token()
        t0 = time.perf_counter()
        vram = _vram_gb()
        quant = QUANT
        LOG.info(
            "loading repo=%s quant=%s attn=%s vram=%.1fGB try_full=%s torch=%s",
            MODEL_ID,
            quant,
            ATTENTION,
            vram,
            TRY_FULL_GPU,
            torch.__version__,
        )
    
        pipe: Krea2Pipeline | None = None
        loaded_via = "bf16"
    
        # 1) Prefetched Nunchaku Lite NVFP4+NF4 pipeline (smallest VRAM, Diffusers-native).
        if quant in ("nunchaku", "nvfp4"):
            if not _preflight_nunchaku_kernels():
                LOG.warning("skip nunchaku load — kernel preflight failed")
            else:
                try:
                    LOG.info("try nunchaku NVFP4 pipeline %s", NUNCHAKU_MODEL_ID)
                    try:
                        pipe = Krea2Pipeline.from_pretrained(
                            NUNCHAKU_MODEL_ID,
                            torch_dtype=torch.bfloat16,
                            token=token,
                        )
                    except Exception as first:
                        LOG.warning("Krea2Pipeline nunchaku failed (%s) — retry DiffusionPipeline", first)
                        from diffusers import DiffusionPipeline
    
                        pipe = DiffusionPipeline.from_pretrained(  # type: ignore[assignment]
                            NUNCHAKU_MODEL_ID,
                            torch_dtype=torch.bfloat16,
                            token=token,
                        )
                    loaded_via = "nunchaku-nvfp4"
                except Exception as exc:
                    LOG.warning(
                        "nunchaku load failed (%s: %s) — try TorchAO / bf16",
                        type(exc).__name__,
                        exc,
                        exc_info=True,
                    )
                    pipe = None
    
        # 2) TorchAO NVFP4 / MXFP8 on official BF16 weights (filtered Linear dims).
        if pipe is None and quant in ("nvfp4", "mxfp8", "fp8"):
            ao_kind = "nvfp4" if quant == "nvfp4" else "mxfp8"
            try:
                LOG.info("try TorchAO %s on %s (filter Linear dims %%16==0)", ao_kind, MODEL_ID)
                pipe = Krea2Pipeline.from_pretrained(
                    MODEL_ID,
                    torch_dtype=torch.bfloat16,
                    token=token,
                )
                _torchao_quantize_transformer(pipe, ao_kind)
                loaded_via = f"torchao-{ao_kind}"
            except Exception as exc:
                LOG.warning(
                    "TorchAO %s failed (%s: %s) — fall back bf16+sequential offload",
                    ao_kind,
                    type(exc).__name__,
                    exc,
                    exc_info=True,
                )
                pipe = None
    
        # 3) BF16 baseline — ~25GiB weights. Must use sequential offload on 24GB
        #    (model offload still places whole transformer on GPU → denoise OOM).
        if pipe is None:
            LOG.warning(
                "loading BF16 %s — expected slow on 24GB; prefer fixing NVFP4 path",
                MODEL_ID,
            )
            pipe = Krea2Pipeline.from_pretrained(
                MODEL_ID,
                torch_dtype=torch.bfloat16,
                token=token,
            )
            loaded_via = "bf16"
            quant = "bf16"
    
        _set_attention_backend(pipe, ATTENTION)
        _enable_vae_memory_savers(pipe)
    
        is_bf16 = loaded_via == "bf16"
        prefer_full = TRY_FULL_GPU and not is_bf16
        _place_pipeline(pipe, prefer_full=prefer_full, bf16=is_bf16)
    
        _PIPE = pipe
        _LOADED_VIA = loaded_via
        LOG.info(
            "pipeline ready in %.1fs via=%s offload=%s\n%s",
            time.perf_counter() - t0,
            loaded_via,
            _PIPE_OFFLOAD_MODE,
            _vram_report(),
        )
        return _PIPE
    
    
    def _unload_lora(pipe: Krea2Pipeline) -> None:
        global _LOADED_LORA
        try:
            if hasattr(pipe, "unload_lora_weights"):
                pipe.unload_lora_weights()
            elif hasattr(pipe, "transformer") and hasattr(pipe.transformer, "unload_lora"):
                pipe.transformer.unload_lora()
            elif hasattr(pipe, "transformer") and hasattr(pipe.transformer, "delete_adapters"):
                try:
                    pipe.transformer.delete_adapters("default")
                except Exception:
                    pass
        except Exception as exc:
            LOG.warning("unload_lora failed (continuing): %r", exc)
        _LOADED_LORA = None
    
    
    def _apply_lora(pipe: Krea2Pipeline, lora_key: str, strength: float) -> None:
        """Unload previous LoRA, then load selected official/extra LoRA at strength."""
        global _LOADED_LORA
        key = (lora_key or "None").strip()
        if key == "None" or key not in LORA_CATALOG or not LORA_CATALOG[key].get("repo"):
            if _LOADED_LORA is not None:
                _unload_lora(pipe)
            return
    
        meta = LORA_CATALOG[key]
        repo = meta["repo"]
        weight_name = meta.get("weight_name") or None
        strength = float(max(0.0, min(2.0, strength)))
    
        if _LOADED_LORA != key:
            _unload_lora(pipe)
            LOG.info("loading LoRA key=%s repo=%s weight=%s strength=%.2f", key, repo, weight_name, strength)
            token = _hf_token()
            try:
                if hasattr(pipe, "transformer") and hasattr(pipe.transformer, "load_lora_adapter"):
                    kwargs: dict[str, Any] = {}
                    if weight_name:
                        kwargs["weight_name"] = weight_name
                    if token:
                        kwargs["token"] = token
                    pipe.transformer.load_lora_adapter(repo, **kwargs)
                else:
                    kwargs = {}
                    if weight_name:
                        kwargs["weight_name"] = weight_name
                    if token:
                        kwargs["token"] = token
                    pipe.load_lora_weights(repo, **kwargs)
                _LOADED_LORA = key
            except Exception:
                LOG.exception("failed loading LoRA %s", repo)
                raise
    
        try:
            if hasattr(pipe, "transformer") and hasattr(pipe.transformer, "set_adapters"):
                pipe.transformer.set_adapters("default", weights=strength)
            elif hasattr(pipe, "set_adapters"):
                pipe.set_adapters(["default"], adapter_weights=[strength])
            elif hasattr(pipe, "fuse_lora"):
                pipe.fuse_lora(lora_scale=strength)
        except Exception as exc:
            LOG.warning("set LoRA strength failed: %r", exc)
    
    
    def _maybe_append_trigger(prompt: str, lora_key: str) -> str:
        meta = LORA_CATALOG.get(lora_key) or {}
        trigger = (meta.get("trigger") or "").strip()
        if not trigger:
            return prompt
        if trigger.lower() in prompt.lower():
            return prompt
        return f"{prompt.rstrip()}, {trigger}"
    
    
    def generate_image(
        prompt: str,
        negative_prompt: str = "",
        width: int = 1024,
        height: int = 1024,
        steps: int = 8,
        guidance: float = 0.0,
        seed: int = 0,
        randomize_seed: bool = False,
        lora_key: str = "None",
        lora_strength: float = 1.0,
        park_vram: bool = PARK_AFTER_GENERATE,
        unload_after: bool = UNLOAD_AFTER_GENERATE,
        progress=None,
    ):
        global _PIPE_CPU_OFFLOAD
    
        if not prompt or not prompt.strip():
            raise ValueError("Prompt is required.")
    
        if randomize_seed or seed < 0:
            seed = random.randint(0, MAX_SEED)
    
        width = int(max(256, min(2048, width)))
        height = int(max(256, min(2048, height)))
        width = (width // 64) * 64 or 64
        height = (height // 64) * 64 or 64
        steps = int(max(1, min(50, steps)))
        guidance = float(guidance)
    
        t_total = time.perf_counter()
        with _PIPE_LOCK:
            t0 = time.perf_counter()
            pipe = _load_pipeline()
            _ensure_on_device_for_infer(pipe)
            pipeline_s = time.perf_counter() - t0
    
            t_lora = time.perf_counter()
            _apply_lora(pipe, lora_key, lora_strength)
            lora_s = time.perf_counter() - t_lora
            final_prompt = _maybe_append_trigger(prompt.strip(), lora_key)
    
            if progress is not None:
                progress(0.05, desc="Generating…")
    
            gen_device = "cpu" if _PIPE_CPU_OFFLOAD else ("cuda" if torch.cuda.is_available() else "cpu")
            generator = torch.Generator(device=gen_device).manual_seed(int(seed))
            t_den = time.perf_counter()
            kwargs: dict[str, Any] = {
                "prompt": final_prompt,
                "width": width,
                "height": height,
                "num_inference_steps": steps,
                "guidance_scale": guidance,
                "generator": generator,
            }
            if negative_prompt and negative_prompt.strip():
                kwargs["negative_prompt"] = negative_prompt.strip()
    
            try:
                image = pipe(**kwargs).images[0]
            except torch.cuda.OutOfMemoryError:
                via = str(_LOADED_VIA or "")
                quant_like = any(
                    x in via for x in ("nunchaku", "nvfp4", "mxfp8", "torchao")
                )
                if quant_like or _PIPE_OFFLOAD_MODE == "sequential":
                    # Sequential offload breaks nunchaku/bitsandbytes (meta tensor copy).
                    _free_cuda("denoise OOM (quant — no sequential escalate)", hard=True)
                    LOG.error(
                        "denoise OOM via=%s size=%sx%s — try 512–768 or free other GPU apps. "
                        "Sequential offload skipped (breaks quantized weights).",
                        via,
                        width,
                        height,
                    )
                    raise
                # BF16 path only: escalate model→sequential once.
                LOG.warning(
                    "denoise OOM with offload=%s — escalate to sequential and retry once",
                    _PIPE_OFFLOAD_MODE,
                )
                _free_cuda("denoise OOM", hard=True)
                try:
                    _enable_offload(pipe, "sequential")
                except Exception:
                    LOG.exception("sequential offload after OOM failed")
                    raise
                gen_device = "cpu"
                generator = torch.Generator(device=gen_device).manual_seed(int(seed))
                kwargs["generator"] = generator
                image = pipe(**kwargs).images[0]
            denoise_s = time.perf_counter() - t_den
    
            if hasattr(pipe, "maybe_free_model_hooks"):
                try:
                    pipe.maybe_free_model_hooks()
                except Exception:
                    pass
    
            mem_extra = ""
            if unload_after:
                _unload_all_models()
                mem_extra = "unloaded"
            elif park_vram:
                _park_pipeline_cpu()
                mem_extra = "parked"
            else:
                _free_cuda("after generate")
    
            total_s = time.perf_counter() - t_total
            timing = (
                f"mode={_PIPE_OFFLOAD_MODE if _PIPE_CPU_OFFLOAD else 'full-gpu'} via={_LOADED_VIA}  "
                f"{width}×{height}  steps={steps}\n"
                f"pipeline  {pipeline_s:7.2f}s\n"
                f"lora      {lora_s:7.2f}s  ({lora_key})\n"
                f"denoise   {denoise_s:7.2f}s\n"
                f"total     {total_s:7.2f}s"
                + (f"  ({mem_extra})" if mem_extra else "")
                + f"\n\n{_vram_report()}"
            )
            LOG.info(
                "[timing] pipeline=%.2fs lora=%.2fs denoise=%.2fs total=%.2fs seed=%s %sx%s steps=%s lora=%s %s",
                pipeline_s,
                lora_s,
                denoise_s,
                total_s,
                seed,
                width,
                height,
                steps,
                lora_key,
                mem_extra,
            )
            return image, int(seed), final_prompt, timing
    
    
    def _gradio_generate(
        prompt: str,
        negative_prompt: str,
        width: int,
        height: int,
        steps: int,
        guidance: float,
        seed: int,
        randomize_seed: bool,
        lora_key: str,
        lora_strength: float,
        park_vram: bool,
        unload_after: bool,
        progress=gr.Progress(track_tqdm=True),
    ):
        try:
            return generate_image(
                prompt=prompt,
                negative_prompt=negative_prompt,
                width=int(width),
                height=int(height),
                steps=int(steps),
                guidance=float(guidance),
                seed=int(seed),
                randomize_seed=bool(randomize_seed),
                lora_key=lora_key,
                lora_strength=float(lora_strength),
                park_vram=bool(park_vram),
                unload_after=bool(unload_after),
                progress=progress,
            )
        except Exception as exc:
            LOG.exception("generate failed")
            raise gr.Error(str(exc)) from exc
    
    
    def build_gradio() -> gr.Blocks:
        lora_choices = list(LORA_CATALOG.keys())
        with gr.Blocks(title="Krea 2 Turbo One") as demo:
            gr.Markdown(
                "# Krea 2 Turbo One\n"
                "Krea-2-Turbo (12B DiT, 8-step distilled) text-to-image on Olares One "
                "(RTX 5090M 24GB). Gradio UI + REST `/api/v1/generate`.\n\n"
                f"Quant **`{QUANT}`** · attention **`{ATTENTION}`** · model `{MODEL_ID}`.\n\n"
                "[Model](https://huggingface.co/krea/Krea-2-Turbo) · "
                "[Official LoRAs](https://huggingface.co/collections/krea) · "
                "License: **Krea 2 Community License** (commercial OK if org T12 revenue &lt; $1M).\n\n"
                "Default **NVFP4** (Nunchaku Lite, else TorchAO) so DiT fits 24GB with denoise headroom. "
                "BF16 full-GPU is disabled (OOM). Attention default `sage3` (SA3 Diffusers patch, "
                "soft-fallback SA2; masked text_fusion auto-falls to `_native_efficient`). "
                "Set `KREA_ATTENTION=_native_efficient` to force SDPA everywhere. "
                "Park-on-CPU after generate frees VRAM (default ON)."
            )
    
            with gr.Row():
                with gr.Column():
                    prompt = gr.Textbox(
                        label="Prompt",
                        value="a red fox sitting in fresh snow, golden hour, photorealistic",
                        lines=3,
                    )
                    negative = gr.Textbox(label="Negative prompt", value="", lines=2)
                    with gr.Row():
                        width = gr.Slider(512, 2048, value=768, step=64, label="Width")
                        height = gr.Slider(512, 2048, value=768, step=64, label="Height")
                    with gr.Row():
                        steps = gr.Slider(1, 50, value=8, step=1, label="Steps")
                        guidance = gr.Slider(0.0, 10.0, value=0.0, step=0.1, label="Guidance")
                    with gr.Row():
                        seed = gr.Number(label="Seed", value=0, precision=0)
                        randomize = gr.Checkbox(label="Randomize seed", value=True)
                    with gr.Row():
                        lora = gr.Dropdown(
                            choices=lora_choices,
                            value="None",
                            label="LoRA (official styles)",
                            info="Unload + switch before each change. Triggers auto-appended when set.",
                        )
                        lora_strength = gr.Slider(0.0, 2.0, value=1.0, step=0.05, label="LoRA strength")
                    with gr.Accordion("Advanced / VRAM", open=False):
                        park_vram = gr.Checkbox(
                            label="Park model on CPU after generate (free VRAM)",
                            value=PARK_AFTER_GENERATE,
                            info="Keeps weights in RAM; next generate reloads to GPU. Stops rising OOM.",
                        )
                        unload_after = gr.Checkbox(
                            label="Unload model after generate (full free)",
                            value=UNLOAD_AFTER_GENERATE,
                            info="Drops pipeline from memory. Next run cold-loads.",
                        )
                        mem_status = gr.Textbox(
                            label="Memory status",
                            lines=5,
                            interactive=False,
                            value=_vram_report(),
                        )
                        with gr.Row():
                            btn_refresh = gr.Button("Refresh")
                            btn_park = gr.Button("Force clear VRAM")
                            btn_unload = gr.Button("Unload model", variant="stop")
                    run = gr.Button("Generate", variant="primary")
                with gr.Column():
                    out_image = gr.Image(label="Output", type="pil")
                    out_timing = gr.Textbox(
                        label="Timing",
                        lines=8,
                        interactive=False,
                        placeholder="pipeline / lora / denoise / total + VRAM",
                    )
                    out_seed = gr.Number(label="Seed used", precision=0)
                    out_prompt = gr.Textbox(label="Final prompt", lines=2)
    
            run.click(
                _gradio_generate,
                inputs=[
                    prompt,
                    negative,
                    width,
                    height,
                    steps,
                    guidance,
                    seed,
                    randomize,
                    lora,
                    lora_strength,
                    park_vram,
                    unload_after,
                ],
                outputs=[out_image, out_seed, out_prompt, out_timing],
            ).then(lambda: _vram_report(), outputs=[mem_status])
    
            btn_refresh.click(lambda: _vram_report(), outputs=[mem_status])
            btn_park.click(_force_clear_vram, outputs=[mem_status])
            btn_unload.click(_unload_all_models, outputs=[mem_status])
    
            gr.Examples(
                examples=[
                    ["a red fox sitting in fresh snow, golden hour, photorealistic"],
                    ["two samurais in flowing robes doing a muay thai fight"],
                    ["an isometric illustration of a tiny floating city in the clouds"],
                ],
                inputs=[prompt],
            )
    
        return demo
    
    
    # ----- FastAPI -----
    
    
    class GenerateRequest(BaseModel):
        prompt: str
        negative_prompt: str = ""
        width: int = Field(default=768, ge=256, le=2048)
        height: int = Field(default=768, ge=256, le=2048)
        steps: int = Field(default=8, ge=1, le=50)
        guidance: float = Field(default=0.0, ge=0.0, le=20.0)
        seed: int = -1
        lora: str = "None"
        lora_strength: float = Field(default=1.0, ge=0.0, le=2.0)
        park_vram: bool = True
        unload_after: bool = False
        response_format: str = Field(default="b64_json", description="b64_json only for now")
    
    
    class GenerateResponse(BaseModel):
        seed: int
        width: int
        height: int
        prompt: str
        lora: str
        image_b64: str
        mime_type: str = "image/png"
        timing: str = ""
    
    
    def build_api(demo: gr.Blocks) -> FastAPI:
        @asynccontextmanager
        async def lifespan(_app: FastAPI):
            async with mcp.session_manager.run():
                yield
    
        api = FastAPI(title="Krea 2 Turbo One", version="1.0.22", docs_url="/docs", lifespan=lifespan)
    
        @api.get("/")
        def root():
            return RedirectResponse(url="/ui/", status_code=307)
    
        # Gradio file URLs sometimes omit /ui prefix behind reverse proxy.
        @api.get("/gradio_api/{path:path}")
        def _gradio_api_prefix_fix(path: str):
            from urllib.parse import quote
    
            return RedirectResponse(url=f"/ui/gradio_api/{quote(path, safe='/')}", status_code=307)
    
        @api.head("/gradio_api/{path:path}")
        def _gradio_api_prefix_fix_head(path: str):
            from urllib.parse import quote
    
            return RedirectResponse(url=f"/ui/gradio_api/{quote(path, safe='/')}", status_code=307)
    
        @api.get("/health")
        def health():
            ready = _PIPE is not None
            sage3_stats = None
            sage_mask_stats = None
            try:
                import diffusers.models.attention_dispatch as ad
    
                sage3_stats = getattr(ad, "_krea_sage3_stats", None)
                sage_mask_stats = getattr(ad, "_krea_sage_mask_stats", None)
            except Exception:
                pass
            return {
                "status": "ok",
                "model": MODEL_ID,
                "quant": QUANT,
                "attention": ATTENTION,
                "sage3_status": _SAGE3_STATUS,
                "sage3_patched": _SAGE3_PATCHED,
                "sage3_stats": sage3_stats,
                "sage_mask_fallback_stats": sage_mask_stats,
                "pipeline_loaded": ready,
                "loaded_via": _LOADED_VIA if ready else None,
                "cpu_offload": _PIPE_CPU_OFFLOAD if ready else None,
                "offload_mode": _PIPE_OFFLOAD_MODE if ready else None,
                "cuda": torch.cuda.is_available(),
                "vram_gb": round(_vram_gb(), 2) if torch.cuda.is_available() else 0,
                "vram": _vram_report(),
                "loras": [k for k in LORA_CATALOG.keys() if k != "None"],
                "mcp": {"transport": "streamable-http", "url": "/mcp/mcp"},
            }
    
        @api.get("/api/mcp")
        def mcp_info():
            return {
                "transport": "streamable-http",
                "endpoints": ["/mcp/mcp"],
                "tools": [
                    "health_check",
                    "list_loras",
                    "generate_image",
                    "clear_vram",
                    "unload_model",
                ],
                "in_cluster_url": "http://krea2turboone:7860/mcp/mcp",
                "note": "Pipecat: add shared entrance krea2turboone URL + /mcp/mcp",
            }
    
        @api.post("/api/v1/unload")
        def api_unload():
            with _PIPE_LOCK:
                return {"ok": True, "detail": _unload_all_models()}
    
        @api.post("/api/v1/clear_vram")
        def api_clear_vram():
            with _PIPE_LOCK:
                return {"ok": True, "detail": _force_clear_vram()}
    
        @api.post("/api/v1/generate", response_model=GenerateResponse)
        def api_generate(body: GenerateRequest):
            try:
                image, seed_out, final_prompt, timing = generate_image(
                    prompt=body.prompt,
                    negative_prompt=body.negative_prompt,
                    width=body.width,
                    height=body.height,
                    steps=body.steps,
                    guidance=body.guidance,
                    seed=body.seed if body.seed >= 0 else 0,
                    randomize_seed=body.seed < 0,
                    lora_key=body.lora,
                    lora_strength=body.lora_strength,
                    park_vram=body.park_vram,
                    unload_after=body.unload_after,
                )
            except ValueError as exc:
                raise HTTPException(status_code=400, detail=str(exc)) from exc
            except Exception as exc:
                LOG.exception("api generate failed")
                raise HTTPException(status_code=500, detail=str(exc)) from exc
    
            buf = io.BytesIO()
            image.save(buf, format="PNG")
            b64 = base64.b64encode(buf.getvalue()).decode("ascii")
            return GenerateResponse(
                seed=seed_out,
                width=(body.width // 64) * 64 or 64,
                height=(body.height // 64) * 64 or 64,
                prompt=final_prompt,
                lora=body.lora,
                image_b64=b64,
                timing=timing,
            )
    
        def _gradio_allowed_paths() -> list[str]:
            """Serve generated files from Gradio temp dir and legacy /tmp/gradio."""
            order = (_GRADIO_TEMP_DIR, "/tmp/gradio", "/output")
            return list(dict.fromkeys(os.path.realpath(p) for p in order))
    
        api.mount("/mcp", mcp_http_app())
    
        return gr.mount_gradio_app(
            api,
            demo.queue(default_concurrency_limit=1),
            path=_GRADIO_MOUNT_PATH,
            root_path=_GRADIO_ROOT_PATH,
            allowed_paths=_gradio_allowed_paths(),
        )
    
    
    def main() -> None:
        _setup_logging()
        LOG.info("starting Krea 2 Turbo One on 0.0.0.0:%s model=%s", SERVER_PORT, MODEL_ID)
        demo = build_gradio()
        app = build_api(demo)
        uvicorn.run(app, host="0.0.0.0", port=SERVER_PORT, log_level=os.getenv("LOG_LEVEL", "info").lower())
    
    
    if __name__ == "__main__":
        main()
    
