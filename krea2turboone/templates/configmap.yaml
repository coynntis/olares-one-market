    LOG = logging.getLogger("krea2turboone")
    
    MODEL_ID = os.getenv("KREA_MODEL_ID", "krea/Krea-2-Turbo").strip() or "krea/Krea-2-Turbo"
    # nvfp4 | mxfp8 | nunchaku | bf16 — nvfp4 default for 5090M 24GB (BF16 full-GPU OOMs).
    QUANT = os.getenv("KREA_QUANT", "nvfp4").strip().lower() or "nvfp4"
    # sage3 (SA3 patch→Diffusers sage) | sage | sage_hub | _native_efficient
    # sage3: install sageattn3 + monkeypatch diffusers sageattn; soft-fallback to SA2.
    ATTENTION = os.getenv("KREA_ATTENTION", "sage3").strip().lower() or "sage3"
    # Soft SA3 experiment: 1=try patch even when ATTENTION=sage. 0=never.
    SAGE3_ENABLE = os.getenv("KREA_SAGE3", "1").strip().lower() not in ("0", "false", "no")
    
    NUNCHAKU_MODEL_ID = (
        os.getenv("KREA_NUNCHAKU_MODEL_ID", "OzzyGT/Krea_2_Turbo_nunchaku_lite_nvfp4").strip()
        or "OzzyGT/Krea_2_Turbo_nunchaku_lite_nvfp4"
    )
    SERVER_PORT = int(os.getenv("SERVER_PORT", "7860"))
    MAX_SEED = 2**31 - 1
    VRAM_OFFLOAD_THRESHOLD_GB = float(os.getenv("KREA_VRAM_OFFLOAD_GB", "25"))
    # Default OFF for BF16 (22GB+ weights leave no denoise headroom). ON when quantized.
    _TRY_FULL_DEFAULT = "0" if QUANT in ("bf16", "none", "") else "1"
    TRY_FULL_GPU = os.getenv("KREA_TRY_FULL_GPU", _TRY_FULL_DEFAULT).strip().lower() not in (
        "0",
