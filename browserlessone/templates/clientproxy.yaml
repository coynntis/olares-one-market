---
apiVersion: v1
data:
  nginx.conf: |
    server {

      listen 8080;
      server_name _;
      absolute_redirect off;
      port_in_redirect off;
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log  /opt/bitnami/openresty/nginx/logs/error.log;

      proxy_connect_timeout                          600s;
      proxy_send_timeout                             600s;
      proxy_read_timeout                             1800s;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_http_version 1.1;
      proxy_set_header      Host                      $host;
      proxy_set_header      X-Real-IP                 $remote_addr;
      proxy_set_header      X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto         https;
      proxy_set_header      X-Forwarded-Host          $host;
      proxy_set_header      upgrade                   $http_upgrade;
      proxy_set_header      connection                "upgrade";

      # Browserless debugger needs /debugger/ trailing slash or relative assets resolve to site root.
      rewrite ^/debugger$ /debugger/ permanent;

      # Safety net: rewrite debugger bundles requested from site root → /debugger/*
      rewrite ^/(app\.bundle\.js|tracker\.js|router\.js|puppeteer\.worker\.bundle\.js|editor\.worker\.bundle\.js|ts\.worker\.bundle\.js)$ /debugger/$1 last;
      rewrite ^/([a-f0-9]+\.(ttf|woff2?))$ /debugger/$1 last;
      rewrite ^/(.+\.worker\.bundle\.js)$ /debugger/$1 last;

      # Debugger UI calls /sessions etc. without ?token= — inject chart default when missing.
      location = /sessions {
        if ($arg_token = "") {
          rewrite ^ /sessions?token={{ .Values.browserless.token | default "browserlessone" }} break;
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }

      location = /json/list {
        if ($arg_token = "") {
          rewrite ^ /json/list?token={{ .Values.browserless.token | default "browserlessone" }} break;
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }

      location = /json/version {
        if ($arg_token = "") {
          rewrite ^ /json/version?token={{ .Values.browserless.token | default "browserlessone" }} break;
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }

      location = /pressure {
        if ($arg_token = "") {
          rewrite ^ /pressure?token={{ .Values.browserless.token | default "browserlessone" }} break;
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }

      location ~ ^/kill/ {
        if ($arg_token = "") {
          rewrite ^(.*)$ $1?token={{ .Values.browserless.token | default "browserlessone" }} break;
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }

      location / {
        # Redirect bare browser visit to / only (no query). WS + ?token=&launch= use location / proxy.
        set $redirect_debugger 0;
        if ($uri = /) {
          set $redirect_debugger 1;
        }
        if ($args != "") {
          set $redirect_debugger 0;
        }
        if ($http_upgrade = "websocket") {
          set $redirect_debugger 0;
        }
        if ($redirect_debugger = 1) {
          return 302 /debugger/?token={{ .Values.browserless.token | default "browserlessone" }};
        }
        add_header X-Frame-Options "";
        proxy_pass http://browserlessone:3000;
      }
    }

kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: browserlessonecli
  name: browserlessonecli
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: {{ .Values.workloads.browserlessonecli.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: browserlessonecli
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: browserlessonecli
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: browserlessonecli
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: browserlessonecli
  ports:
    - name: browserlessonecli
      protocol: TCP
      port: 8080
      targetPort: 8080
