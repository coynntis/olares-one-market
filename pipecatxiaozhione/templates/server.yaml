---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: pipecatxiaozhione
  name: pipecatxiaozhione
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloads.pipecatxiaozhione.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: pipecatxiaozhione
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network.chrome-default: "true"
        io.kompose.service: pipecatxiaozhione
    spec:
      {{- $olaresEnv := .Values.olaresEnv | default dict -}}
      {{- $image := .Values.image | default dict -}}
      {{- $token := ($olaresEnv.GITHUB_TOKEN | default "") | trim -}}
      {{- $repo := $image.repository | default "ghcr.io/coynntis/pipecat-xiaozhi-bridge" -}}
      {{- $tag := $image.tag | default "0.5.4" -}}
      {{- $pull := $image.pullPolicy | default "IfNotPresent" -}}
      {{- if and $token (hasPrefix "ghcr.io/" $repo) }}
      imagePullSecrets:
        - name: pipecatxiaozhione-ghcr
      {{- end }}
      containers:
        - name: pipecat-xiaozhi-bridge
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: "{{ $pull }}"
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: CONFIG_PATH
              value: "/data/config.json"
            - name: UDP_AUDIO_PORT
              value: "8765"
            - name: SETTINGS_TOKEN
              value: ""
            - name: TTS_PROVIDER
              value: "melo"
            - name: TTS_BASE_URL
              value: "http://pipecatxiaozhimelo:8000/v1"
          volumeMounts:
            - name: bridge-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 240
          resources:
            limits:
              cpu: "8"
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: bridge-data
          hostPath:
            path: "{{ .Values.userspace.appData }}/config"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: pipecatxiaozhione
  name: pipecatxiaozhione
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: http-ws
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: pipecatxiaozhione
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: pipecatxiaozhione
  name: sharedentrances-pipecatxiaozhione
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "pipecatxiaozhione"
      port: 80
      targetPort: 8000
  selector:
    io.kompose.service: pipecatxiaozhione
