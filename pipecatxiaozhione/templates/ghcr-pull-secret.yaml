{{- $olaresEnv := .Values.olaresEnv | default dict -}}
{{- $image := .Values.image | default dict -}}
{{- $melo := .Values.melo | default dict -}}
{{- $sherpa := .Values.sherpa | default dict -}}
{{- $kokoro := .Values.kokoro | default dict -}}
{{- $token := ($olaresEnv.GITHUB_TOKEN | default "") | trim -}}
{{- $user := ($olaresEnv.GHCR_USER | default "") | trim -}}
{{- $repo := $image.repository | default "" -}}
{{- $meloRepo := $melo.repository | default "" -}}
{{- $sherpaRepo := $sherpa.repository | default "" -}}
{{- $kokoroRepo := $kokoro.repository | default "ghcr.io/remsky/kokoro-fastapi-cpu" -}}
{{- $needGhcr := or (hasPrefix "ghcr.io/" $repo) (hasPrefix "ghcr.io/" $meloRepo) (hasPrefix "ghcr.io/" $sherpaRepo) (hasPrefix "ghcr.io/" $kokoroRepo) -}}
{{- if and $token $user $needGhcr }}
{{- $auth := printf "%s:%s" $user $token | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: pipecatxiaozhione-ghcr
  namespace: "{{ .Release.Namespace }}"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $user $token $auth | b64enc }}
{{- end }}
