---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: sglangernieimageone
  name: sglangernieimageone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.sglangernieimageone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: sglangernieimageone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: sglangernieimageone
    spec:
      initContainers:
        - name: fix-shared-llms-perms
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - mkdir -p /shared-models/llms/huggingface && chmod -R 777 /shared-models && echo shared-llms-dir-ready
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
      containers:
        - name: sglang-server
          image: "lmsysorg/sglang:dev-cu13"
          command:
            - "zsh"
            - "-c"
          args:
            - |
              set -e
              if [ ! -d /workspace/sglang ]; then
                git clone https://github.com/sgl-project/sglang.git /workspace/sglang
              fi
              cd /workspace/sglang
              pip install -e "python[diffusion]"
              sglang serve --model-path baidu/ERNIE-Image --dit-layerwise-offload --vae-tiling --vae-cpu-offload --text-encoder-cpu-offload --trust-remote-code --host 0.0.0.0 --port 30000
          env:
            - name: HF_HOME
              value: "/shared-models/llms/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.HF_TOKEN }}"
            - name: HF_ENDPOINT
              value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
          ports:
            - containerPort: 30000
          startupProbe:
            tcpSocket:
              port: 30000
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 1200
          livenessProbe:
            tcpSocket:
              port: 30000
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/workspace"
              name: workspace
            - mountPath: "/dev/shm"
              name: dshm
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: workspace
          hostPath:
            path: "{{ .Values.userspace.appData }}/workspace"
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: sglangernieimageone
  name: sglangernieimageone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "sglang"
      port: 30000
      targetPort: 30000
  selector:
    io.kompose.service: sglangernieimageone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: sglangernieimageone
  name: sharedentrances-sglangernieimageone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "sglangernieimageone"
      port: 80
      targetPort: 30000
  selector:
    io.kompose.service: sglangernieimageone
