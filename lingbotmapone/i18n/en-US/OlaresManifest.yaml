---
olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  lingbotmapone: 1
  lingbotmaponecli: 1
metadata:
  name: lingbotmapone
  icon: https://cdn.olares.com/images/2026/07/93ed8bbdced8d0d386843864f53158f4.png
  description: Streaming 3D reconstruction (viser + REST)
  title: LingBot Map One
  version: 1.0.16
  categories:
    - AI
sharedEntrances:
  - name: lingbotmapone
    host: sharedentrances-lingbotmapone
    port: 0
    title: LingBot Map One API
    icon: https://cdn.olares.com/images/2026/07/93ed8bbdced8d0d386843864f53158f4.png
    invisible: true
    authLevel: internal
entrances:
  - name: lingbotmaponecli
    port: 8080
    host: lingbotmaponecli
    title: LingBot Map One
    icon: https://cdn.olares.com/images/2026/07/93ed8bbdced8d0d386843864f53158f4.png
    openMethod: window
    authLevel: internal
spec:
  versionName: 1.0.16
  featuredImage: https://cdn.olares.com/images/2026/07/a1583cc2feca244a60a4aa2c610853e0.png
  fullDescription: |
    LingBot-Map Geometric Context Transformer for streaming 3D reconstruction.

    Hardware: Olares One — RTX 5090M 24GB + 96GB DDR5.

    Runtime image: pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (required for sm_120).

    Weights: robbyant/lingbot-map
    Source: https://github.com/Robbyant/lingbot-map
    Project: https://technology.robbyant.com/lingbot-map

    Boot lessons (Krea soft-ready):
    - soft-ready HTTP on :7860 before uv/pip/HF download (pass ~30m install gate)
    - uv pip --target /workspace/lingbotmapone/site-packages (persist uv + cache)
    - purge torch shadow from site-packages (image owns torch)
    - bootstrap attempts + download progress → /workspace/lingbotmapone/bootstrap.log
    - GET /health shows phase / attempts_tail while installing

    UI: /ui Gradio · open /viser/ for 3D viewer (HTTP+WS proxy) · Measure folder
    (click → closest point, distance, triangle area) · REST /api/v1 · health: GET /health
  developer: Robbyant
  website: https://technology.robbyant.com/lingbot-map
  sourceCode: https://github.com/Robbyant/lingbot-map
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/Robbyant/lingbot-map
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '13'
      requiredMemory: 4Gi
      limitedMemory: 49Gi
      requiredDisk: 30Gi
      limitedDisk: 80Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
  upgradeDescription: |
    - **1.0.16**: Max frames 2048; frame stride (skip every Nth); richer Gradio param help; viser Measure (closest-point pick, distance, triangle area).
    - **1.0.15**: Always-visible Open Viser link (/viser/) + copyable URL in Gradio.
    - **1.0.14**: Fix Gradio queue stuck — viser animate() no longer blocks worker; Cancel job / Stop viser / run history + REST cancel.
    - **1.0.13**: Fix viser WS — forward Sec-WebSocket-Protocol (viser-v*); nginx /viser no 307.
    - **1.0.12**: Fix blank /viser — gzip double-decode in FastAPI proxy; nginx routes /viser/ → :8090 directly.
    - **1.0.11**: Viser at /viser/ full page + Gradio link only (no iframe).
    - **1.0.10**: Fix viser crash — matplotlib.cm.get_cmap removed in mpl 3.9 (shim + pin matplotlib<3.9).
    - **1.0.9**: Real reconstruct + viser iframe (/viser proxy). Upload images/video or folder path; live RTSP not yet (upstream demo limit).
    - **1.0.8**: Fix Gradio file URLs — import mount_gradio; redirect /gradio_api/* to /ui/gradio_api/* (query preserved).
    v1.0.7: base image pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (sm_120 / RTX 5090M); was 2.6+cu12.4 with no Blackwell kernels.
    v1.0.4: vision loader API fix (repo_id_or_path dir).
    v1.0.3: audit upstream inference deps; deps marker v3.
    v1.0.2: omegaconf + reinstall after --no-deps.
    v1.0.1: Helm-safe soft_ready / ConfigMap brace escape.
    v1.0.0: initial chart — soft-ready + uv site-packages + Gradio/REST.

permission:
  appData: true
envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_REPO_ID
    required: false
    editable: true
    applyOnChange: true
    value: 'robbyant/lingbot-map'
  - envName: UV_INDEX_URL
    required: false
    editable: true
    applyOnChange: true
    value: ''
  - envName: LINGBOT_MAP_CKPT
    required: false
    editable: true
    applyOnChange: true
    value: 'lingbot-map-long.pt'
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
