---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-agentworld-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/Qwen-AgentWorld-35B-A3B-GGUF"
  TARGET_FILE: "Qwen-AgentWorld-35B-A3B-UD-Q4_K_XL.gguf"
  MODEL_ALIAS: "qwen-agentworld-35b-a3b"
  THREADS: "16"
  CTX_SIZE: "131072"
  BATCH_SIZE: "1024"
  UBATCH_SIZE: "512"
  CACHE_TYPE_K: "q8_0"
  CACHE_TYPE_V: "turbo4"
  PARALLEL: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppagentworld35bone
  name: llamacppagentworld35bone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.llamacppagentworld35bone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacppagentworld35bone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppagentworld35bone
    spec:
      initContainers:
        - name: fix-shared-perms
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command: ["sh", "-c", "mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo perms-fixed"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
      containers:
        - name: llamacpp-server
          image: "docker.io/aamsellem/buun-llama-cpp:87c351d2"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR"
              find_comfy_llms() {
                local name="$1" src
                [ -n "$name" ] || return 1
                [ -d /comfyui-llms ] || return 1
                src="$(find /comfyui-llms -maxdepth 4 -type f -name "$name" 2>/dev/null | head -n 1)"
                [ -n "$src" ] && [ -f "$src" ] || return 1
                printf '%s\n' "$src"
              }
              link_from_comfy_llms() {
                local dest="$1" name src
                name="$(basename "$dest")"
                [ -n "$name" ] || return 1
                src="$(find_comfy_llms "$name")" || return 1
                if [ -f "$dest" ] && [ ! -L "$dest" ]; then
                  return 1
                fi
                echo "[comfy-reuse] $src → $dest (symlink, skip redownload)" >&2
                rm -f "$dest"
                ln -sfn "$src" "$dest"
                return 0
              }
              HF_AUTH=""
              if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
              if type link_from_comfy_llms >/dev/null 2>&1; then
                if link_from_comfy_llms "$SHARED_DIR/$TARGET_FILE"; then
                  if [ -s "$SHARED_DIR/$TARGET_FILE" ]; then
                    echo "[comfy-reuse] $TARGET_FILE present — stamp .ok" >&2
                    if [ -n "${REV:-}" ]; then
                      echo "$REV" > "$SHARED_DIR/$TARGET_FILE.ok"
                    else
                      touch "$SHARED_DIR/$TARGET_FILE.ok"
                    fi
                  fi
                fi
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE (~22.3 GB)"
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              EXTRA_LLM_ARGS=()
              if [ -n "${LLM_MAX_OUTPUT_TOKENS:-}" ]; then EXTRA_LLM_ARGS+=(--n-predict "$LLM_MAX_OUTPUT_TOKENS"); fi
              if [ -n "${LLM_API_KEY:-}" ]; then EXTRA_LLM_ARGS+=(--api-key "$LLM_API_KEY"); fi
              CACHE_K="${LLM_CACHE_TYPE_K:-${CACHE_TYPE_K:-q8_0}}"
              CACHE_V="${LLM_CACHE_TYPE_V:-${CACHE_TYPE_V:-turbo4}}"
              BATCH="${LLM_BATCH_SIZE:-${BATCH_SIZE:-1024}}"
              UBATCH="${LLM_UBATCH_SIZE:-${UBATCH_SIZE:-512}}"
              PAR="${LLM_PARALLEL:-${PARALLEL:-1}}"
              LOGDIR="${SHARED_DIR}/logs/llamacppagentworld35bone"
              mkdir -p "$LOGDIR"
              LOGFILE="$LOGDIR/server.$(date +%Y%m%d-%H%M%S).log"
              # Native llama.cpp web UI on :8000 (built into llama-server)
              set +e
              /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --ctx-size "${LLM_CONTEXT_WINDOW:-${CTX_SIZE:-131072}}" \
                --n-gpu-layers 99 \
                --threads "${THREADS:-16}" \
                --cache-type-k "${CACHE_K}" --cache-type-v "${CACHE_V}" \
                --batch-size "${BATCH}" --ubatch-size "${UBATCH}" \
                --parallel "${PAR}" \
                --flash-attn on \
                --op-offload --jinja --swa-full \
                "${EXTRA_LLM_ARGS[@]}" 2>&1 | tee -a "$LOGFILE"
              exit_code=${PIPESTATUS[0]}
              ln -sfn "$LOGFILE" "$LOGDIR/last-run.log"
              if [ "$exit_code" -ne 0 ]; then
                printf 'timestamp=%s exit_code=%s log=%s\n' "$(date -Iseconds)" "$exit_code" "$LOGFILE" > "$LOGDIR/last-exit.txt"
              fi
              exit "$exit_code"
          envFrom:
            - configMapRef:
                name: llamacpp-agentworld-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: {{ .Values.olaresEnv.HF_TOKEN | default "" | quote }}
            - name: MODELS_DIR
              value: "/models"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "24400m"
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            - name: LLM_CONTEXT_WINDOW
              value: {{ .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.olaresEnv.LLM_API_KEY | default "" | quote }}
            - name: LLM_BATCH_SIZE
              value: {{ .Values.olaresEnv.LLM_BATCH_SIZE | default "" | quote }}
            - name: LLM_UBATCH_SIZE
              value: {{ .Values.olaresEnv.LLM_UBATCH_SIZE | default "" | quote }}
            - name: LLM_CACHE_TYPE_K
              value: {{ .Values.olaresEnv.LLM_CACHE_TYPE_K | default "" | quote }}
            - name: LLM_CACHE_TYPE_V
              value: {{ .Values.olaresEnv.LLM_CACHE_TYPE_V | default "" | quote }}
            - name: LLM_PARALLEL
              value: {{ .Values.olaresEnv.LLM_PARALLEL | default "" | quote }}
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 240
          resources:
            limits:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: comfyui-llms
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/comfyui/model/llms"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppagentworld35bone
  name: llamacppagentworld35bone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppagentworld35bone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppagentworld35bone
  name: sharedentrances-llamacppagentworld35bone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacppagentworld35bone"
      port: 80
      targetPort: 8000
  selector:
    io.kompose.service: llamacppagentworld35bone
