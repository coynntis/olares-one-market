spec:
  versionName: 1.0.2
  featuredImage: https://cdn.olares.com/images/2026/08/d99efbb354d2f9a52f273e1a8e8c02c2.png
  upgradeDescription: |
    v1.0.2: reuse GGUFs already in Common/comfyui/model/llms (and subdirs) via symlink — official ComfyUI migrates External/ai/model/llms there; skip redownload.
    v1.0.0: ProCreations grug-27b (Qwen3.6-27B LoRA merge) — short internal think.
      Official MTP GGUF Q4_K_M (exact 16810713536) + mmproj-f16 (exact 927607872).
      buun-llama-cpp:87c351d2 · draft-mtp n=3 · turbo3/turbo3 · mmproj-gpu-swap · froggeric jinja.
      Default ctx 131072. Author notes ~89% t+2 draft agreement on MTP head.
  fullDescription: |
    grug-27b on Olares One — finetune of Qwen3.6-27B that keeps answer quality while
    collapsing verbose chain-of-thought (author sample: ~198× fewer think tokens vs base
    on one HumanEval prompt). Same dense 27B arch as base Qwen3.6-27B.

    vs Qwen3.6-27B base: not a capability upgrade — a cost/latency win for agent loops
    that burn tokens on thinking. Use when think budget hurts; keep base/Fable when you
    want longer deliberation.

    Weights: ProCreations/grug-27b-mtp-gguf → grug-27b-mtp-Q4_K_M.gguf (16.8 GB)
      Vision: ProCreations/grug-27b-gguf → mmproj-grug-27b-f16.gguf (~928 MB)
      --mmproj-gpu-swap keeps text MTP resident; vision swaps encoder in on demand.

    Runtime: docker.io/aamsellem/buun-llama-cpp:87c351d2
      --spec-type draft-mtp --spec-draft-n-max 3 (LLM_SPEC_DRAFT_N_MAX editable)
      KV turbo3/turbo3 · default ctx 131072 · --reasoning off · froggeric chat template

    First boot ~17.7 GB download. OpenAI-compatible API :8000 via client :8080.
    License: Apache-2.0.
