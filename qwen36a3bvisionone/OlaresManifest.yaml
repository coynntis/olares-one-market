spec:
  versionName: 1.0.26
  featuredImage: https://cdn.olares.com/images/2026/08/f8841da8602293d7b424ce40ac4b4d34.png
  upgradeDescription: |2
    v1.0.24: llama.cpp defaults — drop --mlock; ensure GGML_CUDA_GRAPH_OPT=1 + --op-offload.
        v1.0.20: bump spec.accelerator to cover server + client container resource sums (v3 lint).
    v1.0.19: migrate to apiVersion v3 shared chart (Olares 1.12.6+). Flatten server+client; workloadReplicas; no OLARES_USER_* in templates.
    v1.0.5: llama.cpp b8667 → b8667 (Hadamard rotation). KV cache q4_0 (with Hadamard rotation) → q4_0 (2x compression). Context 16K → 32K.
  fullDescription: |
    Qwen3.6 35B-A3B Vision (MoE, 3B active) served via llama.cpp — optimized for Olares One.
    Multimodal: accepts images via OpenAI-compatible vision API (image_url format).
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Unsloth Dynamic Q4_K_XL quantization (22.2GB) + mmproj F16 (0.9GB).
    Flash attention, CUDA graph optimization, and op-offload enabled.
    llama.cpp b8740 with multimodal projector support.
    Downloads the GGUF model (~22GB) and mmproj (~0.9GB) on first launch.
    32K context (fits model + mmproj in 24GB VRAM with q8_0 KV cache).
    Exposes an OpenAI-compatible API on port 8080.
