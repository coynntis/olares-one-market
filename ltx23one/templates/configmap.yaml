---
# Generated by scripts/inject-ltx23one-configmap.js — edit ltx23one/app/ then npm run build
apiVersion: v1
kind: ConfigMap
metadata:
  name: ltx23one-source
  namespace: "{{ .Release.Namespace }}"
data:
  app.py: |
    """LTX-2.3 distilled FP8 T2V/I2V — Gradio + FastAPI for Olares One (RTX 5090M 24GB).
    
    Uses official Lightricks LTX-2 DistilledPipeline (8-step, CFG=1), not Diffusers
    (Diffusers LTX-2.3 support is still coming soon). BF16 full checkpoint does NOT
    fit 24GB; this chart ships the distilled FP8 path + optional CPU/DISK offload.
    """
    
    from __future__ import annotations
    
    import base64
    import gc
    import logging
    import os
    import random
    import tempfile
    import threading
    import time
    from pathlib import Path
    from typing import Any, Optional
    
    import gradio as gr
    import torch
    import uvicorn
    from fastapi import FastAPI, HTTPException
    from fastapi.responses import FileResponse
    from huggingface_hub import hf_hub_download, snapshot_download
    from pydantic import BaseModel, Field
    
    os.environ.setdefault("PYTORCH_CUDA_ALLOC_CONF", "expandable_segments:True")
    
    LOG = logging.getLogger("ltx23one")
    SERVER_PORT = int(os.getenv("SERVER_PORT", "7860"))
    MODELS_ROOT = Path(os.getenv("LTX_MODELS_ROOT", "/models/ltx23"))
    LORA_DIR = Path(os.getenv("LTX_LORA_DIR", "/models/loras"))
    
    CHECKPOINT_REPO = os.getenv("LTX_CHECKPOINT_REPO", "Lightricks/LTX-2.3-fp8")
    CHECKPOINT_FILE = os.getenv(
        "LTX_CHECKPOINT_FILE", "ltx-2.3-22b-distilled-fp8.safetensors"
    )
    UPSCALER_REPO = os.getenv("LTX_UPSCALER_REPO", "Lightricks/LTX-2.3")
    UPSCALER_FILE = os.getenv(
        "LTX_UPSCALER_FILE", "ltx-2.3-spatial-upscaler-x2-1.1.safetensors"
    )
    GEMMA_REPO = os.getenv(
        "LTX_GEMMA_REPO", "google/gemma-3-12b-it-qat-q4_0-unquantized"
    )
    QUANT_KIND = os.getenv("LTX_QUANTIZATION", "fp8-cast").strip().lower()
    OFFLOAD_MODE = os.getenv("LTX_OFFLOAD_MODE", "cpu").strip().lower()
    ATTENTION_BACKEND = os.getenv("LTX_ATTENTION_BACKEND", "auto").strip().lower()
    LORA_IDS_ENV = os.getenv("LTX_LORA_IDS", "").strip()
    
    DEFAULT_HEIGHT = int(os.getenv("LTX_DEFAULT_HEIGHT", "512"))
    DEFAULT_WIDTH = int(os.getenv("LTX_DEFAULT_WIDTH", "768"))
    DEFAULT_FRAMES = int(os.getenv("LTX_DEFAULT_FRAMES", "49"))
    DEFAULT_FPS = float(os.getenv("LTX_DEFAULT_FPS", "24"))
    
    _LOCK = threading.Lock()
    _PIPELINE = None
    _ACTIVE_LORA: Optional[str] = None
    _CHECKPOINT_PATH: Optional[str] = None
    _UPSCALER_PATH: Optional[str] = None
    _GEMMA_ROOT: Optional[str] = None
    _SAGE_STATUS = "not_tried"
    _LOAD_ERROR: Optional[str] = None
    
    
    def _setup_logging() -> None:
        level = getattr(logging, os.getenv("LOG_LEVEL", "INFO").upper(), logging.INFO)
        logging.basicConfig(
            level=level,
            format="%(asctime)s %(levelname)s %(name)s: %(message)s",
        )
    
    
    def _vram_gb() -> float:
        if not torch.cuda.is_available():
            return 0.0
        return torch.cuda.get_device_properties(0).total_memory / (1024**3)
    
    
    def _log_vram(tag: str) -> None:
        if not torch.cuda.is_available():
            return
        free, total = torch.cuda.mem_get_info()
        LOG.info(
            "%s VRAM free=%.2fGiB total=%.2fGiB",
            tag,
            free / (1024**3),
            total / (1024**3),
        )
    
    
    def _align_frames(n: int) -> int:
        """num_frames must be 8k+1."""
        n = max(9, int(n))
        return ((n - 1) // 8) * 8 + 1
    
    
    def _align_res(h: int, w: int) -> tuple[int, int]:
        """Two-stage DistilledPipeline requires multiples of 64."""
        h = max(256, (int(h) // 64) * 64)
        w = max(256, (int(w) // 64) * 64)
        return h, w
    
    
    def _try_sageattention() -> str:
        """Optional SageAttention — LTX-2 has no first-class hook; try import only."""
        global _SAGE_STATUS
        backend = ATTENTION_BACKEND
        if backend in ("sdpa", "none", "0", "off"):
            _SAGE_STATUS = "skipped_sdpa"
            return _SAGE_STATUS
        try:
            import sageattention  # noqa: F401
    
            _SAGE_STATUS = "imported"
            LOG.info("sageattention import OK (backend=%s)", backend)
        except Exception as exc:  # noqa: BLE001
            _SAGE_STATUS = f"unavailable:{type(exc).__name__}:{exc}"
            LOG.warning("sageattention not available: %s", exc)
        return _SAGE_STATUS
    
    
    def _hf_token() -> Optional[str]:
        tok = (os.getenv("HF_TOKEN") or "").strip()
        return tok or None
    
    
    def _ensure_weights() -> tuple[str, str, str]:
        global _CHECKPOINT_PATH, _UPSCALER_PATH, _GEMMA_ROOT
        if _CHECKPOINT_PATH and _UPSCALER_PATH and _GEMMA_ROOT:
            return _CHECKPOINT_PATH, _UPSCALER_PATH, _GEMMA_ROOT
    
        MODELS_ROOT.mkdir(parents=True, exist_ok=True)
        LORA_DIR.mkdir(parents=True, exist_ok=True)
        token = _hf_token()
    
        LOG.info("downloading checkpoint %s/%s", CHECKPOINT_REPO, CHECKPOINT_FILE)
        ckpt = hf_hub_download(
            repo_id=CHECKPOINT_REPO,
            filename=CHECKPOINT_FILE,
            local_dir=str(MODELS_ROOT / "checkpoint"),
            token=token,
        )
        LOG.info("downloading upscaler %s/%s", UPSCALER_REPO, UPSCALER_FILE)
        ups = hf_hub_download(
            repo_id=UPSCALER_REPO,
            filename=UPSCALER_FILE,
            local_dir=str(MODELS_ROOT / "upscaler"),
            token=token,
        )
        LOG.info("downloading gemma text encoder %s", GEMMA_REPO)
        gemma = snapshot_download(
            repo_id=GEMMA_REPO,
            local_dir=str(MODELS_ROOT / "gemma"),
            token=token,
        )
        _CHECKPOINT_PATH, _UPSCALER_PATH, _GEMMA_ROOT = ckpt, ups, gemma
        return ckpt, ups, gemma
    
    
    def _parse_lora_catalog() -> dict[str, str]:
        """Map display name -> HF repo id (or local path)."""
        catalog: dict[str, str] = {"None": ""}
        if not LORA_IDS_ENV:
            return catalog
        for item in LORA_IDS_ENV.split(","):
            item = item.strip()
            if not item:
                continue
            name = item.split("/")[-1]
            catalog[name] = item
        return catalog
    
    
    def _download_lora(repo_or_path: str) -> str:
        """Download one LoRA safetensors into /models/loras (hot-swap one at a time)."""
        if not repo_or_path:
            return ""
        p = Path(repo_or_path)
        if p.is_file():
            return str(p)
    
        token = _hf_token()
        LORA_DIR.mkdir(parents=True, exist_ok=True)
        # Prefer a single *.safetensors at repo root; else first match.
        try:
            from huggingface_hub import list_repo_files
    
            files = [
                f
                for f in list_repo_files(repo_or_path, token=token)
                if f.endswith(".safetensors") and "/" not in f
            ]
            if not files:
                files = [
                    f
                    for f in list_repo_files(repo_or_path, token=token)
                    if f.endswith(".safetensors")
                ]
            if not files:
                raise FileNotFoundError(f"no .safetensors in {repo_or_path}")
            filename = files[0]
        except Exception:
            filename = "pytorch_lora_weights.safetensors"
    
        path = hf_hub_download(
            repo_id=repo_or_path,
            filename=filename,
            local_dir=str(LORA_DIR / repo_or_path.replace("/", "__")),
            token=token,
        )
        return path
    
    
    def _build_quantization(checkpoint_path: str):
        if QUANT_KIND in ("", "none", "off", "0"):
            return None
        from ltx_pipelines.utils.quantization_factory import QuantizationKind
    
        kind_map = {
            "fp8-cast": QuantizationKind.FP8_CAST,
            "fp8_cast": QuantizationKind.FP8_CAST,
            "fp8": QuantizationKind.FP8_CAST,
            "fp8-scaled-mm": QuantizationKind.FP8_SCALED_MM,
            "fp8_scaled_mm": QuantizationKind.FP8_SCALED_MM,
        }
        kind = kind_map.get(QUANT_KIND)
        if kind is None:
            LOG.warning("unknown LTX_QUANTIZATION=%s — skipping", QUANT_KIND)
            return None
        try:
            return kind.to_policy(checkpoint_path)
        except Exception as exc:  # noqa: BLE001
            LOG.warning("quantization %s failed (%s) — continuing without", QUANT_KIND, exc)
            return None
    
    
    def _offload_enum():
        from ltx_pipelines.utils.types import OffloadMode
    
        mapping = {
            "none": OffloadMode.NONE,
            "cpu": OffloadMode.CPU,
            "disk": OffloadMode.DISK,
        }
        return mapping.get(OFFLOAD_MODE, OffloadMode.CPU)
    
    
    def _lora_tuple(lora_path: str, strength: float = 1.0):
        if not lora_path:
            return []
        from ltx_core.loader import LTXV_LORA_COMFY_RENAMING_MAP, LoraPathStrengthAndSDOps
    
        return [LoraPathStrengthAndSDOps(lora_path, float(strength), LTXV_LORA_COMFY_RENAMING_MAP)]
    
    
    def _build_pipeline(lora_path: str = "", lora_strength: float = 1.0):
        global _PIPELINE, _ACTIVE_LORA, _LOAD_ERROR
        from ltx_pipelines.distilled import DistilledPipeline
    
        ckpt, ups, gemma = _ensure_weights()
        _try_sageattention()
        quant = _build_quantization(ckpt)
        offload = _offload_enum()
        loras = _lora_tuple(lora_path, lora_strength)
    
        LOG.info(
            "building DistilledPipeline ckpt=%s offload=%s quant=%s lora=%s",
            ckpt,
            offload,
            QUANT_KIND if quant else "none",
            lora_path or "None",
        )
        _log_vram("before_pipeline")
        t0 = time.perf_counter()
        try:
            pipe = DistilledPipeline(
                distilled_checkpoint_path=ckpt,
                spatial_upsampler_path=ups,
                gemma_root=gemma,
                loras=loras,
                quantization=quant,
                offload_mode=offload,
            )
        except Exception as exc:
            _LOAD_ERROR = str(exc)
            LOG.exception("DistilledPipeline init failed")
            raise
        LOG.info("pipeline ready in %.1fs", time.perf_counter() - t0)
        _log_vram("after_pipeline")
        _PIPELINE = pipe
        _ACTIVE_LORA = lora_path or None
        _LOAD_ERROR = None
        return pipe
    
    
    def _get_pipeline(lora_key: str = "None", lora_strength: float = 1.0):
        catalog = _parse_lora_catalog()
        repo = catalog.get(lora_key, "")
        if lora_key not in catalog and lora_key != "None":
            # Allow raw HF id from API
            repo = lora_key if lora_key and lora_key != "None" else ""
    
        with _LOCK:
            need_rebuild = _PIPELINE is None
            target_path = ""
            if repo:
                target_path = _download_lora(repo)
                if _ACTIVE_LORA != target_path:
                    need_rebuild = True
            elif _ACTIVE_LORA is not None:
                need_rebuild = True
                target_path = ""
    
            if need_rebuild:
                if _PIPELINE is not None:
                    del _PIPELINE
                    gc.collect()
                    if torch.cuda.is_available():
                        torch.cuda.empty_cache()
                _build_pipeline(target_path, lora_strength)
            return _PIPELINE
    
    
    def _encode_to_mp4(video_iter, audio, fps: float, num_frames: int) -> str:
        from ltx_core.model.video_vae import TilingConfig, get_video_chunks_number
        from ltx_pipelines.utils.media_io import encode_video
    
        tiling = TilingConfig.default()
        chunks = get_video_chunks_number(num_frames, tiling)
        out = tempfile.NamedTemporaryFile(suffix=".mp4", delete=False, dir="/output")
        out.close()
        encode_video(
            video=video_iter,
            fps=fps,
            audio=audio,
            output_path=out.name,
            video_chunks_number=chunks,
        )
        return out.name
    
    
    def generate_video(
        prompt: str,
        image_path: Optional[str] = None,
        height: int = DEFAULT_HEIGHT,
        width: int = DEFAULT_WIDTH,
        num_frames: int = DEFAULT_FRAMES,
        frame_rate: float = DEFAULT_FPS,
        seed: int = -1,
        randomize_seed: bool = True,
        lora_key: str = "None",
        lora_strength: float = 1.0,
        enhance_prompt: bool = False,
    ) -> tuple[str, int]:
        if not prompt or not str(prompt).strip():
            raise ValueError("prompt is required")
        if not torch.cuda.is_available():
            raise RuntimeError("CUDA GPU required for LTX-2.3")
    
        height, width = _align_res(height, width)
        num_frames = _align_frames(num_frames)
        if randomize_seed or seed < 0:
            seed = random.randint(0, 2**31 - 1)
        seed = int(seed)
    
        pipe = _get_pipeline(lora_key, lora_strength)
    
        from ltx_core.model.video_vae import TilingConfig
        from ltx_pipelines.utils.args import ImageConditioningInput
    
        images: list[Any] = []
        if image_path:
            images = [ImageConditioningInput(path=image_path, frame_idx=0, strength=1.0)]
    
        LOG.info(
            "generate prompt_len=%d %dx%d frames=%d fps=%s seed=%s i2v=%s lora=%s",
            len(prompt),
            width,
            height,
            num_frames,
            frame_rate,
            seed,
            bool(image_path),
            lora_key,
        )
        _log_vram("before_generate")
        t0 = time.perf_counter()
        with _LOCK:
            video, audio = pipe(
                prompt=prompt.strip(),
                seed=seed,
                height=height,
                width=width,
                num_frames=num_frames,
                frame_rate=float(frame_rate),
                images=images,
                tiling_config=TilingConfig.default(),
                enhance_prompt=bool(enhance_prompt),
            )
            path = _encode_to_mp4(video, audio, float(frame_rate), num_frames)
        LOG.info("generate done in %.1fs -> %s", time.perf_counter() - t0, path)
        _log_vram("after_generate")
        return path, seed
    
    
    # ----- Gradio -----
    
    
    def _gradio_t2v(
        prompt,
        height,
        width,
        num_frames,
        frame_rate,
        seed,
        randomize_seed,
        lora_key,
        lora_strength,
        enhance_prompt,
        progress=gr.Progress(track_tqdm=True),
    ):
        try:
            path, seed_out = generate_video(
                prompt=prompt,
                image_path=None,
                height=int(height),
                width=int(width),
                num_frames=int(num_frames),
                frame_rate=float(frame_rate),
                seed=int(seed),
                randomize_seed=bool(randomize_seed),
                lora_key=lora_key,
                lora_strength=float(lora_strength),
                enhance_prompt=bool(enhance_prompt),
            )
            return path, seed_out
        except Exception as exc:
            LOG.exception("t2v failed")
            raise gr.Error(str(exc)) from exc
    
    
    def _gradio_i2v(
        prompt,
        image,
        height,
        width,
        num_frames,
        frame_rate,
        seed,
        randomize_seed,
        lora_key,
        lora_strength,
        enhance_prompt,
        progress=gr.Progress(track_tqdm=True),
    ):
        try:
            if image is None:
                raise ValueError("image required for I2V")
            # Gradio may give PIL or path
            if hasattr(image, "save"):
                tmp = tempfile.NamedTemporaryFile(suffix=".png", delete=False, dir="/output")
                image.save(tmp.name)
                image_path = tmp.name
            else:
                image_path = str(image)
            path, seed_out = generate_video(
                prompt=prompt,
                image_path=image_path,
                height=int(height),
                width=int(width),
                num_frames=int(num_frames),
                frame_rate=float(frame_rate),
                seed=int(seed),
                randomize_seed=bool(randomize_seed),
                lora_key=lora_key,
                lora_strength=float(lora_strength),
                enhance_prompt=bool(enhance_prompt),
            )
            return path, seed_out
        except Exception as exc:
            LOG.exception("i2v failed")
            raise gr.Error(str(exc)) from exc
    
    
    def build_gradio() -> gr.Blocks:
        lora_choices = list(_parse_lora_catalog().keys())
        with gr.Blocks(title="LTX-2.3 One") as demo:
            gr.Markdown(
                "# LTX-2.3 One\n"
                "Lightricks **LTX-2.3** distilled FP8 T2V / I2V on Olares One "
                "(RTX 5090M 24GB).\n\n"
                f"Checkpoint: `{CHECKPOINT_REPO}/{CHECKPOINT_FILE}` via official "
                "`ltx-pipelines.DistilledPipeline` (8-step, CFG=1).\n\n"
                "**Honesty:** BF16 full (~46GB weights / ~28GB+ VRAM) does **not** fit "
                "24GB. This chart ships the **FP8 distilled** path + offload "
                f"(`LTX_OFFLOAD_MODE={OFFLOAD_MODE}`). Diffusers LTX-2.3 is still "
                "coming soon — we use the Lightricks Python package instead.\n\n"
                "LoRAs: set `LTX_LORA_IDS` (comma HF ids); downloaded on demand to "
                "`/models/loras` (one at a time).\n\n"
                "UI `/ui` · REST `POST /api/v1/t2v` `/api/v1/i2v` · `GET /health`"
            )
            with gr.Tab("Text to Video"):
                with gr.Row():
                    with gr.Column():
                        t_prompt = gr.Textbox(
                            label="Prompt",
                            value="A cinematic drone shot over coastal cliffs at golden hour, gentle waves, soft wind",
                            lines=3,
                        )
                        with gr.Row():
                            t_w = gr.Slider(256, 1280, value=DEFAULT_WIDTH, step=64, label="Width")
                            t_h = gr.Slider(256, 1280, value=DEFAULT_HEIGHT, step=64, label="Height")
                        with gr.Row():
                            t_frames = gr.Slider(9, 121, value=DEFAULT_FRAMES, step=8, label="Frames (8n+1)")
                            t_fps = gr.Slider(8, 30, value=DEFAULT_FPS, step=1, label="FPS")
                        with gr.Row():
                            t_seed = gr.Number(label="Seed", value=0, precision=0)
                            t_rand = gr.Checkbox(label="Randomize seed", value=True)
                        with gr.Row():
                            t_lora = gr.Dropdown(choices=lora_choices, value="None", label="LoRA")
                            t_lora_s = gr.Slider(0.0, 2.0, value=1.0, step=0.05, label="LoRA strength")
                        t_enhance = gr.Checkbox(label="Enhance prompt (Gemma)", value=False)
                        t_run = gr.Button("Generate T2V", variant="primary")
                    with gr.Column():
                        t_video = gr.Video(label="Output")
                        t_seed_out = gr.Number(label="Seed used", precision=0)
                t_run.click(
                    _gradio_t2v,
                    inputs=[t_prompt, t_h, t_w, t_frames, t_fps, t_seed, t_rand, t_lora, t_lora_s, t_enhance],
                    outputs=[t_video, t_seed_out],
                )
    
            with gr.Tab("Image to Video"):
                with gr.Row():
                    with gr.Column():
                        i_prompt = gr.Textbox(
                            label="Prompt",
                            value="Camera slowly pushes in, subtle natural motion, cinematic lighting",
                            lines=3,
                        )
                        i_image = gr.Image(label="First frame", type="pil")
                        with gr.Row():
                            i_w = gr.Slider(256, 1280, value=DEFAULT_WIDTH, step=64, label="Width")
                            i_h = gr.Slider(256, 1280, value=DEFAULT_HEIGHT, step=64, label="Height")
                        with gr.Row():
                            i_frames = gr.Slider(9, 121, value=DEFAULT_FRAMES, step=8, label="Frames (8n+1)")
                            i_fps = gr.Slider(8, 30, value=DEFAULT_FPS, step=1, label="FPS")
                        with gr.Row():
                            i_seed = gr.Number(label="Seed", value=0, precision=0)
                            i_rand = gr.Checkbox(label="Randomize seed", value=True)
                        with gr.Row():
                            i_lora = gr.Dropdown(choices=lora_choices, value="None", label="LoRA")
                            i_lora_s = gr.Slider(0.0, 2.0, value=1.0, step=0.05, label="LoRA strength")
                        i_enhance = gr.Checkbox(label="Enhance prompt (Gemma)", value=False)
                        i_run = gr.Button("Generate I2V", variant="primary")
                    with gr.Column():
                        i_video = gr.Video(label="Output")
                        i_seed_out = gr.Number(label="Seed used", precision=0)
                i_run.click(
                    _gradio_i2v,
                    inputs=[i_prompt, i_image, i_h, i_w, i_frames, i_fps, i_seed, i_rand, i_lora, i_lora_s, i_enhance],
                    outputs=[i_video, i_seed_out],
                )
        return demo
    
    
    # ----- FastAPI -----
    
    
    class T2VRequest(BaseModel):
        prompt: str
        height: int = Field(default=DEFAULT_HEIGHT, ge=256, le=1280)
        width: int = Field(default=DEFAULT_WIDTH, ge=256, le=1280)
        num_frames: int = Field(default=DEFAULT_FRAMES, ge=9, le=121)
        frame_rate: float = Field(default=DEFAULT_FPS, ge=8, le=30)
        seed: int = -1
        lora: str = "None"
        lora_strength: float = Field(default=1.0, ge=0.0, le=2.0)
        enhance_prompt: bool = False
        response_format: str = Field(default="b64_json", description="b64_json or path")
    
    
    class I2VRequest(BaseModel):
        prompt: str
        image_b64: str = Field(..., description="PNG/JPEG base64 (raw or data-URL)")
        height: int = Field(default=DEFAULT_HEIGHT, ge=256, le=1280)
        width: int = Field(default=DEFAULT_WIDTH, ge=256, le=1280)
        num_frames: int = Field(default=DEFAULT_FRAMES, ge=9, le=121)
        frame_rate: float = Field(default=DEFAULT_FPS, ge=8, le=30)
        seed: int = -1
        lora: str = "None"
        lora_strength: float = Field(default=1.0, ge=0.0, le=2.0)
        enhance_prompt: bool = False
        response_format: str = Field(default="b64_json")
    
    
    class VideoResponse(BaseModel):
        seed: int
        height: int
        width: int
        num_frames: int
        frame_rate: float
        prompt: str
        lora: str
        video_b64: Optional[str] = None
        path: Optional[str] = None
        mime_type: str = "video/mp4"
    
    
    def _decode_image_b64(raw: str) -> str:
        data = raw
        if "," in data and data.strip().startswith("data:"):
            data = data.split(",", 1)[1]
        blob = base64.b64decode(data)
        tmp = tempfile.NamedTemporaryFile(suffix=".png", delete=False, dir="/output")
        tmp.write(blob)
        tmp.close()
        return tmp.name
    
    
    def _video_response(path: str, seed: int, body: BaseModel, height: int, width: int, frames: int) -> VideoResponse:
        h, w = _align_res(height, width)
        nf = _align_frames(frames)
        fmt = getattr(body, "response_format", "b64_json")
        if fmt == "path":
            return VideoResponse(
                seed=seed,
                height=h,
                width=w,
                num_frames=nf,
                frame_rate=float(body.frame_rate),
                prompt=body.prompt,
                lora=body.lora,
                path=path,
            )
        with open(path, "rb") as f:
            b64 = base64.b64encode(f.read()).decode("ascii")
        return VideoResponse(
            seed=seed,
            height=h,
            width=w,
            num_frames=nf,
            frame_rate=float(body.frame_rate),
            prompt=body.prompt,
            lora=body.lora,
            video_b64=b64,
        )
    
    
    def build_api(demo: gr.Blocks) -> FastAPI:
        api = FastAPI(title="LTX-2.3 One", version="1.0.0", docs_url="/docs")
    
        @api.get("/health")
        def health():
            return {
                "status": "ok" if _LOAD_ERROR is None else "degraded",
                "pipeline_loaded": _PIPELINE is not None,
                "load_error": _LOAD_ERROR,
                "checkpoint_repo": CHECKPOINT_REPO,
                "checkpoint_file": CHECKPOINT_FILE,
                "quantization": QUANT_KIND,
                "offload_mode": OFFLOAD_MODE,
                "attention_backend": ATTENTION_BACKEND,
                "sageattention": _SAGE_STATUS,
                "cuda": torch.cuda.is_available(),
                "vram_gb": round(_vram_gb(), 2) if torch.cuda.is_available() else 0,
                "loras": [k for k in _parse_lora_catalog() if k != "None"],
                "active_lora": _ACTIVE_LORA,
                "note": "BF16 full does not fit 24GB; FP8 distilled path only",
            }
    
        @api.post("/api/v1/t2v", response_model=VideoResponse)
        def api_t2v(body: T2VRequest):
            try:
                path, seed = generate_video(
                    prompt=body.prompt,
                    image_path=None,
                    height=body.height,
                    width=body.width,
                    num_frames=body.num_frames,
                    frame_rate=body.frame_rate,
                    seed=body.seed if body.seed >= 0 else 0,
                    randomize_seed=body.seed < 0,
                    lora_key=body.lora,
                    lora_strength=body.lora_strength,
                    enhance_prompt=body.enhance_prompt,
                )
                return _video_response(path, seed, body, body.height, body.width, body.num_frames)
            except ValueError as exc:
                raise HTTPException(status_code=400, detail=str(exc)) from exc
            except Exception as exc:
                LOG.exception("api t2v failed")
                raise HTTPException(status_code=500, detail=str(exc)) from exc
    
        @api.post("/api/v1/i2v", response_model=VideoResponse)
        def api_i2v(body: I2VRequest):
            try:
                img_path = _decode_image_b64(body.image_b64)
                path, seed = generate_video(
                    prompt=body.prompt,
                    image_path=img_path,
                    height=body.height,
                    width=body.width,
                    num_frames=body.num_frames,
                    frame_rate=body.frame_rate,
                    seed=body.seed if body.seed >= 0 else 0,
                    randomize_seed=body.seed < 0,
                    lora_key=body.lora,
                    lora_strength=body.lora_strength,
                    enhance_prompt=body.enhance_prompt,
                )
                return _video_response(path, seed, body, body.height, body.width, body.num_frames)
            except ValueError as exc:
                raise HTTPException(status_code=400, detail=str(exc)) from exc
            except Exception as exc:
                LOG.exception("api i2v failed")
                raise HTTPException(status_code=500, detail=str(exc)) from exc
    
        @api.get("/api/v1/download")
        def download(path: str):
            p = Path(path)
            if not p.is_file() or not str(p).startswith("/output"):
                raise HTTPException(status_code=404, detail="not found")
            return FileResponse(str(p), media_type="video/mp4", filename=p.name)
    
        return gr.mount_gradio_app(api, demo.queue(default_concurrency_limit=1), path="/ui")
    
    
    def main() -> None:
        _setup_logging()
        Path("/output").mkdir(parents=True, exist_ok=True)
        LOG.info(
            "starting LTX-2.3 One port=%s repo=%s file=%s offload=%s quant=%s attn=%s",
            SERVER_PORT,
            CHECKPOINT_REPO,
            CHECKPOINT_FILE,
            OFFLOAD_MODE,
            QUANT_KIND,
            ATTENTION_BACKEND,
        )
        # Pre-download weights so /health reflects readiness sooner (pipeline still lazy).
        try:
            _ensure_weights()
        except Exception as exc:  # noqa: BLE001
            global _LOAD_ERROR
            _LOAD_ERROR = f"weight download failed: {exc}"
            LOG.exception("weight download failed — UI still starts; generate will error")
    
        demo = build_gradio()
        app = build_api(demo)
        uvicorn.run(
            app,
            host="0.0.0.0",
            port=SERVER_PORT,
            log_level=os.getenv("LOG_LEVEL", "info").lower(),
        )
    
    
    if __name__ == "__main__":
        main()
    
