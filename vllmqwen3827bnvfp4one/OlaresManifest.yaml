spec:
  versionName: 1.0.1
  featuredImage: https://cdn.olares.com/images/2026/08/85ff2fd732f5e2df04b1442a3821789e.png
  upgradeDescription: |
    v1.0.1: enable Qwen3.8 video path on vLLM (`video=1`, `--media-io-kwargs '{"video":{"num_frames":-1}}'`). Tighten 24GB defaults for NVFP4+vision/video: max_model_len 7168→6144, gpu_memory_utilization 0.97→0.94. Proxy now injects thinking defaults when caller omits them: `enable_thinking=true`, `preserve_thinking=true`, `reasoning_effort=medium`, video `fps=2`.
    v1.0.0: initial release. Unsloth Qwen3.8-27B-NVFP4 on vLLM 0.25.1 (CUDA 13).
      This NVFP4 quant is vLLM-only (lm_head is FP8 — SGLang cannot load it).
      Same 24GB recipe as Qwen3.6-27B NVFP4: fp8 KV, max_model_len 7168, util 0.97,
      native vision (image=1, max_pixels 200704), MTP off (weights fill 5090M).
      llama.cpp web UI entrance + OpenAI /v1 via shared entrance.

  fullDescription: |
    Unsloth Qwen3.8-27B-NVFP4 (dense VLM, ~23 GB) on Olares One RTX 5090M.

    Newest Qwen dense 27B: stronger coding/agent vs 3.6, native vision+video, 262K native context
    (chart default 6144 on 24GB — raise LLM_CONTEXT_WINDOW only if you trim multimodal load or have more VRAM).

    Stack:
    - Image: vllm/vllm-openai:v0.25.1-x86_64 (CUDA 13) + Unsloth pip deps
      (flashinfer-python, nvidia-cutlass-dsl, compressed-tensors)
    - Quant: Unsloth Dynamic V3 NVFP4 — vLLM only; SGLang cannot load FP8 lm_head
    - --kv-cache-dtype fp8 + PIECEWISE cudagraphs
    - video enabled on vLLM (`image=1`, `video=1`, default sampled video fps=2)
    - MTP off on 24GB (weights fill GPU; model card MTP is for 32GB+)
    - hermes tool parser + qwen3 reasoning parser
    - default thinking: medium effort + preserve_thinking on (request can override)
    - Developer-role / nested tool-calling improvements from Qwen3.8

    Sibling: llamacppqwen3827bmtpone is GGUF+MTP on llama.cpp (longer ctx, slower).
    This chart is the NVFP4 vLLM speed path.

    Entrance: llama.cpp web UI (tools/server/public @ b8740) with /v1 proxy to vLLM.
