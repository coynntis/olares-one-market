metadata:
  title: Bonsai 8B One
  description: "Bonsai-8B llama-server API — CUDA 13.1, PrismML source build on Olares One"

spec:
  fullDescription: |
    Bonsai-8B served via llama-server on Olares One.
    Downloads Bonsai-8B.gguf from prism-ml/Bonsai-8B-gguf on first launch.
    Compiles PrismML-Eng/llama.cpp from source in a persisted workspace (CUDA 13.1 devel), then runs llama-server on port 8000.
    OpenAI-compatible API via shared entrance and nginx client proxy on port 8080.
