metadata:
  title: Qwen36 27B BeeLlama Vision One
  description: "Qwen3.6 27B vision via BeeLlama.cpp 0.1.3-rc1 + mmproj F16 — 105 t/s @ 200K on Olares One"

spec:
  fullDescription: |
    Qwen3.6 27B vision-capable served via Anbeeld/beellama.cpp 0.1.3-rc1 fork.
    Image: aamsellem/beellama-cpp:0.1.3-rc1 (custom amd64 + CUDA 13 + sm_120 build).
    Target: unsloth/Qwen3.6-27B-GGUF UD-Q3_K_XL (14.5 GB, non-MTP variant required by DFlash).
    Vision projector: unsloth mmproj-F16.gguf (0.93 GB).
    DFlash drafter: spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q8_0 (1.85 GB).
    KV cache: turbo3 (3-bit Walsh-Hadamard rotated).
    Spec: DFlash with --spec-dflash-cross-ctx 1024, batch 2048, ubatch 2048.
    Validated 2026-05-16: 105.52 t/s AVG over 10 clean runs @ 200K. Vision smoke test PNG gradient → "Red" correct.
    Trade-off vs llamacppqwen36beellamaone (text-only): -1% throughput, -23% max ctx (200K vs 262K), +vision via image_url.
    OpenAI-compatible chat API on port 8000 via nginx client proxy on port 8080.
