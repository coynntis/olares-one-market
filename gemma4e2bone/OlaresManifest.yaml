  name: gemma4e2bone
  icon: https://cdn.olares.com/images/2026/08/2f109b0f26d221bc7b63a84d59e0dfce.png
  description: Gemma 4 E2B (ultra-fast 2.3B) via llama.cpp — voice pipeline brain for Olares One
  title: Gemma 4 E2B Voice Brain One
  version: 1.0.28
  categories:
    - AI
sharedEntrances:
  - name: gemma4e2bone
    host: sharedentrances-gemma4e2bone
    port: 0
    title: Gemma 4 E2B API
    icon: https://cdn.olares.com/images/2026/08/2f109b0f26d221bc7b63a84d59e0dfce.png
    invisible: true
    authLevel: internal
entrances:
  - name: gemma4e2bonecli
    port: 8080
