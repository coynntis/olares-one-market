{{- $llmCtx := .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" }}
{{- $llmMaxOut := .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" }}
{{- $llmApiKey := .Values.olaresEnv.LLM_API_KEY | default "" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-gemma4e2b-env
  namespace: "{{ .Release.Namespace }}"
data:
  MODEL_URL: "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q8_0.gguf"
  MODEL_FILE: "gemma-4-E2B-it-Q8_0.gguf"
  MODEL_ALIAS: "gemma-4-e2b"
  CONTEXT_SIZE: "8192"
  N_GPU_LAYERS: "99"
  THREADS: "16"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: gemma4e2bone
  name: gemma4e2bone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.gemma4e2bone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: gemma4e2bone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: gemma4e2bone
    spec:
      {{- $token := .Values.olaresEnv.GITHUB_TOKEN | trim -}}
      {{- if $token }}
      imagePullSecrets:
        - name: gemma4e2bone-ghcr
      {{- end }}
      initContainers:
        - name: fix-shared-llms-perms
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - mkdir -p /shared-models/llms && chmod -R 777 /shared-models && echo shared-llms-dir-ready
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
        - name: model-downloader
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
            - |
              SHARED_DIR="/shared-models/llms"
              MODELS_DIR="/models"
              mkdir -p "$SHARED_DIR" "$MODELS_DIR"
              find_comfy_llms() {
                local name="$1" src
                [ -n "$name" ] || return 1
                [ -d /comfyui-llms ] || return 1
                src="$(find /comfyui-llms -maxdepth 4 -type f -name "$name" 2>/dev/null | head -n 1)"
                [ -n "$src" ] && [ -f "$src" ] || return 1
                printf '%s\n' "$src"
              }
              link_from_comfy_llms() {
                local dest="$1" name src
                name="$(basename "$dest")"
                [ -n "$name" ] || return 1
                src="$(find_comfy_llms "$name")" || return 1
                if [ -f "$dest" ] && [ ! -L "$dest" ]; then
                  return 1
                fi
                echo "[comfy-reuse] $src → $dest (symlink, skip redownload)" >&2
                rm -f "$dest"
                ln -sfn "$src" "$dest"
                return 0
              }
              MODEL_PATH="$SHARED_DIR/${MODEL_FILE}"
              if type link_from_comfy_llms >/dev/null 2>&1; then
                link_from_comfy_llms "$MODEL_PATH" || true
              fi
              if [ -f "$MODELS_DIR/${MODEL_FILE}" ] && [ ! -f "$MODEL_PATH" ]; then mv "$MODELS_DIR/${MODEL_FILE}" "$MODEL_PATH"; fi
              if [ -f "$MODEL_PATH" ]; then
                echo "Model already downloaded: $MODEL_PATH"
                ls -lh "$MODEL_PATH"
              else
                echo "Downloading model from $MODEL_URL ..."
                wget -O "$MODEL_PATH.tmp" "$MODEL_URL"
                mv "$MODEL_PATH.tmp" "$MODEL_PATH"
                echo "Download complete."
                ls -lh "$MODEL_PATH"
              fi
          envFrom:
            - configMapRef:
                name: llamacpp-gemma4e2b-env
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
      containers:
        - name: llamacpp-server
          image: "ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740"
          command: ["/app/llama-server"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--model"
            - "/shared-models/llms/$(MODEL_FILE)"
            - "--alias"
            - "$(MODEL_ALIAS)"
            - "--ctx-size"
{{- if $llmCtx }}
            - {{ $llmCtx | quote }}
{{- else }}
            - "$(CONTEXT_SIZE)"
{{- end }}
            - "--n-gpu-layers"
            - "$(N_GPU_LAYERS)"
            - "--threads"
            - "$(THREADS)"
            - "--cache-type-k"
            - "q4_0"
            - "--cache-type-v"
            - "q4_0"
            - "--batch-size"
            - "512"
            - "--ubatch-size"
            - "512"
            - "--parallel"
            - "1"
            - "--flash-attn"
            - "auto"
            - "--op-offload"
            - "--jinja"
            - "--slot-save-path"
            - "/cache"
            - "--no-context-shift"
{{- if $llmMaxOut }}
            - "--n-predict"
            - {{ $llmMaxOut | quote }}
{{- end }}
{{- if $llmApiKey }}
            - "--api-key"
            - {{ $llmApiKey | quote }}
{{- end }}
          env:
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            - name: LLM_CONTEXT_WINDOW
              value: {{ .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.olaresEnv.LLM_API_KEY | default "" | quote }}
          envFrom:
            - configMapRef:
                name: llamacpp-gemma4e2b-env
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 240
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
            - mountPath: "/cache"
              name: cache
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: comfyui-llms
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/comfyui/model/llms"
            type: DirectoryOrCreate
        - name: cache
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: gemma4e2bone
  name: gemma4e2bone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: gemma4e2bone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: gemma4e2bone
  name: sharedentrances-gemma4e2bone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "gemma4e2bone"
      port: 80
      targetPort: 8080
  selector:
    io.kompose.service: gemma4e2bone
