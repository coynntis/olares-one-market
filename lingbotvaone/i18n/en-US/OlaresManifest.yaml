---
olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  lingbotvaone: 1
  lingbotvaonecli: 1
metadata:
  name: lingbotvaone
  icon: https://cdn.olares.com/images/2026/07/31a0f93fd0eccae820c1eb1d135f1903.png
  description: Video-Action world model (UMT5+VAE CPU offload)
  title: LingBot VA One
  version: 1.0.8
  categories:
    - AI
sharedEntrances:
  - name: lingbotvaone
    host: sharedentrances-lingbotvaone
    port: 0
    title: LingBot VA One API
    icon: https://cdn.olares.com/images/2026/07/31a0f93fd0eccae820c1eb1d135f1903.png
    invisible: true
    authLevel: internal
entrances:
  - name: lingbotvaonecli
    port: 8080
    host: lingbotvaonecli
    title: LingBot VA One
    icon: https://cdn.olares.com/images/2026/07/31a0f93fd0eccae820c1eb1d135f1903.png
    openMethod: window
    authLevel: internal
spec:
  versionName: 1.0.8
  featuredImage: https://cdn.olares.com/images/2026/07/48ff1c9b3a60c86b8654531d3fc137be.png
  fullDescription: |
    LingBot-VA causal video-action model with layer/CPU offload for 24GB.

    Hardware: Olares One — RTX 5090M 24GB + 96GB DDR5.

    Runtime image: pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (required for sm_120).

    Weights: robbyant/lingbot-va-base
    Source: https://github.com/Robbyant/lingbot-va
    Project: https://technology.robbyant.com/lingbot-va

    Boot lessons (Krea soft-ready):
    - soft-ready HTTP on :7860 before uv/pip/HF download (pass ~30m install gate)
    - uv pip --target /workspace/lingbotvaone/site-packages (persist uv + cache)
    - purge torch shadow from site-packages (image owns torch)
    - bootstrap attempts + download progress → /workspace/lingbotvaone/bootstrap.log
    - GET /health shows phase / attempts_tail while installing

    UI: / and /ui · REST under /api/v1 · health: GET /health
  developer: Robbyant
  website: https://technology.robbyant.com/lingbot-va
  sourceCode: https://github.com/Robbyant/lingbot-va
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/Robbyant/lingbot-va
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '17'
      requiredMemory: 4Gi
      limitedMemory: 65Gi
      requiredDisk: 50Gi
      limitedDisk: 120Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
  upgradeDescription: |
    - **1.0.8**: Fix Gradio file URLs — import mount_gradio; redirect /gradio_api/* to /ui/gradio_api/* (query preserved).
    v1.0.7: base image pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (sm_120 / RTX 5090M); was 2.6+cu12.4 with no Blackwell kernels.
    v1.0.4: vision loader API fix (repo_id_or_path dir).
    v1.0.3: audit upstream inference deps; deps marker v3.
    v1.0.2: omegaconf + reinstall after --no-deps.
    v1.0.1: Helm-safe soft_ready / ConfigMap brace escape.
    v1.0.0: initial chart — soft-ready + uv site-packages + Gradio/REST.

permission:
  appData: true
envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_REPO_ID
    required: false
    editable: true
    applyOnChange: true
    value: 'robbyant/lingbot-va-base'
  - envName: UV_INDEX_URL
    required: false
    editable: true
    applyOnChange: true
    value: ''
  - envName: LINGBOT_VA_OFFLOAD
    required: false
    editable: true
    applyOnChange: true
    value: '1'
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
