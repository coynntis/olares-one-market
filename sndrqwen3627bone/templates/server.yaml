              name: shared-models
            - mountPath: "/app-src"
              name: soft-ready-src
      volumes:
        - name: shared-models
          hostPath:
            path: "{{ .Values.userspace.appData }}/shared-llms"
            type: DirectoryOrCreate
        - name: soft-ready-src
          configMap:
            name: sndr-sndrqwen3627bone-soft-ready
            defaultMode: 0555
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sndrqwen3627bone
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: sndrqwen3627bone
spec:
  ports:
    - name: "vllm"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: sndrqwen3627bone
