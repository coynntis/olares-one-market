    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: GITHUB_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_GITHUB_TOKEN
  - envName: GHCR_USER
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_GITHUB_USERNAME
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
