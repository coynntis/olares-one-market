spec:
  versionName: 1.0.0
  featuredImage: https://cdn.olares.com/images/2026/08/6229687099c23fd6554d79746933b488.png
  upgradeDescription: |
    v1.0.0: Fun-CosyVoice3-0.5B via ghcr.io/hsiang-han/cosyvoice3-api — OpenAI /v1/audio/speech,
    zero-shot clone, 9 languages + 18 Chinese dialects (Cantonese). CUDA 12.8 / RTX 5090M.
  fullDescription: |
    Fun-CosyVoice3-0.5B (FunAudioLLM) — multilingual zero-shot TTS with 18 Chinese dialects
    including Cantonese (粤语). Optimized for Olares One (RTX 5090M 24GB).

    ===== HOW TO USE =====

    In-cluster: http://cosyvoice3one:8000
    Shared entrance: http://<route-id>.shared.olares.com
    App entrance (proxy): port 8080

    --- OpenAI-compatible speech ---

    curl -X POST http://cosyvoice3one:8000/v1/audio/speech \
      -H "Content-Type: application/json" \
      -d '{"input":"你好，欢迎使用 CosyVoice3。","voice":"<registered-voice>","response_format":"wav"}' \
      -o out.wav

    Model has NO built-in preset voices. Register a 3s+ reference clip first, or use clone:

    curl -X POST http://cosyvoice3one:8000/v1/audio/speech/clone \
      -F "text=你好啊，食咗饭未啊？" \
      -F "voice=@./cantonese_ref.wav" \
      -o yue.wav

    --- Cantonese ---

    Pass Cantonese text with a Cantonese reference voice for best results.
    Instruct/dialect modes follow CosyVoice3 docs (18 Chinese dialects).

    First boot downloads ~10GB model to shared HF cache
    /olares/share/ai/model/speech/huggingface (reused by other speech apps).
    Image: ghcr.io/hsiang-han/cosyvoice3-api (CUDA 12.8, Blackwell OK).
    Set HF_ENDPOINT=https://hf-mirror.com in China if needed.
  developer: FunAudioLLM / hsiang-han
  website: https://funaudiollm.github.io/cosyvoice3/
  sourceCode: https://github.com/FunAudioLLM/CosyVoice
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '9'
      requiredMemory: 3Gi
      limitedMemory: 17Gi
      requiredDisk: 15Gi
      limitedDisk: 40Gi
      requiredGPUMemory: 4Gi
      limitedGPUMemory: 24Gi
permission:
