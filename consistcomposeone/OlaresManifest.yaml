  consistcomposeone: 1
  consistcomposeonecli: 1
metadata:
  name: consistcomposeone
  icon: https://cdn.olares.com/images/2026/08/cedce30bf28627551b5d5548a3cb828e.png
  description: ConsistCompose BAGEL-7B-MoT layout compose — NF4 for 24GB
  title: ConsistCompose One
  version: 1.0.1
  categories:
    - AI
sharedEntrances:
  - name: consistcomposeone
    host: sharedentrances-consistcomposeone
    port: 0
    title: ConsistCompose Compose API
    icon: https://cdn.olares.com/images/2026/08/cedce30bf28627551b5d5548a3cb828e.png
    invisible: true
    authLevel: internal
entrances:
