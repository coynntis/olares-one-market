spec:
  versionName: 1.0.11
  featuredImage: https://cdn.olares.com/images/2026/08/0edfdbe1c5fbc05e7976e622bf2d2407.png
  upgradeDescription: |2
    v1.0.9: llama.cpp defaults — drop --mlock; ensure GGML_CUDA_GRAPH_OPT=1 + --op-offload.
        v1.0.3: bump spec.accelerator to cover server + client container resource sums (v3 lint).
    v1.0.2: migrate to apiVersion v3 shared chart (Olares 1.12.6+). Flatten server+client; workloadReplicas; no OLARES_USER_* in templates.
    v1.0.1: turbo3/turbo3 KV cache (TurboQuant via buun) — same 128K default ctx, less VRAM than q4_0 KV.
  fullDescription: |
    Ornith 1.0 9B compact dense model served via llama.cpp on Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.

    Model: deepreinforce-ai/Ornith-1.0-9B-GGUF → ornith-1.0-9b-Q4_K_M.gguf (~5.6 GB).
    Image: docker.io/aamsellem/buun-llama-cpp:87c351d2.
    Default context 128K (131072 tokens). turbo3/turbo3 KV cache (TurboQuant via buun), batch/ubatch 512.
    Downloads model on first launch and caches under /olares/share/ai/model.
    OpenAI-compatible API on port 8080 via client proxy.
    Optional LLM_CONTEXT_WINDOW, LLM_MAX_OUTPUT_TOKENS, LLM_API_KEY in app settings.
  developer: coynntis
  website: https://github.com/coynntis/olares-one-market
