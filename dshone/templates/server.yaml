---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dshone-inner-nginx
  namespace: "{{ .Release.Namespace }}"
data:
  nginx.conf: |
    server {
      listen 0.0.0.0:8080 default_server;
      server_name _;
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log  /opt/bitnami/openresty/nginx/logs/error.log;

      proxy_connect_timeout                          600s;
      proxy_send_timeout                             600s;
      proxy_read_timeout                             1800s;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_http_version 1.1;
      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";
      # dsh PRIVILEGED_METHODS (settings.*, credentials.*, …) require loopback
      # Host. Origin must equal Host (incl. port) or be absent. Olares Authelia
      # already auths the entrance (deepseek-ai/deepseek-harness#1054).
      proxy_set_header host 127.0.0.1:3080;
      proxy_set_header origin http://127.0.0.1:3080;
      proxy_set_header sec-fetch-site "";
      proxy_set_header x-forwarded-host $http_host;
      proxy_set_header x-forwarded-proto https;
      proxy_set_header x-real-ip $remote_addr;

      location / {
        add_header X-Frame-Options "";
        proxy_pass http://127.0.0.1:3080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: dshone
  name: dshone
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloads.dshone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: dshone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network.chrome-default: "true"
        io.kompose.service: dshone
    spec:
      {{- $token := .Values.olaresEnv.GITHUB_TOKEN | trim -}}
      {{- $repo := .Values.image.repository | default "" -}}
      {{- if and $token (hasPrefix "ghcr.io/" $repo) }}
      imagePullSecrets:
        - name: dshone-ghcr
      {{- end }}
      initContainers:
        - name: fix-appdata-perms
          image: docker.io/beclab/aboveos-busybox:1.37.0
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              # Persist dsh-home across pod restarts with correct ownership + perms.
              # dsh-credentials-local rejects world-readable ~/.credentials.yaml.
              mkdir -p /data /cache /data/dsh-home /data/workspace /cache/npm
              chown -R 1000:1000 /data /cache
              chmod 700 /data/dsh-home || true
              chmod 600 /data/dsh-home/.credentials.yaml || true
              chmod -R 700 /data/dsh-home/profiles || true
              chmod -R 700 /data/workspace || true
              chmod -R 777 /cache/npm || true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /cache
              name: cache
      containers:
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              export HOME=/data
              export DSH_HOME=/data/dsh-home
              export npm_config_cache=/cache/npm
              export NPM_CONFIG_CACHE=/cache/npm
              mkdir -p "$DSH_HOME" /data/workspace /cache/npm
              cd /data/workspace
              VER="${DSH_VERSION:-0.1.0-rc.7}"
              echo "starting @deepseek-ai/dsh@${VER}"

              run_dsh() {
                npx -y "@deepseek-ai/dsh@${VER}" web --port 3080
              }

              # If persistent profile includes stale/unavailable UI plugin packages,
              # dsh boot hard-fails. Reset profiles/web once; keep credentials.yaml.
              if ! run_dsh; then
                echo "dsh boot failed; resetting $DSH_HOME/profiles/web once"
                rm -rf "$DSH_HOME/profiles/web" || true
                mkdir -p "$DSH_HOME/profiles/web" || true
                chmod -R 700 "$DSH_HOME/profiles" || true
                run_dsh
              fi
          ports:
            - name: dsh
              containerPort: 3080
          env:
            - name: DSH_VERSION
              value: {{ .Values.olaresEnv.DSH_VERSION | default "0.1.0-rc.7" | quote }}
            - name: DEEPSEEK_API_KEY
              value: {{ .Values.olaresEnv.DEEPSEEK_API_KEY | default "" | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.olaresEnv.OPENAI_API_KEY | default "" | quote }}
            - name: ANTHROPIC_API_KEY
              value: {{ .Values.olaresEnv.ANTHROPIC_API_KEY | default "" | quote }}
            - name: CUSTOM_OPENAI_BASE_URL
              value: {{ .Values.olaresEnv.CUSTOM_OPENAI_BASE_URL | default "" | quote }}
            - name: CUSTOM_OPENAI_API_KEY
              value: {{ .Values.olaresEnv.CUSTOM_OPENAI_API_KEY | default "" | quote }}
            - name: HOME
              value: /data
            - name: DSH_HOME
              value: /data/dsh-home
          # dsh binds 127.0.0.1 only — kubelet tcp/http probes hit pod IP and never succeed
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const n=require('net');const s=n.connect(3080,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const n=require('net');const s=n.connect(3080,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 8Gi
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /cache
              name: cache
        - name: nginx-local
          image: docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: inner-nginx
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}/dshone"
            type: DirectoryOrCreate
        - name: cache
          hostPath:
            path: "{{ .Values.userspace.appCache }}/dshone"
            type: DirectoryOrCreate
        - name: inner-nginx
          configMap:
            name: dshone-inner-nginx
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: dshone
  name: dshone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: dshone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: dshone
  name: sharedentrances-dshone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: dshone
      port: 80
      targetPort: 8080
  selector:
    io.kompose.service: dshone
