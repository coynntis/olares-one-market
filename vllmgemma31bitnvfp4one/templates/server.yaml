{{- $llmCtx := .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" }}
{{- $llmMaxOut := .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" }}
{{- $llmApiKey := .Values.olaresEnv.LLM_API_KEY | default "" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-gemma31b-nvfp4-env
  namespace: "{{ .Release.Namespace }}"
data:
  MAX_MODEL_LEN: "16384"
  GPU_MEMORY_UTILIZATION: "0.95"
  MAX_NUM_SEQS: "128"
  MAX_NUM_BATCHED_TOKENS: "8192"
  KV_CACHE_DTYPE: "fp8"
  MODEL_NAME: "LilaRest/gemma-4-31B-it-NVFP4-turbo"
  MODEL_ALIAS: "gemma-4-31b-it-nvfp4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: vllmgemma31bitnvfp4one
  name: vllmgemma31bitnvfp4one
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.vllmgemma31bitnvfp4one.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: vllmgemma31bitnvfp4one
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: vllmgemma31bitnvfp4one
    spec:
      initContainers:
        - name: fix-shared-llms-perms
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - mkdir -p /shared-models/llms/huggingface && chmod -R 777 /shared-models && echo shared-llms-dir-ready
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: "/shared-models"
              name: shared-models
      containers:
        - name: vllm-server
          image: "vllm/vllm-openai:cu130-nightly"
          command:
            - "sh"
            - "-c"
            - |
              set -x
              pip install --upgrade \
                "transformers>=5.5.0" \
                "hf_transfer" && \
              exec vllm serve "$@"
            - "--"
          args:
            - "$(MODEL_NAME)"
            - "--quantization"
            - "modelopt"
            - "--served-model-name"
            - "$(MODEL_ALIAS)"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
{{- if $llmCtx }}
            - {{ $llmCtx | quote }}
{{- else }}
            - "$(MAX_MODEL_LEN)"
{{- end }}
            - "--gpu-memory-utilization"
            - "$(GPU_MEMORY_UTILIZATION)"
            - "--max-num-seqs"
            - "$(MAX_NUM_SEQS)"
            - "--max-num-batched-tokens"
            - "$(MAX_NUM_BATCHED_TOKENS)"
            - "--kv-cache-dtype"
            - "$(KV_CACHE_DTYPE)"
            - "--trust-remote-code"
            - "--download-dir"
            - "/shared-models/llms/huggingface"
            - "--enable-prefix-caching"
{{- if $llmApiKey }}
            - "--api-key"
            - {{ $llmApiKey | quote }}
{{- end }}
{{- if $llmMaxOut }}
            - "--override-generation-config"
            - {{ printf "{\"max_tokens\":%s}" $llmMaxOut | quote }}
{{- end }}
          envFrom:
            - configMapRef:
                name: vllm-gemma31b-nvfp4-env
          env:
            - name: HF_HOME
              value: "/shared-models/llms/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.HF_TOKEN }}"
            - name: HF_ENDPOINT
              value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_HUB_VERBOSITY
              value: "debug"
            - name: VLLM_LOGGING_LEVEL
              value: "DEBUG"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: LLM_CONTEXT_WINDOW
              value: {{ .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.olaresEnv.LLM_API_KEY | default "" | quote }}
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 600
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: vllmgemma31bitnvfp4one
  name: vllmgemma31bitnvfp4one
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "vllm"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: vllmgemma31bitnvfp4one
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: vllmgemma31bitnvfp4one
  name: sharedentrances-vllmgemma31bitnvfp4one
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "vllmgemma31bitnvfp4one"
      port: 80
      targetPort: 8000
  selector:
    io.kompose.service: vllmgemma31bitnvfp4one
