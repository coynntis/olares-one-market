spec:
  versionName: 1.0.22
  featuredImage: https://cdn.olares.com/images/2026/08/db85090bb50f98b5fca01e7c2a3ca5ee.png
  fullDescription: |
    LilaRest Gemma 4 31B IT NVFP4 Turbo checkpoint served via vLLM on Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    Text-only generation — no vision or audio input.
    Startup command: vllm serve LilaRest/gemma-4-31B-it-NVFP4-turbo --quantization modelopt --max-model-len 16384
    16K default context window. Apache 2.0 license.
    Model files are downloaded from Hugging Face into /models at startup.
    Exposes an OpenAI-compatible API on port 8000.
  developer: coynntis
  website: https://github.com/coynntis/olares-one-market
  sourceCode: https://github.com/coynntis/olares-one-market
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '9'
      requiredMemory: 3Gi
      limitedMemory: 25Gi
      requiredDisk: 35Gi
      limitedDisk: 50Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
  upgradeDescription: |2
        v1.0.20: bump spec.accelerator to cover server + client container resource sums (v3 lint).
    v1.0.19: migrate to apiVersion v3 shared chart (Olares 1.12.6+). Flatten server+client; workloadReplicas; no OLARES_USER_* in templates.
permission:
  appData: true
envs:
  - envName: LLM_CONTEXT_WINDOW
    required: false
    editable: true
    applyOnChange: true
  - envName: LLM_MAX_OUTPUT_TOKENS
    required: false
    editable: true
    applyOnChange: true
  - envName: LLM_API_KEY
    required: false
    editable: true
    applyOnChange: true
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
