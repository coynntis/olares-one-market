---
# Generated by scripts/inject-motifvideo-configmap.js — edit motifvideo2bone/app/ then npm run build
apiVersion: v1
kind: ConfigMap
metadata:
  name: motifvideo2bone-source
  namespace: "{{ .Release.Namespace }}"
data:
  app.py: |
    """Motif Video 2B — GGUF + Gradio/FastAPI for Olares One (24GB)."""
    
    from __future__ import annotations
    
    import asyncio
    import logging
    import os
    import tempfile
    import threading
    import time
    from contextlib import asynccontextmanager
    from io import BytesIO
    from typing import Any, Dict, List, Optional, Tuple
    
    import torch
    from fastapi import FastAPI, File, Form, HTTPException, UploadFile
    from fastapi.middleware.cors import CORSMiddleware
    from fastapi.responses import FileResponse, RedirectResponse
    from huggingface_hub import hf_hub_download
    from PIL import Image
    from pydantic import BaseModel, Field
    
    os.environ.setdefault("PYTORCH_CUDA_ALLOC_CONF", "expandable_segments:True")
    
    MODEL_ID = "Motif-Technologies/Motif-Video-2B"
    GGUF_REPO = "Motif-Technologies/Motif-Video-2B-GGUF"
    GGUF_VARIANTS: List[str] = [
        "Q4_0",
        "Q4_1",
        "Q4_K_M",
        "Q5_0",
        "Q5_1",
        "Q5_K_M",
        "Q6_K",
        "Q8_0",
        "BF16",
    ]
    DEFAULT_GGUF_VARIANT = os.getenv("MOTIF_GGUF_VARIANT", "Q5_K_M").strip() or "Q5_K_M"
    DEFAULT_NEGATIVE_PROMPT = (
        "text overlay, graphic overlay, watermark, logo, subtitles, timestamp, "
        "broadcast graphics, UI elements, random letters, frozen pose, rigid, static expression, "
        "jerky motion, mechanical motion, discontinuous motion, flat framing, depthless, dull lighting, "
        "monotone, crushed shadows, blown-out highlights, shifting background, fading background, "
        "poor continuity, identity drift, deformation, flickering, ghosting, smearing, duplication, "
        "mutated proportions, inconsistent clothing, flat colors, desaturated, tonally compressed, "
        "poor background separation, exposure shift, uneven brightness, color balance shift"
    )
    
    _GRADIO_MOUNT_PATH = "/ui"
    _GRADIO_ROOT_PATH = (os.getenv("GRADIO_ROOT_PATH") or "").strip() or _GRADIO_MOUNT_PATH
    
    _LOG = logging.getLogger("motifvideo2bone")
    _GEN_LOCK = threading.Lock()
    
    _T2V_PIPE = None
    _I2V_PIPE = None
    _PIPE_KEY: Optional[Tuple[str, bool, str]] = None
    _ATTENTION_BACKEND_ACTIVE = "native"
    
    
    def _env_truthy(name: str, default: str = "0") -> bool:
        return os.getenv(name, default).strip().lower() in {"1", "true", "yes", "on"}
    
    
    def _setup_logging() -> None:
        if getattr(_setup_logging, "_done", False):
            return
        level_name = os.getenv("MOTIF_LOG_LEVEL", "INFO").upper()
        level = getattr(logging, level_name, logging.INFO)
        logging.basicConfig(
            level=level,
            format="%(asctime)s %(levelname)s %(name)s: %(message)s",
        )
        logging.getLogger("urllib3").setLevel(logging.WARNING)
        logging.getLogger("httpx").setLevel(logging.INFO)
    
        if _env_truthy("MOTIF_HF_DEBUG", "0"):
            os.environ.setdefault("HF_HUB_VERBOSITY", "debug")
            os.environ.setdefault("TRANSFORMERS_VERBOSITY", "debug")
            os.environ.setdefault("DIFFUSERS_VERBOSITY", "debug")
            try:
                import huggingface_hub
    
                huggingface_hub.utils.logging.set_verbosity_debug()
            except Exception:
                _LOG.exception("huggingface_hub debug verbosity failed")
            try:
                import transformers
    
                transformers.logging.set_verbosity_debug()
            except Exception:
                _LOG.exception("transformers debug verbosity failed")
            try:
                import diffusers
    
                diffusers.utils.logging.set_verbosity_debug()
            except Exception:
                _LOG.exception("diffusers debug verbosity failed")
    
        _setup_logging._done = True  # type: ignore[attr-defined]
    
    
    def _log_cuda_mem(prefix: str) -> None:
        if not torch.cuda.is_available():
            return
        torch.cuda.synchronize()
        alloc = torch.cuda.memory_allocated() / (1024**3)
        reserved = torch.cuda.memory_reserved() / (1024**3)
        _LOG.info("%s cuda_mem allocated=%.3fGiB reserved=%.3fGiB", prefix, alloc, reserved)
    
    
    def _make_step_logger(total_steps: int):
        last_t = time.perf_counter()
    
        def _cb(pipe, step: int, timestep, callback_kwargs: Dict[str, Any]):
            nonlocal last_t
            now = time.perf_counter()
            dt = now - last_t
            last_t = now
            _LOG.info(
                "diffusion step %s/%s timestep=%s dt=%.3fs",
                step + 1,
                total_steps,
                timestep,
                dt,
            )
            return callback_kwargs
    
        return _cb
    
    
    _setup_logging()
    
    
    def _gpu_memory_gb() -> float:
        if not torch.cuda.is_available():
            return 0.0
        return torch.cuda.get_device_properties(0).total_memory / (1024**3)
    
    
    def _default_cpu_offload() -> bool:
        force = os.getenv("MOTIF_FORCE_CPU_OFFLOAD", "").strip().lower()
        if force in {"1", "true", "yes", "on"}:
            return True
        if force in {"0", "false", "no", "off"}:
            return False
        detected = _gpu_memory_gb()
        return detected <= 24.5 if detected > 0 else True
    
    
    def _normalize_variant(variant: Optional[str]) -> str:
        v = (variant or DEFAULT_GGUF_VARIANT).strip()
        if v not in GGUF_VARIANTS:
            raise ValueError(f"Unknown GGUF variant {v!r}; choose from {GGUF_VARIANTS}")
        return v
    
    
    def _make_guider(
        guidance_scale: float = 8.0,
        apg_rescale: float = 12.0,
        apg_momentum: float = 0.1,
    ):
        from diffusers import AdaptiveProjectedGuidance
    
        kwargs: Dict[str, Any] = dict(
            guidance_scale=guidance_scale,
            adaptive_projected_guidance_rescale=apg_rescale,
            adaptive_projected_guidance_momentum=apg_momentum,
            use_original_formulation=True,
        )
        try:
            return AdaptiveProjectedGuidance(**kwargs, normalization_dims="spatial")
        except TypeError:
            try:
                return AdaptiveProjectedGuidance(
                    **kwargs, adaptive_projected_guidance_norm_dim=[-1, -2, -4]
                )
            except TypeError:
                return AdaptiveProjectedGuidance(**kwargs)
    
    
    def _configure_scheduler(pipe) -> None:
        """Prefer Motif FlowDPMSolver when present; else DPMSolver++ from config."""
        try:
            from diffusers import FlowDPMSolver  # type: ignore
    
            pipe.scheduler = FlowDPMSolver(
                num_train_timesteps=pipe.scheduler.config.get("num_train_timesteps", 1000),
                algorithm_type="dpmsolver++",
                solver_order=2,
                prediction_type="flow_prediction",
                use_flow_sigmas=True,
                flow_shift=15.0,
            )
            _LOG.info("scheduler=FlowDPMSolver")
            return
        except Exception as exc:
            _LOG.info("FlowDPMSolver unavailable (%s); trying DPMSolverMultistepScheduler", exc)
    
        try:
            from diffusers import DPMSolverMultistepScheduler
    
            pipe.scheduler = DPMSolverMultistepScheduler.from_config(
                pipe.scheduler.config,
                algorithm_type="dpmsolver++",
                solver_order=2,
            )
            _LOG.info("scheduler=DPMSolverMultistepScheduler")
        except Exception as exc:
            _LOG.warning("left default scheduler (%s)", exc)
    
    
    def _apply_attention_backend(pipe, preference: str) -> str:
        pref = (preference or os.getenv("MOTIF_ATTENTION_BACKEND", "auto")).strip().lower()
        if pref in {"sdpa", "native"}:
            candidates = ["native"]
        elif pref == "sage":
            candidates = ["sage", "sage_hub", "_sage_qk_int8_pv_fp16_cuda", "native"]
        else:
            candidates = ["sage", "sage_hub", "_sage_qk_int8_pv_fp16_cuda", "native"]
    
        transformer = getattr(pipe, "transformer", None)
        if transformer is None or not hasattr(transformer, "set_attention_backend"):
            _LOG.warning("transformer has no set_attention_backend; using default SDPA")
            return "native"
    
        for backend in candidates:
            if backend.startswith("sage") and not backend.endswith("_hub"):
                try:
                    import sageattention  # noqa: F401
                except ImportError:
                    _LOG.info("sageattention not installed; skip backend=%s", backend)
                    continue
            try:
                transformer.set_attention_backend(backend)
                _LOG.info("attention backend=%s", backend)
                return backend
            except Exception as exc:
                _LOG.warning("attention backend %s failed: %s", backend, exc)
        return "native"
    
    
    def _load_gguf_transformer(variant: str):
        from diffusers import GGUFQuantizationConfig, MotifVideoTransformer3DModel
    
        filename = f"motifv-2b-dev-{variant}.gguf"
        _LOG.info("downloading GGUF %s/%s", GGUF_REPO, filename)
        t0 = time.perf_counter()
        ckpt_path = hf_hub_download(GGUF_REPO, filename=filename)
        _LOG.info("hf_hub_download done in %.1fs path=%s", time.perf_counter() - t0, ckpt_path)
    
        load_kwargs: Dict[str, Any] = dict(
            quantization_config=GGUFQuantizationConfig(compute_dtype=torch.bfloat16),
            config=MODEL_ID,
            subfolder="transformer",
            torch_dtype=torch.bfloat16,
        )
        revision = (os.getenv("MOTIF_REVISION") or "").strip()
        if revision:
            load_kwargs["revision"] = revision
    
        t1 = time.perf_counter()
        transformer = MotifVideoTransformer3DModel.from_single_file(ckpt_path, **load_kwargs)
        _LOG.info("from_single_file done in %.1fs", time.perf_counter() - t1)
        return transformer
    
    
    def _build_pipelines(
        variant: str, use_cpu_offload: bool, attention_pref: str
    ) -> Tuple[Any, Any, str]:
        from diffusers import MotifVideoImage2VideoPipeline, MotifVideoPipeline
    
        if not torch.cuda.is_available():
            raise RuntimeError("CUDA GPU required for Motif Video 2B")
    
        t0 = time.perf_counter()
        _LOG.info(
            "building pipelines variant=%s offload=%s attn=%s hf_home=%s",
            variant,
            use_cpu_offload,
            attention_pref,
            os.getenv("HF_HOME", ""),
        )
    
        guider = _make_guider()
        transformer = _load_gguf_transformer(variant)
    
        pretrained_kwargs: Dict[str, Any] = dict(
            torch_dtype=torch.bfloat16,
            guider=guider,
            transformer=transformer,
        )
        revision = (os.getenv("MOTIF_REVISION") or "").strip()
        if revision:
            pretrained_kwargs["revision"] = revision
    
        i2v = MotifVideoImage2VideoPipeline.from_pretrained(MODEL_ID, **pretrained_kwargs)
        _configure_scheduler(i2v)
    
        t2v = MotifVideoPipeline(
            transformer=i2v.transformer,
            vae=i2v.vae,
            text_encoder=i2v.text_encoder,
            tokenizer=i2v.tokenizer,
            scheduler=i2v.scheduler,
            guider=i2v.guider,
        )
    
        attn = _apply_attention_backend(i2v, attention_pref)
    
        if use_cpu_offload:
            _LOG.info("enable_model_cpu_offload()")
            i2v.enable_model_cpu_offload()
        else:
            _LOG.info("pipe.to(cuda)")
            i2v.to("cuda")
    
        _LOG.info("pipelines ready in %.1fs attn=%s", time.perf_counter() - t0, attn)
        _log_cuda_mem("after_pipeline_build")
        return t2v, i2v, attn
    
    
    def _get_pipelines(
        variant: str,
        use_cpu_offload: bool,
        attention_pref: str,
    ) -> Tuple[Any, Any]:
        global _T2V_PIPE, _I2V_PIPE, _PIPE_KEY, _ATTENTION_BACKEND_ACTIVE
        variant = _normalize_variant(variant)
        key = (variant, bool(use_cpu_offload), (attention_pref or "auto").strip().lower())
        if _T2V_PIPE is None or _I2V_PIPE is None or _PIPE_KEY != key:
            if _I2V_PIPE is not None:
                try:
                    del _T2V_PIPE, _I2V_PIPE
                except Exception:
                    pass
                _T2V_PIPE = None
                _I2V_PIPE = None
                if torch.cuda.is_available():
                    torch.cuda.empty_cache()
            _T2V_PIPE, _I2V_PIPE, _ATTENTION_BACKEND_ACTIVE = _build_pipelines(
                variant, use_cpu_offload, attention_pref
            )
            _PIPE_KEY = key
        return _T2V_PIPE, _I2V_PIPE
    
    
    def _update_guider(pipe, guidance_scale: float, apg_rescale: float, apg_momentum: float) -> None:
        guider = getattr(pipe, "guider", None)
        if guider is None:
            return
        if hasattr(guider, "guidance_scale"):
            guider.guidance_scale = guidance_scale
        if hasattr(guider, "adaptive_projected_guidance_rescale"):
            guider.adaptive_projected_guidance_rescale = apg_rescale
        if hasattr(guider, "adaptive_projected_guidance_momentum"):
            guider.adaptive_projected_guidance_momentum = apg_momentum
    
    
    def _export_video(frames, fps: int) -> str:
        from diffusers.utils import export_to_video
    
        tmp = tempfile.NamedTemporaryFile(suffix=".mp4", delete=False)
        tmp.close()
        export_to_video(frames, tmp.name, fps=fps)
        return tmp.name
    
    
    def _generate(
        *,
        mode: str,
        prompt: str,
        negative_prompt: str,
        input_image: Optional[Image.Image],
        width: int,
        height: int,
        num_frames: int,
        steps: int,
        guidance_scale: float,
        apg_rescale: float,
        apg_momentum: float,
        fps: int,
        seed: int,
        use_cpu_offload: bool,
        gguf_variant: str,
        attention_backend: str,
    ) -> str:
        if not prompt or not prompt.strip():
            raise ValueError("Prompt is required.")
        if mode == "i2v" and input_image is None:
            raise ValueError("Input image is required for image-to-video.")
    
        with _GEN_LOCK:
            t2v, i2v = _get_pipelines(gguf_variant, use_cpu_offload, attention_backend)
            pipe = i2v if mode == "i2v" else t2v
            _update_guider(pipe, guidance_scale, apg_rescale, apg_momentum)
    
            kwargs: Dict[str, Any] = dict(
                prompt=prompt.strip(),
                negative_prompt=(negative_prompt or DEFAULT_NEGATIVE_PROMPT).strip(),
                width=int(width),
                height=int(height),
                num_frames=int(num_frames),
                num_inference_steps=int(steps),
                generator=torch.Generator(device="cuda").manual_seed(int(seed)),
                callback_on_step_end=_make_step_logger(int(steps)),
            )
            if mode == "i2v":
                kwargs["image"] = input_image.convert("RGB")
    
            # Optional Motif kwargs — ignore if pipeline rejects them.
            for opt_key, opt_val in (("frame_rate", int(fps)), ("use_linear_quadratic_schedule", False)):
                kwargs[opt_key] = opt_val
    
            _LOG.info(
                "start %s w=%s h=%s frames=%s steps=%s variant=%s offload=%s attn=%s seed=%s",
                mode,
                width,
                height,
                num_frames,
                steps,
                gguf_variant,
                use_cpu_offload,
                _ATTENTION_BACKEND_ACTIVE,
                int(seed),
            )
            _log_cuda_mem("before_inference")
            t1 = time.perf_counter()
            try:
                output = pipe(**kwargs)
            except TypeError:
                kwargs.pop("use_linear_quadratic_schedule", None)
                try:
                    output = pipe(**kwargs)
                except TypeError:
                    kwargs.pop("frame_rate", None)
                    output = pipe(**kwargs)
            _LOG.info("inference done in %.1fs", time.perf_counter() - t1)
            _log_cuda_mem("after_inference")
    
            path = _export_video(output.frames[0], int(fps))
            _LOG.info("wrote video %s", path)
            return path
    
    
    # --- Gradio helpers ---------------------------------------------------------
    
    def t2v_ui(
        prompt: str,
        negative_prompt: str,
        width: int,
        height: int,
        num_frames: int,
        steps: int,
        guidance_scale: float,
        apg_rescale: float,
        apg_momentum: float,
        fps: int,
        seed: int,
        use_cpu_offload: bool,
        gguf_variant: str,
        attention_backend: str,
    ) -> str:
        try:
            return _generate(
                mode="t2v",
                prompt=prompt,
                negative_prompt=negative_prompt,
                input_image=None,
                width=width,
                height=height,
                num_frames=num_frames,
                steps=steps,
                guidance_scale=guidance_scale,
                apg_rescale=apg_rescale,
                apg_momentum=apg_momentum,
                fps=fps,
                seed=seed,
                use_cpu_offload=use_cpu_offload,
                gguf_variant=gguf_variant,
                attention_backend=attention_backend,
            )
        except Exception as exc:
            import gradio as gr
    
            raise gr.Error(str(exc)) from exc
    
    
    def i2v_ui(
        prompt: str,
        negative_prompt: str,
        image: Optional[Image.Image],
        width: int,
        height: int,
        num_frames: int,
        steps: int,
        guidance_scale: float,
        apg_rescale: float,
        apg_momentum: float,
        fps: int,
        seed: int,
        use_cpu_offload: bool,
        gguf_variant: str,
        attention_backend: str,
    ) -> str:
        try:
            return _generate(
                mode="i2v",
                prompt=prompt,
                negative_prompt=negative_prompt,
                input_image=image,
                width=width,
                height=height,
                num_frames=num_frames,
                steps=steps,
                guidance_scale=guidance_scale,
                apg_rescale=apg_rescale,
                apg_momentum=apg_momentum,
                fps=fps,
                seed=seed,
                use_cpu_offload=use_cpu_offload,
                gguf_variant=gguf_variant,
                attention_backend=attention_backend,
            )
        except Exception as exc:
            import gradio as gr
    
            raise gr.Error(str(exc)) from exc
    
    
    def build_gradio():
        import gradio as gr
    
        detected = _gpu_memory_gb()
        default_offload = _default_cpu_offload()
        default_variant = (
            DEFAULT_GGUF_VARIANT if DEFAULT_GGUF_VARIANT in GGUF_VARIANTS else "Q5_K_M"
        )
        default_attn = os.getenv("MOTIF_ATTENTION_BACKEND", "auto").strip().lower() or "auto"
    
        with gr.Blocks(title="Motif Video 2B One") as demo:
            gr.Markdown("# Motif Video 2B One")
            gr.Markdown(
                "Official Diffusers Motif pipelines + GGUF transformer "
                f"(`{GGUF_REPO}`). Default **Q5_K_M** for 24GB. "
                "SageAttention via `set_attention_backend` when available; else SDPA. "
                f"Detected GPU: **{detected:.1f} GB**."
            )
    
            with gr.Row():
                with gr.Column():
                    prompt = gr.Textbox(label="Prompt", lines=4)
                    negative_prompt = gr.Textbox(
                        label="Negative prompt",
                        lines=3,
                        value=DEFAULT_NEGATIVE_PROMPT,
                    )
                    gguf_variant = gr.Dropdown(
                        choices=GGUF_VARIANTS,
                        value=default_variant,
                        label="GGUF variant (MOTIF_GGUF_VARIANT)",
                    )
                    attention_backend = gr.Dropdown(
                        choices=["auto", "sage", "sdpa"],
                        value=default_attn if default_attn in {"auto", "sage", "sdpa"} else "auto",
                        label="Attention backend (MOTIF_ATTENTION_BACKEND)",
                    )
                    use_cpu_offload = gr.Checkbox(
                        label="Use enable_model_cpu_offload()",
                        value=default_offload,
                    )
                    with gr.Row():
                        width = gr.Slider(512, 1280, value=1280, step=64, label="Width")
                        height = gr.Slider(512, 736, value=736, step=64, label="Height")
                    with gr.Row():
                        num_frames = gr.Slider(16, 121, value=121, step=1, label="Frames")
                        steps = gr.Slider(10, 80, value=50, step=1, label="Steps")
                    with gr.Row():
                        guidance_scale = gr.Slider(
                            1.0, 12.0, value=8.0, step=0.1, label="Guidance Scale"
                        )
                        fps = gr.Slider(8, 30, value=24, step=1, label="FPS")
                    with gr.Row():
                        apg_rescale = gr.Slider(
                            1.0, 20.0, value=12.0, step=0.1, label="APG Rescale"
                        )
                        apg_momentum = gr.Slider(
                            0.0, 1.0, value=0.1, step=0.01, label="APG Momentum"
                        )
                    seed = gr.Number(label="Seed", value=42, precision=0)
                with gr.Column():
                    output_video = gr.Video(label="Generated Video", format="mp4")
    
            with gr.Tabs():
                with gr.TabItem("Text to Video"):
                    t2v_btn = gr.Button("Generate Text to Video", variant="primary")
                    t2v_btn.click(
                        fn=t2v_ui,
                        inputs=[
                            prompt,
                            negative_prompt,
                            width,
                            height,
                            num_frames,
                            steps,
                            guidance_scale,
                            apg_rescale,
                            apg_momentum,
                            fps,
                            seed,
                            use_cpu_offload,
                            gguf_variant,
                            attention_backend,
                        ],
                        outputs=output_video,
                    )
                with gr.TabItem("Image to Video"):
                    input_image = gr.Image(type="pil", label="Input Image", image_mode="RGB")
                    i2v_btn = gr.Button("Generate Image to Video", variant="primary")
                    i2v_btn.click(
                        fn=i2v_ui,
                        inputs=[
                            prompt,
                            negative_prompt,
                            input_image,
                            width,
                            height,
                            num_frames,
                            steps,
                            guidance_scale,
                            apg_rescale,
                            apg_momentum,
                            fps,
                            seed,
                            use_cpu_offload,
                            gguf_variant,
                            attention_backend,
                        ],
                        outputs=output_video,
                    )
        return demo
    
    
    # --- FastAPI ----------------------------------------------------------------
    
    class T2VRequest(BaseModel):
        prompt: str
        negative_prompt: str = DEFAULT_NEGATIVE_PROMPT
        width: int = 1280
        height: int = 736
        num_frames: int = 121
        steps: int = 50
        guidance_scale: float = 8.0
        apg_rescale: float = 12.0
        apg_momentum: float = 0.1
        fps: int = 24
        seed: int = 42
        use_cpu_offload: Optional[bool] = None
        gguf_variant: str = Field(default_factory=lambda: DEFAULT_GGUF_VARIANT)
        attention_backend: str = Field(
            default_factory=lambda: os.getenv("MOTIF_ATTENTION_BACKEND", "auto")
        )
    
    
    @asynccontextmanager
    async def lifespan(app: FastAPI):
        _LOG.info(
            "Motif Video serve starting default_variant=%s attn=%s",
            DEFAULT_GGUF_VARIANT,
            os.getenv("MOTIF_ATTENTION_BACKEND", "auto"),
        )
        yield
    
    
    app = FastAPI(title="Motif Video 2B One", version="1.0.19", lifespan=lifespan)
    app.add_middleware(
        CORSMiddleware,
        allow_origins=os.getenv("CORS_ORIGINS", "*").split(","),
        allow_credentials=True,
        allow_methods=["*"],
        allow_headers=["*"],
    )
    
    
    @app.get("/")
    def root():
        return RedirectResponse(url="/ui/", status_code=307)
    
    
    @app.get("/api/v1/health")
    def health():
        return {
            "status": "ok",
            "model_loaded": _I2V_PIPE is not None,
            "gguf_variant": _PIPE_KEY[0] if _PIPE_KEY else None,
            "cpu_offload": _PIPE_KEY[1] if _PIPE_KEY else None,
            "attention_backend": _ATTENTION_BACKEND_ACTIVE if _I2V_PIPE is not None else None,
            "gpu_memory_gb": round(_gpu_memory_gb(), 2),
            "default_gguf_variant": DEFAULT_GGUF_VARIANT,
        }
    
    
    @app.post("/api/v1/t2v")
    async def api_t2v(body: T2VRequest):
        offload = _default_cpu_offload() if body.use_cpu_offload is None else body.use_cpu_offload
        loop = asyncio.get_running_loop()
        try:
            path = await loop.run_in_executor(
                None,
                lambda: _generate(
                    mode="t2v",
                    prompt=body.prompt,
                    negative_prompt=body.negative_prompt,
                    input_image=None,
                    width=body.width,
                    height=body.height,
                    num_frames=body.num_frames,
                    steps=body.steps,
                    guidance_scale=body.guidance_scale,
                    apg_rescale=body.apg_rescale,
                    apg_momentum=body.apg_momentum,
                    fps=body.fps,
                    seed=body.seed,
                    use_cpu_offload=offload,
                    gguf_variant=body.gguf_variant,
                    attention_backend=body.attention_backend,
                ),
            )
        except Exception as exc:
            raise HTTPException(status_code=400, detail=str(exc)) from exc
        return FileResponse(path, media_type="video/mp4", filename="motif_t2v.mp4")
    
    
    @app.post("/api/v1/i2v")
    async def api_i2v(
        prompt: str = Form(...),
        image: UploadFile = File(...),
        negative_prompt: str = Form(DEFAULT_NEGATIVE_PROMPT),
        width: int = Form(1280),
        height: int = Form(736),
        num_frames: int = Form(121),
        steps: int = Form(50),
        guidance_scale: float = Form(8.0),
        apg_rescale: float = Form(12.0),
        apg_momentum: float = Form(0.1),
        fps: int = Form(24),
        seed: int = Form(42),
        use_cpu_offload: Optional[bool] = Form(None),
        gguf_variant: str = Form(DEFAULT_GGUF_VARIANT),
        attention_backend: str = Form(os.getenv("MOTIF_ATTENTION_BACKEND", "auto")),
    ):
        raw = await image.read()
        try:
            pil = Image.open(BytesIO(raw)).convert("RGB")
        except Exception as exc:
            raise HTTPException(status_code=400, detail=f"Invalid image: {exc}") from exc
    
        offload = _default_cpu_offload() if use_cpu_offload is None else use_cpu_offload
        loop = asyncio.get_running_loop()
        try:
            path = await loop.run_in_executor(
                None,
                lambda: _generate(
                    mode="i2v",
                    prompt=prompt,
                    negative_prompt=negative_prompt,
                    input_image=pil,
                    width=width,
                    height=height,
                    num_frames=num_frames,
                    steps=steps,
                    guidance_scale=guidance_scale,
                    apg_rescale=apg_rescale,
                    apg_momentum=apg_momentum,
                    fps=fps,
                    seed=seed,
                    use_cpu_offload=offload,
                    gguf_variant=gguf_variant,
                    attention_backend=attention_backend,
                ),
            )
        except Exception as exc:
            raise HTTPException(status_code=400, detail=str(exc)) from exc
        return FileResponse(path, media_type="video/mp4", filename="motif_i2v.mp4")
    
    
    def _mount_gradio() -> None:
        import gradio as gr
    
        global app
        app = gr.mount_gradio_app(
            app,
            build_gradio(),
            path=_GRADIO_MOUNT_PATH,
            root_path=_GRADIO_ROOT_PATH,
        )
    
    
    _mount_gradio()
    
    
    if __name__ == "__main__":
        import uvicorn
    
        port = int(os.getenv("SERVER_PORT", "7860"))
        uvicorn.run(app, host="0.0.0.0", port=port)
    
