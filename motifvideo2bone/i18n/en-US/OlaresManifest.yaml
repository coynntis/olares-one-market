metadata:
  title: Motif Video 2B One
  description: "Motif Video 2B GGUF Gradio + REST for text-to-video and image-to-video"

spec:
  fullDescription: |
    Official Diffusers MotifVideoPipeline / MotifVideoImage2VideoPipeline with
    GGUF transformer (default Q5_K_M) from Motif-Video-2B-GGUF.

    Optimized for Olares One RTX 5090M (24GB): CPU offload, SageAttention/SDPA
    fallback, AdaptiveProjectedGuidance (APG). Gradio at /ui; REST /api/v1/t2v,
    /api/v1/i2v, /api/v1/health; OpenAPI /docs.

    Runtime: pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel. Port 7860.
