spec:
  versionName: 1.0.16
  featuredImage: https://cdn.olares.com/images/2026/08/e0f2ec3b01285f7ca29fc9c541433d3d.png
  upgradeDescription: |
    v1.0.16: keep PIECEWISE cudagraphs; drop max_model_len 8192→7168 and util 0.95→0.97 so KV fits after torch.compile (was 0.43 GiB vs 0.43 needed).
    v1.0.15: match Unsloth HF recipe — image v0.25.1-x86_64 (CUDA 13, not cu129) + pip flashinfer-python>=0.6.13 nvidia-cutlass-dsl>=4.5.2 compressed-tensors>=0.17.
    v1.0.6: probe QuantizationArgs / null actorder fallback for old CT.
    v1.0.5: pin v0.25.1 (wrong cu129 variant).
    v1.0.4: --kv-cache-dtype fp8.
    v1.0.3: helm render fix.
    v1.0.2: sanitize webui→vLLM; wrap errors.
    v1.0.1: soft-ready /v1/models; stub /cors-proxy.
    v1.0.0: initial release.

  fullDescription: |
    Unsloth Qwen3.6-35B-A3B-NVFP4-Fast (MoE VLM, ~23.6 GB weights). Upstream notes 32GB VRAM preferred — tight on 24GB 5090M; fp8 KV + PIECEWISE CUDA graphs + 32K default ctx to leave headroom.
    
    Stack:
    - Image: vllm/vllm-openai:v0.25.1-x86_64 (CUDA 13)
    - --kv-cache-dtype fp8
    - Native multimodal vision (limit-mm image=1) — no separate mmproj
    - MTP off on 24GB VRAM (weights fill GPU; re-enable on 32GB+)
    - Default max_model_len 32768 (raise via LLM_CONTEXT_WINDOW if VRAM allows)
    
    Entrance: llama.cpp web UI proxying OpenAI API to vLLM.
  developer: coynntis
