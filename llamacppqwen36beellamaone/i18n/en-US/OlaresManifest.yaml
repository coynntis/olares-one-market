metadata:
  title: Qwen36 27B BeeLlama One
  description: "Qwen3.6 27B fastest local — 106 t/s @ 262K via BeeLlama.cpp 0.1.3-rc3 + DFlash + turbo3 KV"

spec:
  fullDescription: |
    Qwen3.6 27B served via Anbeeld/beellama.cpp 0.1.3-rc3 (chain: ggml-org → TheTom/turboquant → spiritbuun/buun → Anbeeld).
    Image: aamsellem/beellama-cpp:0.1.3-rc3 (custom amd64 + CUDA 13 + sm_120 build)
    Target: unsloth/Qwen3.6-27B-GGUF UD-Q3_K_XL (14.5 GB, non-MTP variant)
    Drafter: spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q8_0 (1.85 GB)
    KV cache: turbo3 (3-bit Walsh-Hadamard rotated)
    Spec: DFlash with --spec-dflash-cross-ctx 1024, batch 2048, ubatch 256
    Validated 2026-05-14: 106 t/s AVG @ 262K (5 clean runs, range 101-111 t/s). ZERO CUDA OOM.
    Fastest Qwen3.6 27B dense path on Olares One at full native context.
    OpenAI-compatible API on port 8000 via nginx client proxy on port 8080.
