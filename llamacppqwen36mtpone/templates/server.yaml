---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-mtp-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_MODEL: "unsloth/Qwen3.6-27B-MTP-GGUF"
  TARGET_FILE: "Qwen3.6-27B-UD-Q3_K_XL.gguf"
  MODEL_ALIAS: "qwen3.6-27b-mtp"
  CTX_SIZE: "262144"
  THREADS: "16"
  SPEC_DRAFT_N_MAX: "3"
  CHAT_TEMPLATE_URL: "https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/main/chat_template.jinja"
  CHAT_TEMPLATE_FILE: "chat_template.jinja"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen36mtpone
  name: llamacppqwen36mtpone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.llamacppqwen36mtpone.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen36mtpone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen36mtpone
    spec:
      containers:
        - name: llamacpp-mtp-server
          image: "docker.io/aamsellem/buun-llama-cpp:87c351d2"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              MODELS_DIR=${MODELS_DIR:-/models}
              SHARED_DIR=${SHARED_DIR:-/shared-models/llms}
              mkdir -p "$MODELS_DIR" "$SHARED_DIR"
              find_comfy_llms() {
                local name="$1" src
                [ -n "$name" ] || return 1
                [ -d /comfyui-llms ] || return 1
                src="$(find /comfyui-llms -maxdepth 4 -type f -name "$name" 2>/dev/null | head -n 1)"
                [ -n "$src" ] && [ -f "$src" ] || return 1
                printf '%s\n' "$src"
              }
              link_from_comfy_llms() {
                local dest="$1" name src
                name="$(basename "$dest")"
                [ -n "$name" ] || return 1
                src="$(find_comfy_llms "$name")" || return 1
                if [ -f "$dest" ] && [ ! -L "$dest" ]; then
                  return 1
                fi
                echo "[comfy-reuse] $src → $dest (symlink, skip redownload)" >&2
                rm -f "$dest"
                ln -sfn "$src" "$dest"
                return 0
              }
              # Migrate $TARGET_FILE from old per-app dir to shared if needed
              if [ -f "$MODELS_DIR/$TARGET_FILE" ] && [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Migrating $TARGET_FILE from per-app → shared"
                mv "$MODELS_DIR/$TARGET_FILE" "$SHARED_DIR/$TARGET_FILE"
                [ -f "$MODELS_DIR/$TARGET_FILE.ok" ] && mv "$MODELS_DIR/$TARGET_FILE.ok" "$SHARED_DIR/$TARGET_FILE.ok" || touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              if type link_from_comfy_llms >/dev/null 2>&1; then
                if link_from_comfy_llms "$SHARED_DIR/$TARGET_FILE"; then
                  if [ -s "$SHARED_DIR/$TARGET_FILE" ]; then
                    echo "[comfy-reuse] $TARGET_FILE present — stamp .ok" >&2
                    if [ -n "${REV:-}" ]; then
                      echo "$REV" > "$SHARED_DIR/$TARGET_FILE.ok"
                    else
                      touch "$SHARED_DIR/$TARGET_FILE.ok"
                    fi
                  fi
                fi
              fi
              if [ ! -f "$SHARED_DIR/$TARGET_FILE.ok" ]; then
                echo "==> Downloading $TARGET_MODEL/$TARGET_FILE"
                HF_AUTH=""
                if [ -n "$HF_TOKEN" ]; then HF_AUTH="-H \"Authorization: Bearer $HF_TOKEN\""; fi
                eval curl -fL -C - --retry 20 --retry-delay 15 --retry-all-errors --connect-timeout 30 $HF_AUTH \
                  "https://huggingface.co/${TARGET_MODEL}/resolve/main/${TARGET_FILE}" \
                  -o "$SHARED_DIR/$TARGET_FILE"
                touch "$SHARED_DIR/$TARGET_FILE.ok"
              fi
              EXTRA_LLM_ARGS=()
              if [ -n "${LLM_MAX_OUTPUT_TOKENS:-}" ]; then EXTRA_LLM_ARGS+=(--n-predict "$LLM_MAX_OUTPUT_TOKENS"); fi
              if [ -n "${LLM_API_KEY:-}" ]; then EXTRA_LLM_ARGS+=(--api-key "$LLM_API_KEY"); fi
              REASONING_ARGS=()
              REASONING_MODE="$(echo "${LLM_REASONING:-on}" | tr '[:upper:]' '[:lower:]')"
              case "$REASONING_MODE" in
                off|0|false|no) REASONING_ARGS=(--reasoning off) ;;
                auto) REASONING_ARGS=(--reasoning auto) ;;
                *) REASONING_ARGS=(--reasoning on) ;;
              esac
              CTK_ARGS=()
              if [ -n "${LLM_ENABLE_THINKING:-}" ] || [ -n "${LLM_PRESERVE_THINKING:-}" ]; then
                json_bool() { case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in 1|true|yes|on) echo true ;; *) echo false ;; esac; }
                kw="{"
                [ -n "${LLM_ENABLE_THINKING:-}" ] && kw="${kw}\"enable_thinking\":$(json_bool "$LLM_ENABLE_THINKING"),"
                [ -n "${LLM_PRESERVE_THINKING:-}" ] && kw="${kw}\"preserve_thinking\":$(json_bool "$LLM_PRESERVE_THINKING"),"
                kw="${kw%,}}"
                CTK_ARGS=(--chat-template-kwargs "$kw")
              fi
              CHAT_TEMPLATE="${MODELS_DIR:-/models}/${CHAT_TEMPLATE_FILE:-chat_template.jinja}"
              TEMPLATE_SRC="$(echo "${LLM_CHAT_TEMPLATE_SOURCE:-froggeric}" | tr '[:upper:]' '[:lower:]')"
              case "$TEMPLATE_SRC" in
                froggeric|remote|hf)
                  echo "==> Fetching chat template (froggeric)"
                  eval curl -fL --retry 10 --retry-delay 5 $HF_AUTH \
                    "${CHAT_TEMPLATE_URL:-https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/main/chat_template.jinja}" -o "$CHAT_TEMPLATE"
                  ;;
                url|custom)
                  if [ -z "${LLM_CHAT_TEMPLATE_URL:-}" ]; then echo "LLM_CHAT_TEMPLATE_URL required when source=url"; exit 1; fi
                  echo "==> Fetching chat template from $LLM_CHAT_TEMPLATE_URL"
                  curl -fL --retry 10 --retry-delay 5 -o "$CHAT_TEMPLATE" "$LLM_CHAT_TEMPLATE_URL"
                  ;;
                bundled|local|chart|*)
                  if [ -f "/etc/llamacpp/chat-template/chat_template.jinja" ]; then
                    cp "/etc/llamacpp/chat-template/chat_template.jinja" "$CHAT_TEMPLATE"
                    echo "==> Using bundled chart chat template"
                  else
                    echo "==> Bundled template missing; falling back to froggeric"
                    eval curl -fL --retry 10 --retry-delay 5 $HF_AUTH \
                      "${CHAT_TEMPLATE_URL:-https://huggingface.co/froggeric/Qwen-Fixed-Chat-Templates/resolve/main/chat_template.jinja}" -o "$CHAT_TEMPLATE"
                  fi
                  ;;
              esac

              exec /app/llama-server \
                --model "$SHARED_DIR/$TARGET_FILE" \
                --alias "$MODEL_ALIAS" \
                --host 0.0.0.0 --port 8000 \
                --n-gpu-layers 99 \
                --ctx-size "${LLM_CONTEXT_WINDOW:-${CTX_SIZE:-262144}}" \
                --threads "${THREADS:-16}" \
                --cache-type-k q8_0 --cache-type-v turbo4 \
                --batch-size 512 --ubatch-size 512 \
                --parallel 1 \
                --flash-attn on \
                --op-offload --jinja --chat-template-file "$CHAT_TEMPLATE" \
                --spec-type draft-mtp \
                --spec-draft-n-max "${SPEC_DRAFT_N_MAX:-3}" \
                "${CTK_ARGS[@]}" \
                "${REASONING_ARGS[@]}" \
                "${EXTRA_LLM_ARGS[@]}"
          envFrom:
            - configMapRef:
                name: llamacpp-mtp-env
          env:
            - name: HF_HOME
              value: "/models/huggingface"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.HF_TOKEN | default "" }}"
            - name: MODELS_DIR
              value: "/models"
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "30000m"
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            - name: LLM_CONTEXT_WINDOW
              value: {{ .Values.olaresEnv.LLM_CONTEXT_WINDOW | default "" | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ .Values.olaresEnv.LLM_MAX_OUTPUT_TOKENS | default "" | quote }}
            - name: LLM_API_KEY
              value: {{ .Values.olaresEnv.LLM_API_KEY | default "" | quote }}
            - name: LLM_REASONING
              value: {{ .Values.olaresEnv.LLM_REASONING | default "" | quote }}
            - name: LLM_CHAT_TEMPLATE_SOURCE
              value: {{ .Values.olaresEnv.LLM_CHAT_TEMPLATE_SOURCE | default "" | quote }}
            - name: LLM_CHAT_TEMPLATE_URL
              value: {{ .Values.olaresEnv.LLM_CHAT_TEMPLATE_URL | default "" | quote }}
            - name: LLM_ENABLE_THINKING
              value: {{ .Values.olaresEnv.LLM_ENABLE_THINKING | default "" | quote }}
            - name: LLM_PRESERVE_THINKING
              value: {{ .Values.olaresEnv.LLM_PRESERVE_THINKING | default "" | quote }}
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/shared-models"
              name: shared-models
            - mountPath: "/comfyui-llms"
              name: comfyui-llms
      volumes:
        - name: models
          hostPath:
            path: "{{ .Values.userspace.appData }}/models"
            type: DirectoryOrCreate
        - name: shared-models
          hostPath:
            path: "/olares/share/ai/model"
            type: DirectoryOrCreate
        - name: comfyui-llms
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/comfyui/model/llms"
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen36mtpone
  name: llamacppqwen36mtpone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp-mtp"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacppqwen36mtpone
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen36mtpone
  name: sharedentrances-llamacppqwen36mtpone
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacppqwen36mtpone"
      port: 80
      targetPort: 8000
  selector:
    io.kompose.service: llamacppqwen36mtpone
