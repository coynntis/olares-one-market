    io.kompose.service: llamacpplagunas21one
  name: llamacpplagunas21one
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "llamacpp"
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: llamacpplagunas21one
