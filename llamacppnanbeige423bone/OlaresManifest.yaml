spec:
  versionName: 1.0.4
  featuredImage: https://cdn.olares.com/images/2026/08/d4bba4a2cf8c91924b0a40fa597731d2.png
  upgradeDescription: |
    v1.0.4: reuse GGUFs already in Common/comfyui/model/llms (and subdirs) via symlink — official ComfyUI migrates External/ai/model/llms there; skip redownload.
    v1.0.2: drop --mlock — Olares pods hit RLIMIT_MEMLOCK (Cannot allocate memory); warning only but matches Agents-A1 lesson.
    v1.0.1: fix cmake UI embed fail — Nanbeige fork needs SvelteKit UI (manifest.webmanifest/sw.js/workbox). Stop seeding b9596 flat bundle.js; download ggml-org/llama-ui latest dist.tar.gz instead. Rebuild stamp CHART_BOOT=1.0.1.
    v1.0.0: Nanbeige4.2-3B (looped transformer, ~3B non-embed) via Andgihat Q8_0 GGUF + Nanbeige/llama.cpp @ nanbeige42. Stock ggml-org cannot load arch=nanbeige (PR #25994 open). Default ctx 131K, q8 KV, reasoning sampling. Laguna-S-2.1-NVFP4 skipped — ~71GB weights need ~128GB unified memory, not Olares One 24GB.
  fullDescription: |
    Nanbeige4.2-3B — compact agentic/reasoning LLM (~4B total / ~3B non-embedding) with
    LoopSplit + mHC depth attention. Beats larger Qwen3.5-9B / Gemma4-12B on many agent benches
    while fitting easily on Olares One RTX 5090M 24GB.

    Model: Andgihat/Nanbeige4.2-3B-GGUF → Nanbeige4.2-3B-Q8_0.gguf (exact 4434787232 bytes)
      - imatrix + KLD-guided quant; near-BF16 fidelity for tool calls / code / math
      - Architecture general.architecture=nanbeige (looped; not in stock llama.cpp yet)

    Runtime: nvidia/cuda:13.1.0-devel builds Nanbeige/llama.cpp @ 26cfdc4 (branch nanbeige42)
    with embedded Web UI from ggml-org/llama-ui latest dist.tar.gz (SvelteKit layout).
    Default ctx 131072 (native 262144), KV q8_0/q8_0, -ngl 99, --ui --jinja, --flash-attn on, --op-offload.
    Sampling (Nanbeige reasoning/chat): temp 0.6 top_p 0.95 top_k 20.
    For agent/tool-heavy sessions raise temp toward 1.0 via client.

    Why not Laguna-S-2.1-NVFP4: 117.6B-A8.5B MoE, ~71GB NVFP4 / ~75GB Q4_K_M — Poolside targets
    ~128GB unified (DGX Spark / Mac Studio). Does not fit a sane One workload.

    Apache-2.0. HF token recommended for reliable downloads.
