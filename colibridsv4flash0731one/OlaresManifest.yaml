spec:
  versionName: 1.0.2
  featuredImage: https://cdn.olares.com/images/2026/08/a76f15a2d1b0c1e0d2e387bf3be9d291.png
  upgradeDescription: |
    v1.0.2: reuse GGUFs already in Common/comfyui/model/llms (and subdirs) via symlink — official ComfyUI migrates External/ai/model/llms there; skip redownload.
    v1.0.0: experimental Colibri deepseek-v4 engine — streams official
      deepseek-ai/DeepSeek-V4-Flash-0731 (~155 GB) from NVMe with --ram planner budget.
      Builds JustVugg/colibri; OpenAI gateway via coli serve :8000. Slow / disk-bound TG.
  fullDescription: |
    EXPERIMENTAL — DeepSeek-V4-Flash-0731 via JustVugg/colibri SSD expert streaming.
    Unlike llama.cpp --cpu-moe (experts must fit in RAM), Colibri pages routed experts
    from disk into a RAM working set sized by COLIBRI_RAM_GB (default 48).

      Checkpoint: deepseek-ai/DeepSeek-V4-Flash-0731 (~155.4 GB native FP4/FP8 safetensors)
      Engine: make -C c deepseek-v4 (CPU OpenMP; DSpark not in this target PR)
      Serve: python ./coli serve --host 0.0.0.0 --port 8000 --model … --ram N
      Expectation: decode often disk-bound; correctness over speed. No SLA.

    Editable knobs:
      COLIBRI_RAM_GB: planner budget GiB (default 48; not an OS hard limit)
      LLM_API_KEY: optional API key for OpenAI gateway
      HF_TOKEN: required for large gated/rate-limited download

    Disk: need ~180 GB free under /olares/share/ai/model (shared).
    First boot: clone + compile + ~155 GB download — hours.

    License: DeepSeek model license. Engine: see JustVugg/colibri.
