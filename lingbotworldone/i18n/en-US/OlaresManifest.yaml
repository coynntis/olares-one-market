---
olaresManifest.version: 0.12.0
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  lingbotworldone: 1
  lingbotworldonecli: 1
metadata:
  name: lingbotworldone
  icon: https://cdn.olares.com/images/2026/07/7646bb3c563e51e394ef58df7fc48eba.png
  description: World I2V NF4 + T5 CPU / layer offload (24GB)
  title: LingBot World NF4 One
  version: 1.0.8
  categories:
    - AI
sharedEntrances:
  - name: lingbotworldone
    host: sharedentrances-lingbotworldone
    port: 0
    title: LingBot World NF4 One API
    icon: https://cdn.olares.com/images/2026/07/7646bb3c563e51e394ef58df7fc48eba.png
    invisible: true
    authLevel: internal
entrances:
  - name: lingbotworldonecli
    port: 8080
    host: lingbotworldonecli
    title: LingBot World NF4 One
    icon: https://cdn.olares.com/images/2026/07/7646bb3c563e51e394ef58df7fc48eba.png
    openMethod: window
    authLevel: internal
spec:
  versionName: 1.0.8
  featuredImage: https://cdn.olares.com/images/2026/07/2e341e74663488f71875a5e232bf9ae8.png
  fullDescription: |
    LingBot-World Base Cam NF4 (community) with aggressive offload for 5090M.

    Hardware: Olares One — RTX 5090M 24GB + 96GB DDR5.

    Runtime image: pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (required for sm_120).

    Weights: cahlen/lingbot-world-base-cam-nf4
    Source: https://github.com/Robbyant/lingbot-world
    Project: https://technology.robbyant.com/lingbot-world

    Boot lessons (Krea soft-ready):
    - soft-ready HTTP on :7860 before uv/pip/HF download (pass ~30m install gate)
    - uv pip --target /workspace/lingbotworldone/site-packages (persist uv + cache)
    - purge torch shadow from site-packages (image owns torch)
    - bootstrap attempts + download progress → /workspace/lingbotworldone/bootstrap.log
    - GET /health shows phase / attempts_tail while installing

    UI: / and /ui · REST under /api/v1 · health: GET /health
  developer: Robbyant
  website: https://technology.robbyant.com/lingbot-world
  sourceCode: https://github.com/Robbyant/lingbot-world
  submitter: coynntis
  locale:
    - en-US
  license:
    - text: Apache-2.0
      url: https://github.com/Robbyant/lingbot-world
  supportArch:
    - amd64
  onlyAdmin: true
  accelerator:
    - mode: nvidia
      requiredCpu: '1'
      limitedCpu: '17'
      requiredMemory: 4Gi
      limitedMemory: 65Gi
      requiredDisk: 80Gi
      limitedDisk: 200Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
  upgradeDescription: |
    - **1.0.8**: Fix Gradio file URLs — import mount_gradio; redirect /gradio_api/* to /ui/gradio_api/* (query preserved).
    v1.0.7: base image pytorch/pytorch:2.12.0-cuda13.0-cudnn9-devel (sm_120 / RTX 5090M); was 2.6+cu12.4 with no Blackwell kernels.
    v1.0.4: vision loader API fix (repo_id_or_path dir).
    v1.0.3: audit upstream inference deps; deps marker v3.
    v1.0.2: omegaconf + reinstall after --no-deps.
    v1.0.1: Helm-safe soft_ready / ConfigMap brace escape.
    v1.0.0: initial chart — soft-ready + uv site-packages + Gradio/REST.

permission:
  appData: true
envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_REPO_ID
    required: false
    editable: true
    applyOnChange: true
    value: 'cahlen/lingbot-world-base-cam-nf4'
  - envName: UV_INDEX_URL
    required: false
    editable: true
    applyOnChange: true
    value: ''
  - envName: LINGBOT_WORLD_T5_CPU
    required: false
    editable: true
    applyOnChange: true
    value: '1'
  - envName: LINGBOT_WORLD_LAYER_OFFLOAD
    required: false
    editable: true
    applyOnChange: true
    value: '1'
  - envName: LINGBOT_WORLD_MAX_FRAMES
    required: false
    editable: true
    applyOnChange: true
    value: '49'
options:
  shared: true
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
