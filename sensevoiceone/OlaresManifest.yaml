      requiredCpu: '1'
      limitedCpu: '9'
      requiredMemory: 3Gi
      limitedMemory: 9Gi
      requiredDisk: 8Gi
      limitedDisk: 20Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 2Gi
permission:
