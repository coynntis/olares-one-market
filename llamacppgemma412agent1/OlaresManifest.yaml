    Gemma 4 12B agentic Fable5 Composer 2.5 v2 Q4_K_M — tool-calling tuned for agent workflows.

    Model: yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF (Q4_K_M, ~7 GB).
    Image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b8740. Default context 128K (131072 tokens).
    q4_0 KV cache, batch/ubatch 512, --jinja, slot-save-path for session persistence.
    Olares One optimized. OpenAI-compatible API on port 8080 via client proxy.
    Optional LLM_CONTEXT_WINDOW, LLM_MAX_OUTPUT_TOKENS, LLM_API_KEY in app settings.
