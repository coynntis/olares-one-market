spec:
  versionName: 1.0.0
  featuredImage: https://cdn.olares.com/images/2026/08/8053a00007127d6862782349a6824f3c.png
  upgradeDescription: |
    v1.0.0: initial release. Nail-Qwen3.6-35B-A3B-GGUF-MTP (IQ4_XS + mmproj) on buun-llama-cpp with --mmproj-gpu-swap, MTP, q8_0/turbo4 KV, 128K default context, and persistent crash logs.
  fullDescription: |
    Nail-Qwen3.6-35B-A3B-GGUF-MTP served via llama.cpp on Olares One.
    Vision path enabled with mmproj-F16.gguf and --mmproj-gpu-swap.

    Stack:
    - Image: docker.io/aamsellem/buun-llama-cpp:87c351d2
    - Model: peculiar-ragdoll/Nail-Qwen3.6-35B-A3B-GGUF-MTP
      -> Nail-Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf (~18.2 GB)
    - Vision: mmproj-F16.gguf (~899 MB)
    - MTP: --spec-type draft-mtp --spec-draft-n-max 4
    - Default context: 128K (131072 tokens)

    OpenAI-compatible API on :8000 (via client proxy :8080).
  developer: coynntis
  website: https://huggingface.co/peculiar-ragdoll/Nail-Qwen3.6-35B-A3B-GGUF-MTP
  sourceCode: https://github.com/coynntis/olares-one-market
