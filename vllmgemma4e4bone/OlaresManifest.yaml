      requiredCpu: '1'
      limitedCpu: '9'
      requiredMemory: 3Gi
      limitedMemory: 25Gi
      requiredDisk: 20Gi
      limitedDisk: 30Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi
