spec:
  versionName: 1.0.4
  featuredImage: https://cdn.olares.com/images/2026/08/62624e2949da9f149e77df9480eb925c.png
  upgradeDescription: |
    v1.0.4: LLM_REASONING + chat template source / thinking env toggles.
    v1.0.3: reuse GGUFs already in Common/comfyui/model/llms (and subdirs) via symlink — official ComfyUI migrates External/ai/model/llms there; skip redownload.
    v1.0.1: KV q8_0/turbo4 → turbo3/turbo3; default ctx 64K → 128K for longer context on 24GB.
      Raise toward 192K–256K via LLM_CONTEXT_WINDOW if VRAM allows; drop back if OOM.
    v1.0.0: DavidAU Qwen3.6-27B-Fable-Fusion-711 Heretic NEO-MAX MTP-Q4_K_M (~18.5 GB)
      + mmproj-BF16 vision via --mmproj-gpu-swap + draft-mtp n=3 + froggeric jinja tools.
      buun-llama-cpp:87c351d2.
  fullDescription: |
    Qwen3.6 27B Fable Fusion 711 (uncensored Heretic / NEO IMATRIX) on Olares One.
    Multi-stage tune — ARC-C ~0.71 class; vision + tool calling on one endpoint.

    Weights: DavidAU/...-MTP-GGUF NEO-MTP-Q4_K_M (exact 18498575840) — speed/quality balance
      Author notes ~90 t/s class MTP vs ~75 t/s regular Q4 on 5090 when accept ≥50%.
      mmproj-BF16 from same repo (~931 MB) with --mmproj-gpu-swap (text keeps MTP resident).

    Runtime: docker.io/aamsellem/buun-llama-cpp:87c351d2
      --spec-type draft-mtp --spec-draft-n-max 3 (LLM_SPEC_DRAFT_N_MAX editable)
      --jinja + froggeric Qwen chat template (Hermes-style tools)
      --reasoning off (agent-friendly; enable thinking via client if needed)
      KV: turbo3/turbo3 (3-bit Walsh-Hadamard — smaller than q8_0/turbo4 → longer ctx)
      Default ctx 131072 (128K); try higher via LLM_CONTEXT_WINDOW; dense Q4_K_M leaves less
      headroom than BeeLlama Q3_K_XL @ 262K

    Sampling (author / Qwen): coding think temp 0.6 top_p 0.95 top_k 20;
      general think temp 1.0; instruct temp 0.7 top_p 0.8 presence_penalty 1.5.
      MTP: keep temp ≤1 and rep-pen 1; if draft accept <50% expect less speedup.

    First boot downloads ~19.5 GB. OpenAI-compatible API :8000 via client :8080.
    License: Apache-2.0 (base Qwen) + model card terms.
  developer: DavidAU
