        v1.2.5: bump spec.accelerator to cover server + client container resource sums (v3 lint).
    v1.2.4: migrate to apiVersion v3 shared chart (Olares 1.12.6+). Flatten server+client; workloadReplicas; no OLARES_USER_* in templates.
