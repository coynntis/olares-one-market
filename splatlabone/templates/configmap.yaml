    """Model registry and path resolution."""
    
    from __future__ import annotations
    
    import os
    from pathlib import Path
    
    MODEL_REGISTRY: dict[str, dict] = {
        "vggt_omega": {
            "hub": "modelscope",
            "model_id": "facebook/VGGT-Omega",
            "files": ["vggt_omega_1b_512.pt"],
            "hf_fallback": "facebook/VGGT-Omega",
        },
        "lingbot": {
            "hub": "modelscope",
            "model_id": "Robbyant/lingbot-map",
            "files": [],
            "hf_fallback": "robbyant/lingbot-map",
        },
        "da3": {
            "hub": "huggingface",
            "model_id": "depth-anything/DA3NESTED-GIANT-LARGE",
            "files": [],
            "hf_fallback": None,
        },
        "da3_cpp": {
            "hub": "huggingface",
            "model_id": "mudler/depth-anything.cpp-gguf",
            "filename": "depth-anything-base-q4_k.gguf",
            "files": ["depth-anything-base-q4_k.gguf"],
            "hf_fallback": None,
        },
        "mast3r": {
            "hub": "url",
            "url": "https://download.europe.naverlabs.com/ComputerVision/MASt3R/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth",
            "filename": "MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth",
        },
    }
    
    CACHE_ROOT = Path(os.environ.get("SPLATLAB_MODEL_CACHE", "/data/splatlab/cache/models"))
    MODELSCOPE_CACHE = Path(os.environ.get("MODELSCOPE_CACHE", "/data/splatlab/cache/modelscope"))
    
    
    def model_dir(key: str) -> Path:
        return CACHE_ROOT / key
    
    
    def resolve(key: str) -> Path | None:
        """Return local path if model files exist."""
        entry = MODEL_REGISTRY.get(key)
        if not entry:
            return None
        base = model_dir(key)
        if entry.get("hub") == "url":
            p = base / entry["filename"]
            return p if p.is_file() else None
        if entry.get("filename"):
            candidate = base / entry["filename"]
            if candidate.is_file():
                return candidate
            for hit in base.rglob(Path(entry["filename"]).name):
                if hit.is_file():
                    return hit
        if entry.get("files"):
            for fname in entry["files"]:
                for root in (base, MODELSCOPE_CACHE / entry["model_id"].replace("/", "--")):
                    candidate = root / fname
                    if candidate.is_file():
                        return candidate
                    for hit in root.rglob(fname):
                        return hit
        if base.is_dir() and any(base.iterdir()):
            return base
        ms = MODELSCOPE_CACHE / entry["model_id"].replace("/", "--")
        if ms.is_dir() and any(ms.iterdir()):
            return ms
        return None
    
    
    def is_cached(key: str) -> bool:
        return resolve(key) is not None
    
  pipeline--models--download.py: |
    """Download geometry model weights (ModelScope-first for Meta/facebook)."""
    
    from __future__ import annotations
    
    import logging
    import os
    import urllib.request
    from pathlib import Path
    
    from pipeline.models.cache import CACHE_ROOT, MODEL_REGISTRY, MODELSCOPE_CACHE, model_dir
    
    log = logging.getLogger("splatlab.models")
    
    
    def _mark_ok(path: Path) -> None:
        (path.parent / f"{path.name}.ok").write_text("1")
    
    
    def _skip_if_ok(path: Path) -> bool:
        ok = path.parent / f"{path.name}.ok"
        return path.is_file() and ok.is_file()
    
    
    def _download_hf_file(model_id: str, filename: str, dest: Path, token: str | None) -> Path:
        from huggingface_hub import hf_hub_download
    
        dest.parent.mkdir(parents=True, exist_ok=True)
        kwargs: dict = {"repo_id": model_id, "filename": filename, "local_dir": str(dest.parent)}
        if token:
            kwargs["token"] = token
        endpoint = os.environ.get("HF_ENDPOINT")
        if endpoint:
            os.environ["HF_ENDPOINT"] = endpoint
        out = hf_hub_download(**kwargs)
        path = Path(out)
        if path.is_file():
            return path
        fallback = dest.parent / filename
        if fallback.is_file():
            return fallback
        return path
    
    
    def _download_hf(model_id: str, dest: Path, token: str | None) -> Path:
        from huggingface_hub import snapshot_download
    
        dest.mkdir(parents=True, exist_ok=True)
        kwargs: dict = {}
        if token:
            kwargs["token"] = token
        endpoint = os.environ.get("HF_ENDPOINT")
        if endpoint:
            os.environ["HF_ENDPOINT"] = endpoint
        snapshot_download(repo_id=model_id, local_dir=str(dest), **kwargs)
        return dest
    
    
    def _download_modelscope(model_id: str, dest: Path, token: str | None) -> Path:
        from modelscope import snapshot_download
    
        MODELSCOPE_CACHE.mkdir(parents=True, exist_ok=True)
        kwargs: dict = {"cache_dir": str(MODELSCOPE_CACHE)}
        if token:
            kwargs["token"] = token
        out = snapshot_download(model_id, **kwargs)
        return Path(out)
    
    
    def _download_url(url: str, dest: Path) -> Path:
        dest.parent.mkdir(parents=True, exist_ok=True)
        if _skip_if_ok(dest):
            log.info("already present: %s", dest)
            return dest
        log.info("downloading %s -> %s", url, dest)
        urllib.request.urlretrieve(url, dest)  # noqa: S310
        _mark_ok(dest)
        return dest
    
    
    def download_model(key: str, *, force: bool = False) -> Path:
        entry = MODEL_REGISTRY.get(key)
        if not entry:
            raise KeyError(f"unknown model key: {key}")
    
        dest = model_dir(key)
        dest.mkdir(parents=True, exist_ok=True)
        hf_token = os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN")
        ms_token = os.environ.get("MODELSCOPE_TOKEN")
        hub_mode = os.environ.get("SPLATLAB_MODEL_HUB", "auto")
    
        if entry.get("hub") == "url":
            path = dest / entry["filename"]
            if not force and _skip_if_ok(path):
                return path
            return _download_url(entry["url"], path)
    
        model_id = entry["model_id"]
        primary = entry.get("hub", "huggingface")
        if hub_mode == "auto" and entry.get("hf_fallback"):
            primary = entry["hub"]
    
        if entry.get("filename") and primary == "huggingface":
            path = dest / entry["filename"]
            if not force and _skip_if_ok(path):
                return path
            try:
                out = _download_hf_file(model_id, entry["filename"], path, hf_token)
                _mark_ok(out)
                log.info("downloaded %s via hf file -> %s", key, out)
                return out
            except Exception as exc:
                raise RuntimeError(f"download failed for {key}: hf file: {exc}") from exc
    
        errors: list[str] = []
        if primary == "modelscope":
            try:
                out = _download_modelscope(model_id, dest, ms_token)
                log.info("downloaded %s via modelscope -> %s", key, out)
                return Path(out)
            except Exception as exc:
                errors.append(f"modelscope: {exc}")
                fb = entry.get("hf_fallback")
                if fb:
                    try:
                        out = _download_hf(fb, dest, hf_token)
                        log.info("downloaded %s via hf fallback -> %s", key, out)
                        return out
                    except Exception as exc2:
                        errors.append(f"hf: {exc2}")
        else:
            try:
                out = _download_hf(model_id, dest, hf_token)
                log.info("downloaded %s via huggingface -> %s", key, out)
                return out
            except Exception as exc:
                errors.append(f"hf: {exc}")
    
        raise RuntimeError(f"download failed for {key}: {'; '.join(errors)}")
    
    
    def prefetch_all(keys: list[str]) -> dict[str, str]:
        results: dict[str, str] = {}
        for key in keys:
            try:
                path = download_model(key)
                results[key] = str(path)
            except Exception as exc:
                log.warning("prefetch %s failed: %s", key, exc)
                results[key] = f"error: {exc}"
        return results
    
  pipeline--train--__init__.py: |
    """gsplat training: 3DGS, 2DGS+MCMC, progressive checkpoints."""
    
    from __future__ import annotations
    
    import json
    import os
    import subprocess
    from pathlib import Path
    from typing import Callable
    
    from pipeline.export import export_from_checkpoint, find_latest_checkpoint
    
    TRAINER_PATH = Path("/opt/gsplat/examples/simple_trainer.py")
    
    
    def _build_trainer_cmd(
        workspace: Path,
        result_dir: Path,
        cfg: dict,
        *,
        enable_live_viewer: bool = False,
        viewer_port: int | None = None,
    ) -> list[str]:
        representation = cfg.get("stages", {}).get("representation", "3dgs")
        densification = cfg.get("stages", {}).get("densification", "default_adc")
        pose_opt = cfg.get("stages", {}).get("pose_opt", "off")
        iterations = int(cfg.get("iterations", 30000))
        ckpt_interval = int(cfg.get("checkpoint_interval", 7000))
    
        # gsplat subcommands: default | mcmc (2DGS+MCMC requires mcmc)
        if densification == "mcmc" or representation == "2dgs":
            subcommand = "mcmc"
        else:
            subcommand = "default"
    
        save_steps = sorted({ckpt_interval, ckpt_interval * 2, iterations})
        ply_steps = save_steps[:]
    
        cmd = [
            "python",
            str(TRAINER_PATH),
            subcommand,
            "--data-type",
            "colmap",
            "--data_dir",
            str(workspace),
            "--result_dir",
            str(result_dir),
            "--max_steps",
            str(iterations),
            "--save_ply",
            "--disable_video",
        ]
        for step in save_steps:
            cmd.extend(["--save-steps", str(step)])
        for step in ply_steps:
            cmd.extend(["--ply-steps", str(step)])
    
        if representation == "2dgs":
            cmd.append("--with_eval3d")
        if pose_opt == "joint":
            cmd.append("--pose_opt")
    
        if enable_live_viewer and viewer_port:
            cmd.extend(["--port", str(viewer_port)])
        else:
            cmd.append("--disable_viewer")
    
        return cmd
    
    
    def run_gsplat_train(
        workspace: Path,
        output_dir: Path,
        cfg: dict,
        log: Callable[[str], None],
        *,
        on_checkpoint: Callable[[int, Path, Path], None] | None = None,
        cancel_check: Callable[[], bool] | None = None,
        enable_live_viewer: bool = False,
        viewer_port: int | None = None,
    ) -> dict[str, str]:
        representation = cfg.get("stages", {}).get("representation", "3dgs")
        densification = cfg.get("stages", {}).get("densification", "default_adc")
        iterations = int(cfg.get("iterations", 30000))
        ckpt_interval = int(cfg.get("checkpoint_interval", 7000))
    
        result_dir = output_dir / "splat"
        result_dir.mkdir(parents=True, exist_ok=True)
    
        if not TRAINER_PATH.is_file():
            log(f"gsplat trainer not found at {TRAINER_PATH} — simulating {iterations} iters")
            ply_final = result_dir / "point_cloud.ply"
            splat_final = result_dir / "scene.splat"
            ply_final.write_text("ply\ncomment simulated\n")
            splat_final.write_text("# simulated\n")
            return {"ply": str(ply_final), "splat": str(splat_final), "dir": str(result_dir)}
    
        cmd = _build_trainer_cmd(
            workspace,
            result_dir,
            cfg,
            enable_live_viewer=enable_live_viewer,
            viewer_port=viewer_port,
        )
        log(f"gsplat train: {' '.join(cmd)}")
    
        env = os.environ.copy()
        # Keep site-packages ahead of /opt/gsplat so the CUDA wheel wins; examples cwd supplies scripts
        py = env.get("PYTHONPATH", "")
        parts = [p for p in py.split(":") if p and p != "/opt/gsplat"]
        env["PYTHONPATH"] = ":".join(parts)
    
        proc = subprocess.Popen(
            cmd,
            stdout=subprocess.PIPE,
            stderr=subprocess.STDOUT,
            text=True,
            env=env,
            cwd=str(TRAINER_PATH.parent),
        )
        last_ckpt_step = 0
        for line in proc.stdout or []:
            log(line.rstrip())
            if "Step:" in line and on_checkpoint:
                last_ckpt_step += 1
                ckpt = find_latest_checkpoint(result_dir)
                if ckpt:
                    try:
                        partial = export_from_checkpoint(ckpt, result_dir, log)
                        ply_p = Path(partial.get("ply", result_dir / "point_cloud.ply"))
                        splat_p = Path(partial.get("splat", result_dir / "scene.splat"))
                        on_checkpoint(last_ckpt_step * ckpt_interval, ply_p, splat_p)
                    except Exception as exc:
                        log(f"checkpoint export warn: {exc}")
            if cancel_check and cancel_check():
                proc.terminate()
                raise RuntimeError("Training cancelled")
    
        proc.wait()
        if proc.returncode != 0:
            raise RuntimeError(f"gsplat training failed: {proc.returncode}")
    
        ckpt = find_latest_checkpoint(result_dir)
        if not ckpt:
            raise RuntimeError("training finished but no checkpoint found")
    
        artifacts = export_from_checkpoint(ckpt, result_dir, log)
        artifacts["ckpt"] = str(ckpt)
    
        meta = {
            "representation": representation,
            "densification": densification,
            "iterations": iterations,
            "pose_opt": cfg.get("stages", {}).get("pose_opt", "off"),
            "ckpt": str(ckpt),
        }
        (result_dir / "train_meta.json").write_text(json.dumps(meta, indent=2))
        return artifacts
    
