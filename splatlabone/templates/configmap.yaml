        <section class="card" id="what">
          <h2>What SplatLab is</h2>
          <p>SplatLab One is a <strong>3D Gaussian Splatting (3DGS)</strong> pipeline for Olares One. You import photos or video, run a configurable reconstruction pipeline, and get viewable / editable splat assets.</p>
          <p>It combines:</p>
          <ul>
            <li><strong>Structure-from-Motion (SfM)</strong> — estimate camera poses from photos</li>
            <li><strong>Feed-forward geometry</strong> — neural networks that predict poses + depth when COLMAP is slow or fails</li>
            <li><strong>gsplat training</strong> — optimize 3D Gaussians for high-quality novel-view synthesis</li>
            <li><strong>Web UI + REST + MCP</strong> — human workflow and agent automation on the same API</li>
          </ul>
          <p>The app runs as a GPU workload on Olares One (RTX 5090M). Non-admin users reach it through an nginx client chart; the GPU server is a shared admin subchart.</p>
        </section>
    
        <section class="card" id="architecture">
          <h2>Architecture &amp; deployment</h2>
          <h3>Helm charts (Olares)</h3>
          <table>
            <tr><th>Chart</th><th>Role</th></tr>
            <tr><td><code>splatlabonesrv/</code></td><td>GPU server — FastAPI on port <strong>7860</strong>, admin-only install. Runs pipeline, holds <code>/data</code> volumes.</td></tr>
            <tr><td><code>splatlabone/</code></td><td>Client proxy — nginx openresty on <strong>8080</strong> → <code>splatlabone.splatlabonesrv-shared:7860</code>. What users open in the browser.</td></tr>
            <tr><td>Root chart</td><td><code>subCharts</code>: server (<code>shared: true</code>) + client. Manifest declares shared entrances for API/MCP (port 0, internal).</td></tr>
          </table>
    
          <h3>Application layers</h3>
          <table>
            <tr><th>Layer</th><th>Location</th><th>Role</th></tr>
            <tr><td>FastAPI</td><td><code>app/main.py</code></td><td>HTTP server, static UI mount, job worker lifespan, Viser idle cleanup</td></tr>
            <tr><td>Job queue</td><td><code>app/jobs/worker.py</code></td><td>Single-thread queue; one pipeline job at a time; SSE fan-out</td></tr>
            <tr><td>Pipeline</td><td><code>app/pipeline/</code></td><td>SfM → geometry → gsplat train → export</td></tr>
            <tr><td>REST API</td><td><code>app/api/</code></td><td>ingest, jobs, scenes, viewer proxy, live WS, meta/capabilities</td></tr>
            <tr><td>MCP</td><td><code>app/mcp_server.py</code></td><td>Streamable HTTP at <code>/mcp/mcp</code> for agents</td></tr>
            <tr><td>Static UI</td><td><code>app/static/</code></td><td>Import, pipeline config, jobs, viewer, this guide</td></tr>
          </table>
    
          <h3>Data directories</h3>
          <p>Root: <code>DATA_DIR</code> (default <code>/data</code> on Olares, hostPath volumes in Helm).</p>
          <table>
            <tr><th>Path</th><th>Env var</th><th>Contents</th></tr>
            <tr><td><code>uploads/{dataset_id}/</code></td><td><code>UPLOADS_DIR</code></td><td>Ingested images, optional <code>sparse/0</code> from COLMAP zip</td></tr>
            <tr><td><code>workspaces/{job_id}/</code></td><td><code>WORKSPACES_DIR</code></td><td>Per-job COLMAP workspace: <code>images/</code>, <code>sparse/0/</code>, <code>geometry/</code></td></tr>
            <tr><td><code>outputs/{job_id}/</code></td><td><code>OUTPUTS_DIR</code></td><td>Train results (<code>splat/</code>), stage artifacts (<code>stages/</code>), <code>manifest.json</code></td></tr>
            <tr><td><code>splatlab/cache/models</code></td><td><code>SPLATLAB_MODEL_CACHE</code></td><td>HuggingFace / URL weight cache</td></tr>
            <tr><td><code>splatlab/cache/modelscope</code></td><td><code>MODELSCOPE_CACHE</code></td><td>ModelScope cache (VGGT-Omega, LingBot-Map)</td></tr>
          </table>
        </section>
    
        <section class="card" id="workflow">
          <h2>End-to-end workflow</h2>
          <pre class="diagram">Import (UI / REST / MCP)
      └─► uploads/ds_xxx/images/  [+ sparse/0 if COLMAP zip]
    
    Create job (preset + overrides + realtime mode)
      └─► Job queued → PipelineRunner
    
    Workspace setup
      └─► workspaces/job_xxx/images  ← symlink or copy from dataset
      └─► workspaces/job_xxx/sparse/0  ← copy if dataset already has COLMAP
    
    Stage 1: SfM (optional)
      └─► glomap or colmap → sparse/0 (poses + sparse points)
      └─► publish sfm_sparse_ply
    
    Stage 2: Geometry (optional)
      └─► vggt_omega | da3 | lingbot_map | instant_splat
      └─► writes sparse/0 + backend-specific artifacts (infer_gs.ply, etc.)
      └─► publish geometry artifacts
    
    Stage 3: gsplat train (skipped if geometry_preview mode)
      └─► simple_trainer.py --data-type colmap --data_dir workspace
      └─► outputs/job_xxx/splat/  (ckpt, ply, splat)
      └─► export ply_compressed for SuperSplat editing
    
    View / download
      └─► Viewer: sparse points | infer_gs SuperSplat | gsplat Viser
      └─► REST: /api/v1/scenes/{job}/…</pre>
          <p>Jobs emit <strong>SSE events</strong> on <code>/api/v1/jobs/{id}/events</code> so the UI and MCP can show live progress without polling.</p>
        </section>
    
        <section class="card" id="colmap">
          <h2>Why COLMAP is the hub</h2>
          <p>Every geometry backend and SfM stage converges on the same on-disk layout:</p>
          <ul>
            <li><code>workspace/images/</code> — input photos (filenames referenced by COLMAP)</li>
            <li><code>workspace/sparse/0/</code> — COLMAP model: <code>cameras.*</code>, <code>images.*</code>, <code>points3D.*</code></li>
          </ul>
          <p><strong>gsplat</strong> only knows one dataset format here: <code>--data-type colmap</code>. Feed-forward networks (VGGT-Omega, DA3, LingBot) don't train Gaussians themselves — they <em>produce COLMAP poses</em> (and sometimes sparse points) so gsplat can refine a splat scene on Olares One hardware.</p>
          <p>DA3 is special: it also exports <code>infer_gs.ply</code> (feed-forward 3D Gaussians) for instant preview in SuperSplat, while its COLMAP export feeds the gsplat refine step.</p>
          <p>Helpers live in <code>pipeline/colmap_io.py</code>: write/read COLMAP text models, export sparse PLY for visualization, unproject depth to 3D points.</p>
        </section>
    
        <section class="card" id="pipeline">
          <h2>Pipeline stages</h2>
    
          <h3>1. SfM — Structure from Motion</h3>
          <p><code>pipeline/sfm/</code> — classic photogrammetry from unordered photos.</p>
          <table>
            <tr><th>Backend</th><th>What it runs</th><th>When</th></tr>
            <tr><td><code>glomap</code></td><td><code>glomap mapper</code> if binary present; else COLMAP 4 <code>global_mapper</code> (feature_extractor → exhaustive_matcher → global_mapper)</td><td><strong>quality</strong> preset</td></tr>
            <tr><td><code>colmap</code></td><td>Classic COLMAP <code>mapper</code> (not global_mapper)</td><td>Advanced override</td></tr>
            <tr><td><code>skip</code></td><td>No SfM — use ingested COLMAP or geometry front-end</td><td>Feed-forward presets</td></tr>
          </table>
          <p><strong>COLMAP</strong> (binary in Docker image from <code>colmap/colmap:latest</code>) finds feature matches across photos and solves for camera intrinsics/extrinsics plus a sparse 3D point cloud.</p>
    
          <h3>2. Geometry — feed-forward pose providers</h3>
          <p><code>pipeline/geometry/</code> — neural alternatives when you skip SfM or need faster / more robust init.</p>
          <table>
            <tr><th>Backend</th><th>Library</th><th>Output</th></tr>
            <tr><td><code>vggt_omega</code></td><td>Meta VGGT-Omega</td><td>Poses + depth → COLMAP sparse/0 + sparse PLY preview</td></tr>
            <tr><td><code>da3</code></td><td>Depth Anything 3</td><td>COLMAP export + <strong>infer_gs.ply</strong> (feed-forward Gaussians) + optional GLB</td></tr>
            <tr><td><code>lingbot_map</code></td><td>LingBot-Map GCTStream</td><td>Streaming video geometry → COLMAP + sparse PLY</td></tr>
            <tr><td><code>instant_splat</code></td><td>InstantSplat + MASt3R</td><td>3–12 images → COLMAP via <code>init_geo.py</code></td></tr>
            <tr><td><code>none</code></td><td>—</td><td>SfM or pre-ingested COLMAP only</td></tr>
          </table>
    
          <h3>3. gsplat train — Gaussian optimization</h3>
          <p><code>pipeline/train/</code> invokes <code>/opt/gsplat/examples/simple_trainer.py</code>:</p>
          <ul>
            <li><code>default</code> subcommand — standard 3DGS with adaptive densification</li>
            <li><code>mcmc</code> subcommand — 2DGS surfels + MCMC densification (noisy init friendly)</li>
            <li><code>--with_eval3d</code> when <code>representation=2dgs</code></li>
            <li><code>--pose_opt</code> when <code>pose_opt=joint</code> (refine poses during train)</li>
            <li><code>--port</code> for live Viser during <code>progressive_splat</code> mode</li>
          </ul>
    
          <h3>4. Export</h3>
          <p><code>pipeline/export.py</code> uses <code>gsplat.export_splats()</code> from latest checkpoint:</p>
          <ul>
            <li><code>scene.splat</code> — compact splat format</li>
            <li><code>point_cloud.ply</code> — standard PLY</li>
            <li><code>scene.ply_compressed</code> — SuperSplat edit format</li>
            <li><code>*.pt</code> checkpoint — for gsplat Viser viewer</li>
          </ul>
        </section>
    
        <section class="card" id="libraries">
          <h2>Libraries &amp; what each does</h2>
    
          <h3>Core stack (always installed)</h3>
          <table>
            <tr><th>Library</th><th>Role in SplatLab</th></tr>
            <tr><td><strong>PyTorch 2.11 cu128</strong></td><td>GPU inference + gsplat CUDA kernels (sm_120 Blackwell on Olares One)</td></tr>
            <tr><td><strong>gsplat</strong></td><td>Train 3DGS/2DGS (<code>simple_trainer.py</code>), export splats, Viser viewer (<code>simple_viewer.py</code>)</td></tr>
            <tr><td><strong>COLMAP</strong></td><td>SfM binaries: feature extraction, matching, mapping / global_mapper</td></tr>
            <tr><td><strong>FastAPI + uvicorn</strong></td><td>HTTP API and static UI server</td></tr>
            <tr><td><strong>viser + nerfview</strong></td><td>3D web viewer used by gsplat's <code>simple_viewer.py</code> (not called directly from SplatLab Python)</td></tr>
            <tr><td><strong>httpx + websockets</strong></td><td>Proxy HTTP/WebSocket from browser → local Viser process</td></tr>
            <tr><td><strong>MCP (Python SDK)</strong></td><td>Agent tools at <code>/mcp/mcp</code></td></tr>
            <tr><td><strong>scipy</strong></td><td>Rotation / quaternion math for COLMAP I/O</td></tr>
            <tr><td><strong>huggingface_hub + modelscope</strong></td><td>Download geometry model weights (ModelScope-first for Meta models)</td></tr>
          </table>
    
          <h3>Geometry backends (baked into Docker at <code>/opt/*</code>)</h3>
          <table>
            <tr><th>Path</th><th>Upstream</th><th>Purpose</th></tr>
            <tr><td><code>/opt/gsplat</code></td><td>nerfstudio-project/gsplat</td><td>Training, export, Viser examples</td></tr>
            <tr><td><code>/opt/vggt-omega</code></td><td>facebookresearch/vggt-omega</td><td>Feed-forward multi-view pose + depth (robust preset)</td></tr>
            <tr><td><code>/opt/da3</code></td><td>ByteDance-Seed/Depth-Anything-3</td><td>Depth + pose + infer_gs Gaussians (fast preset)</td></tr>
            <tr><td><code>/opt/lingbot-map</code></td><td>Robbyant/lingbot-map</td><td>Streaming / video chunk geometry (stream preset)</td></tr>
            <tr><td><code>/opt/instantsplat</code></td><td>NVlabs/InstantSplat</td><td>Sparse-view init via <code>init_geo.py</code></td></tr>
            <tr><td><code>/opt/instantsplat/dust3r</code>, <code>mast3r</code></td><td>naver/dust3r, naver/mast3r</td><td>MASt3R matching for InstantSplat</td></tr>
          </table>
          <p>Source trees are fetched at image build by <code>docker/fetch_backends.py</code> (GitHub tarballs). <strong>Weights are not in the image</strong> — prefetched at pod start via initContainer (<code>scripts/download_models.py</code>).</p>
    
          <h3>Model weights</h3>
          <table>
            <tr><th>Key</th><th>Model</th><th>Hub</th></tr>
            <tr><td><code>vggt_omega</code></td><td>facebook/VGGT-Omega</td><td>ModelScope → HF fallback</td></tr>
            <tr><td><code>lingbot</code></td><td>Robbyant/lingbot-map</td><td>ModelScope → HF fallback</td></tr>
            <tr><td><code>da3</code></td><td>depth-anything/DA3NESTED-GIANT-LARGE</td><td>HuggingFace</td></tr>
            <tr><td><code>mast3r</code></td><td>MASt3R ViTLarge checkpoint</td><td>Direct URL</td></tr>
          </table>
          <p>Set <code>HF_TOKEN</code> for gated models. VGGT/LingBot prefer ModelScope on Olares.</p>
    
          <h3>UI-only (CDN)</h3>
          <table>
            <tr><th>Library</th><th>Role</th></tr>
            <tr><td><strong>Three.js + PLYLoader</strong></td><td>In-browser preview of sparse COLMAP point clouds (vertices only)</td></tr>
            <tr><td><strong>PlayCanvas SuperSplat</strong> (external)</td><td>View/edit 3D Gaussian PLY — infer_gs and ply_compressed exports</td></tr>
          </table>
    
          <h3>Not yet integrated</h3>
          <ul>
            <li><strong>ArtiFixer</strong> — splat repair; deferred (needs 48GB+ VRAM)</li>
            <li><strong>Live WS geometry</strong> (<code>api/live.py</code>) — accepts frames but does not run pipeline yet (stub)</li>
          </ul>
        </section>
    
