        let es = null;
    
        async function refreshJobs() {
          const data = await api("/api/v1/jobs");
          const tbody = document.querySelector("#jobs-table tbody");
          tbody.innerHTML = "";
          for (const j of data.jobs || []) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td><code>${j.id}</code></td><td>${j.preset}</td><td>${j.state}</td><td>${j.stage}</td>
              <td>${Math.round((j.progress || 0) * 100)}%</td>
              <td><a href="?job=${j.id}">Details</a></td>`;
            tbody.appendChild(tr);
          }
        }
    
        function appendLog(line) {
          const el = document.getElementById("job-log");
          el.textContent += line + "\n";
          el.scrollTop = el.scrollHeight;
        }
    
        async function showJob(id) {
          focusJob = id;
          document.getElementById("detail-card").hidden = false;
          document.getElementById("detail-id").textContent = id;
          document.getElementById("job-log").textContent = "";
          if (es) es.close();
          es = new EventSource(`/api/v1/jobs/${id}/events`);
          es.onmessage = (ev) => {
            try {
              const data = JSON.parse(ev.data);
              if (data.type === "log") appendLog(data.line);
              if (data.progress != null) {
                document.getElementById("detail-progress").style.width = `${Math.round(data.progress * 100)}%`;
              }
              if (data.type === "checkpoint_ready") appendLog(`[checkpoint] iter=${data.iteration} splat=${data.splat}`);
              if (data.type === "stage_artifacts") {
                const keys = Object.keys(data.artifacts || {}).join(", ");
                appendLog(`[${data.stage}] artifacts: ${keys}`);
              }
              if (data.type === "geometry_preview") {
                appendLog(`[geometry_preview] ${data.path || ""}${data.infer_gs ? " infer_gs ready" : ""}`);
              }
              if (data.type === "job_complete") appendLog("[complete]");
              if (data.type === "error") appendLog("[error] " + data.message);
            } catch (_) {}
          };
          const j = await api(`/api/v1/jobs/${id}`);
          document.getElementById("detail-progress").style.width = `${Math.round((j.progress || 0) * 100)}%`;
        }
    
        document.getElementById("refresh-jobs").onclick = refreshJobs;
        document.getElementById("cancel-job").onclick = async () => {
          if (!focusJob) return;
          await api(`/api/v1/jobs/${focusJob}/cancel`, { method: "POST" });
        };
        document.getElementById("view-splat").onclick = () => {
          if (focusJob) location.href = `/viewer.html?job=${focusJob}#splats`;
        };
        document.getElementById("view-map").onclick = () => {
          if (focusJob) location.href = `/viewer.html?job=${focusJob}#map`;
        };
    
        refreshJobs().then(() => { if (focusJob) showJob(focusJob); });
        setInterval(refreshJobs, 8000);
      </script>
    </body>
    </html>
    
