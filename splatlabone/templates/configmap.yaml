      <style>
        #viser-frame { width: 100%; height: 70vh; border: 1px solid #333; border-radius: 8px; background: #111; }
        .export-links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
        #pcanvas { width: 100%; height: 420px; border: 1px solid #333; border-radius: 8px; background: #0a0a0a; }
        .artifact-list { list-style: none; padding: 0; margin: 0.75rem 0; }
        .artifact-list li { padding: 0.5rem 0; border-bottom: 1px solid #2a2a2a; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .artifact-list .stage-tag { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; }
        .artifact-list .label { flex: 1 1 200px; }
