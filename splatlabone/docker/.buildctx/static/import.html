<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Import — SplatLab One</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>SplatLab One</h1>
    <nav>
      <a href="/index.html">Dashboard</a>
      <a href="/import.html">Import</a>
      <a href="/pipeline.html">Pipeline</a>
      <a href="/jobs.html">Jobs</a>
      <a href="/viewer.html">Viewer</a>
      <a href="/guide.html">Guide</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Import dataset</h2>
      <div class="grid">
        <form id="form-images">
          <h3>Images</h3>
          <label>Files <input type="file" id="images-files" multiple accept="image/*" required /></label>
          <label>Name <input type="text" id="images-name" placeholder="my-scene" /></label>
          <button type="submit">Upload images</button>
        </form>
        <form id="form-zip">
          <h3>Images zip</h3>
          <label>Zip <input type="file" id="zip-file" accept=".zip" required /></label>
          <button type="submit">Upload zip</button>
        </form>
        <form id="form-video">
          <h3>Video</h3>
          <label>Video <input type="file" id="video-file" accept="video/*" required /></label>
          <label>FPS <input type="number" id="video-fps" value="2" step="0.5" min="0.5" max="30" /></label>
          <label>Max frames <input type="number" id="video-max" value="200" min="10" max="2000" /></label>
          <button type="submit">Extract frames</button>
        </form>
        <form id="form-colmap">
          <h3>COLMAP workspace</h3>
          <label>Zip (images/ + sparse/) <input type="file" id="colmap-zip" accept=".zip" required /></label>
          <button type="submit">Upload COLMAP</button>
        </form>
      </div>
      <pre id="import-status" class="status"></pre>
    </section>
    <section class="card">
      <h2>Datasets</h2>
      <button type="button" id="refresh-datasets" class="secondary">Refresh</button>
      <table id="datasets-table"><thead><tr><th>ID</th><th>Type</th><th>Frames</th><th></th></tr></thead><tbody></tbody></table>
    </section>
  </main>
  <script type="module">
    import { api } from "/js/app.js";

    const status = document.getElementById("import-status");
    const log = (o) => { status.textContent = typeof o === "string" ? o : JSON.stringify(o, null, 2); };

    async function refreshDatasets() {
      const data = await api("/api/v1/ingest/datasets");
      const tbody = document.querySelector("#datasets-table tbody");
      tbody.innerHTML = "";
      for (const d of data.datasets || []) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><code>${d.dataset_id}</code></td><td>${d.type}</td><td>${d.frame_count}</td>
          <td><a href="/pipeline.html?dataset=${d.dataset_id}">Pipeline →</a></td>`;
        tbody.appendChild(tr);
      }
    }

    document.getElementById("refresh-datasets").onclick = refreshDatasets;

    document.getElementById("form-images").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      const files = document.getElementById("images-files").files;
      for (const f of files) fd.append("files", f);
      fd.append("name", document.getElementById("images-name").value);
      log(await api("/api/v1/ingest/images", { method: "POST", body: fd }));
      refreshDatasets();
    };

    document.getElementById("form-zip").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append("archive", document.getElementById("zip-file").files[0]);
      log(await api("/api/v1/ingest/images-zip", { method: "POST", body: fd }));
      refreshDatasets();
    };

    document.getElementById("form-video").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append("video", document.getElementById("video-file").files[0]);
      fd.append("fps", document.getElementById("video-fps").value);
      fd.append("max_frames", document.getElementById("video-max").value);
      log(await api("/api/v1/ingest/video", { method: "POST", body: fd }));
      refreshDatasets();
    };

    document.getElementById("form-colmap").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append("archive", document.getElementById("colmap-zip").files[0]);
      log(await api("/api/v1/ingest/colmap", { method: "POST", body: fd }));
      refreshDatasets();
    };

    refreshDatasets();
  </script>
</body>
</html>
